                    currentIndex: mm.state ? mm.state.currentIndex : 'no-state',
                    currentPriority: mm.state ? mm.state.currentPriority : 'no-state',
                    internalModelUpdate: currentModel.internalModel && typeof currentModel.internalModel.update === 'function' ? 'exists' : 'missing',
                    autoUpdate: currentModel.autoUpdate,
                    _autoUpdate: currentModel._autoUpdate,
                    deltaTime: currentModel.deltaTime
                  });

                  // 100ms 后再次检查状态
                  setTimeout(() => {
                    try {
                      // ★ 关键诊断：检查 motionManager.update 返回值和 queueManager 状态
                      const qm = mm.queueManager;
                      let muResult = 'not-called';
                      let coreModel = currentModel.internalModel && currentModel.internalModel.coreModel;
                      if (coreModel && typeof mm.update === 'function') {
                        try {
                          muResult = mm.update(coreModel, performance.now());
                        } catch (muErr) { muResult = 'error: ' + muErr.message; }
                      }

                      // ★ 深度诊断：检查参数值是否真的变化了
                      let paramValues = {};
                      let paramIds = [];
                      let paramCount = 0;
                      let coreModelMethods = [];
                      let paramIndexResults = {};
                      try {
                        // 获取 coreModel 的所有方法名（看看有哪些可用的参数方法）
                        if (coreModel) {
                          const proto = Object.getPrototypeOf(coreModel);
                          coreModelMethods = Object.getOwnPropertyNames(proto).filter(n => typeof coreModel[n] === 'function');
                          // 也检查自身属性
                          const ownMethods = Object.keys(coreModel).filter(n => typeof coreModel[n] === 'function');
                          coreModelMethods = [...new Set([...coreModelMethods, ...ownMethods])].sort();
                        }
                        if (coreModel && typeof coreModel.getParameterCount === 'function') {
                          paramCount = coreModel.getParameterCount();
                          // 尝试使用 getParameterIds()（如果存在）
                          if (typeof coreModel.getParameterIds === 'function') {
                            try {
                              const ids = coreModel.getParameterIds();
                              if (Array.isArray(ids)) {
                                paramIds = ids.slice(0, 30);
                              }
                            } catch (e) { paramIds = ['getParameterIds_error:' + e.message]; }
                          }
                          // 如果 getParameterIds 不存在或失败，尝试其他方法
                          if (paramIds.length === 0) {
                            // 尝试 _parameters 或 _parameterValues 等内部属性
                            const internalProps = ['_parameters', '_parameterValues', '_parameterIds', 'parameters', 'parameterIds'];
                            for (const prop of internalProps) {
                              if (coreModel[prop] !== undefined) {
                                try {
                                  const val = coreModel[prop];
                                  if (Array.isArray(val)) {
                                    paramIds = val.slice(0, 30).map((v, i) => typeof v === 'string' ? v : (v && v.id ? v.id : 'idx_' + i + ':' + typeof v));
                                  } else if (val && typeof val === 'object') {
                                    paramIds = Object.keys(val).slice(0, 30);
                                  }
                                  if (paramIds.length > 0) break;
                                } catch (e) {}
                              }
                            }
                          }
                          // 检查几个关键参数的索引和值
                          const checkParams = ['ParamAngleX', 'ParamAngleY', 'ParamAngleZ', 'ParamMouthOpenY', 'ParamMouthForm', 'ParamBodyAngleX', 'Param2'];
                          for (const pid of checkParams) {
                            try {
                              const idx = coreModel.getParameterIndex(pid);
                              paramIndexResults[pid] = { index: idx, type: typeof idx };
                              if (idx >= 0 && typeof idx === 'number') {
                                const val = coreModel.getParameterValueByIndex(idx);
                                paramValues[pid] = { value: val, type: typeof val };
                              } else {
                                paramValues[pid] = 'NOT_FOUND (idx=' + idx + ')';
                              }
                            } catch (e) { paramValues[pid] = 'error:' + e.message; }
                          }
                        }
                      } catch (pvErr) { paramValues.error = pvErr.message; }

                      // ★ 检查第一个 motion 的曲线信息
                      let motionInfo = {};
                      try {
                        const firstEntry = qm && qm._motions && qm._motions[0];
                        const firstMotion = firstEntry && firstEntry._motion;
                        if (firstMotion) {
                          motionInfo = {
                            weight: firstMotion._weight,
                            fadeIn: firstMotion._fadeInSeconds,
                            fadeOut: firstMotion._fadeOutSeconds,
                            isLoop: firstMotion._isLoop,
                            curveCount: firstMotion._motionData ? firstMotion._motionData.curveCount : 'no-motionData',
                            duration: firstMotion._motionData ? firstMotion._motionData.duration : 'no-motionData',
                            // 获取前10条曲线的 ID
                            curveIds: firstMotion._motionData && firstMotion._motionData.curves
                              ? firstMotion._motionData.curves.slice(0, 10).map(c => c.id)
                              : 'no-curves'
                          };
                        }
                      } catch (miErr) { motionInfo.error = miErr.message; }

                      console.log('[L2D] 动作状态诊断 - 100ms后:', {
                        isFinished: typeof mm.isFinished === 'function' ? mm.isFinished() : 'no-method',
                        playing: mm.playing,
                        currentGroup: mm.state ? mm.state.currentGroup : 'no-state',
                        deltaTime: currentModel.deltaTime,
                        elapsedTime: currentModel.elapsedTime,
                        motionManagerUpdateResult: muResult,
                        queueManagerExists: !!qm,
                        queueManagerIsFinished: qm && typeof qm.isFinished === 'function' ? qm.isFinished() : 'no-method',
                        queueMotionsLength: qm && qm._motions ? qm._motions.length : 'no-_motions',
                        // 第一个 motion 的详细信息
                        motionInfo: motionInfo,
                        // 模型参数信息
                        modelParamCount: paramCount,
                        modelParamIds: paramIds,
                        paramValues: paramValues
                      });
                      // 如果 100ms 后 isFinished=true 且 playing=false，说明动作立即结束了
                      if (typeof mm.isFinished === 'function' && mm.isFinished() && !mm.playing) {
                        console.warn('[L2D] ⚠ 动作在 100ms 内就结束了！可能是 motion 数据有问题或 update 没被调用');
                      }
                      // 如果 motionManager.update 返回 false，说明队列中没有动作或更新失败
                      if (muResult === false) {
                        console.warn('[L2D] ⚠ motionManager.update 返回 false！队列中没有动作或更新失败');
                      }
                      // 如果 queueManager.currentMotion 为 null，说明动作没有加入队列
                      if (qm && qm.currentMotion === null) {
                        console.warn('[L2D] ⚠ queueManager.currentMotion 为 null！动作没有加入队列');
                      }
                    } catch (e) { console.error('[L2D] 100ms 状态检查异常:', e.message); }
                  }, 100);

                  // 500ms 后再次检查
                  setTimeout(() => {
                    try {
                      console.log('[L2D] 动作状态诊断 - 500ms后:', {
                        isFinished: typeof mm.isFinished === 'function' ? mm.isFinished() : 'no-method',
                        playing: mm.playing,
                        deltaTime: currentModel.deltaTime,
                        elapsedTime: currentModel.elapsedTime
                      });
                    } catch (e) {}
                  }, 500);

                  // 检查 internalModel.update 是否被调用（通过 deltaTime 是否变化）
                  let lastDelta = currentModel.deltaTime;
                  let updateCount = 0;
                  const updateChecker = setInterval(() => {
                    updateCount++;
                    if (currentModel.deltaTime !== lastDelta) {
                      console.log('[L2D] ✓ internalModel.update 被调用了 (deltaTime变化:', lastDelta, '→', currentModel.deltaTime + ', 检查次数:', updateCount + ')');
                      clearInterval(updateChecker);
                    }
                    if (updateCount >= 30) {
                      console.warn('[L2D] ⚠ internalModel.update 30次检查内未被调用！deltaTime始终=', lastDelta);
                      clearInterval(updateChecker);
                    }
                  }, 16);
                }
              } catch (diagErr) { console.error('[L2D] 动作状态诊断异常:', diagErr.message); }
            }
          }).catch(err => {
            console.warn('[L2D] 动作加载失败:', group, err && err.message);
            showBubble('动作加载失败: ' + group, 1500);
          });
        }
        return true;
      } catch (e) {
        console.warn('[L2D] 动作播放异常:', group, e.message);
        showBubble('动作播放异常: ' + group, 1500);
        return false;
      }
    }

    // 按表情名（或索引）播放 Live2D 表情。MMD 无等价概念时尝试按意图映射。
    function playExpression(nameOrIndex) {
      if (currentPetType === 'MMD' && mmdPet) { if (mmdPet.setExpression) mmdPet.setExpression(nameOrIndex); return true; }
      if (!useLive2D || !currentModel) return false;
      try {
        const p = currentModel.expression(nameOrIndex);
        if (p && typeof p.catch === 'function') {
          p.catch(err => {
            console.warn('[L2D] 表情加载失败:', nameOrIndex, err && err.message);
            showBubble('表情加载失败: ' + nameOrIndex, 1500);
          });
        }
        return true;
      } catch (e) {
        console.warn('[L2D] 表情播放异常:', nameOrIndex, e.message);
        showBubble('表情播放异常: ' + nameOrIndex, 1500);
        return false;
      }
    }

    // 触发第 index 个 Live2D 动作/表情（0 基；小键盘 1 对应 index 0，0 对应 index 9）。
    function triggerL2DAction(index) {
      if (currentPetType === 'MMD') return false;
      if (!useLive2D || !currentModel) return false;
      const acts = getLive2DActions();
      const a = acts[index];
      if (!a) { showBubble('该按键没有对应动作', 1200); return false; }
      let ok = false;
      if (a.type === 'motion') ok = playMotionGroup(a.value);
      else ok = playExpression(a.value);
      if (ok) showBubble(l2dLabel(a.value), 1000);
      return ok;
    }

    // 动态构建 Live2D 动作模组面板：列出当前模型真实拥有的动作组与表情 + 小键盘编号。
    function buildL2DPanel() {
      const panel = document.getElementById('l2d-panel');
      if (!panel) return;
      // ★ 确保面板和关闭按钮能接收点击事件（防止 pointer-events 被全局样式覆盖）
      panel.style.pointerEvents = 'auto';
      const acts = getLive2DActions();
      let html = '<div class="l2d-title"><span>Live2D 动作模组</span><span class="l2d-close" title="关闭">×</span></div>';
      if (!acts.length) {
        html += '<div class="l2d-empty">当前模型没有可触发的动作组或表情。\n导入含 motions / expressions 的 Live2D 模型后，这里会自动列出。</div>';
        panel.innerHTML = html;
      } else {
        const numpadKeys = ['1','2','3','4','5','6','7','8','9','0'];
        let lastType = null;
        acts.forEach((a, i) => {
          const key = numpadKeys[i] || '';
          if (a.type !== lastType) {
            html += '<div class="l2d-group">' + (a.type === 'motion' ? '动作' : '表情') + '</div>';
            lastType = a.type;
          }
          html += '<div class="l2d-item' + (a.type === 'expr' ? ' expr' : '') + '" data-type="' + a.type +
                  '" data-value="' + (a.value || '').replace(/"/g, '&quot;') + '">' +
                  (key ? '<span class="l2d-key">' + key + '</span>' : '') +
                  '<span class="l2d-label">' + (a.label || a.value) + '</span></div>';
        });
        html += '<div class="l2d-group" style="color:rgba(255,255,255,0.35);font-weight:400;">小键盘 1-0 也可直接触发</div>';
        panel.innerHTML = html;
        panel.querySelectorAll('.l2d-item').forEach(item => {
          item.addEventListener('click', () => {
            const type = item.dataset.type;
            const value = item.dataset.value;
            if (type === 'motion') playMotionGroup(value);
            else playExpression(value);
            showBubble(l2dLabel(value), 1000);
          });
        });
      }
      // ★ 关闭按钮：使用事件委托，在面板上监听点击，判断目标是否为关闭按钮
      // 比单独 querySelector + addEventListener 更可靠，避免面板重建后事件丢失
      if (!panel._l2dCloseBound) {
        panel.addEventListener('click', (e) => {
          if (e.target && e.target.classList && e.target.classList.contains('l2d-close')) {
            e.stopPropagation();
            toggleL2DPanel(false);
          }
        });
        // 同时监听 mousedown 作为兜底（某些情况下 click 可能不触发）
        panel.addEventListener('mousedown', (e) => {
          if (e.target && e.target.classList && e.target.classList.contains('l2d-close')) {
            e.stopPropagation();
            toggleL2DPanel(false);
          }
        });
        panel._l2dCloseBound = true;
        console.log('[l2d-panel] 关闭按钮事件委托已绑定');
      }
    }

    // 切换 Live2D 动作模组面板（独立窗口，不遮挡模型）
    let l2dPanelOpen = false;
    function toggleL2DPanel(force) {
      const show = (typeof force === 'boolean') ? force : !l2dPanelOpen;
      if (show) {
        if (currentPetType === 'MMD') { showBubble('小键盘动作模组仅 Live2D 模型支持', 1800); return; }
        const acts = getLive2DActions();
        buildL2DPanel(acts);
        if (inputArea) inputArea.classList.remove('show');
        const panel = document.getElementById('l2d-panel');
        if (window.api && typeof window.api.showActionPanel === 'function') {
          const panelWidth = 280;
          const estimatedHeight = Math.min((acts.length || 1) * 36 + 70, 600);
          const x = window.innerWidth + 8; // 独立窗口显示在宠物窗口右侧外面
          const y = Math.max(0, (window.innerHeight - estimatedHeight) / 2);
          window.api.showActionPanel(x, y, acts).catch(() => { if (panel) panel.classList.add('show'); });
        } else if (panel) {
          panel.classList.add('show');
        }
        l2dPanelOpen = true;
      } else {
        if (window.api && typeof window.api.hideActionPanel === 'function') {
          window.api.hideActionPanel().catch(() => {});
        }
        const panel = document.getElementById('l2d-panel');
        if (panel) panel.classList.remove('show');
        l2dPanelOpen = false;
      }
    }

    // 监听独立动作面板的动作触发
    if (window.api && typeof window.api.onActionPanelTrigger === 'function') {
      window.api.onActionPanelTrigger(({ type, value }) => {
        if (type === 'motion') playMotionGroup(value);
        else playExpression(value);
        showBubble(l2dLabel(value), 1000);
      });
    }
    // 监听独立动作面板关闭（失焦/点关闭按钮），重置状态
    if (window.api && typeof window.api.onActionPanelClosed === 'function') {
      window.api.onActionPanelClosed(() => {
        l2dPanelOpen = false;
      });
    }

    // 根据当前模型实际拥有的动作组，刷新右键菜单中"通用动作/姿势/肢体动作"项的可见性。
    // 2D(Live2D) 模型若没有对应动作组（如没有 dance/turn/squat 等），这些项无法触发，自动隐藏；
    // 同时若该模型发现了真实的 Live2D 动作/表情，则自动展开动作模组面板供使用。
    // （MMD 的动作系统独立于 availableMotions，通用项仍按原样显示，不做隐藏。）
    function refreshActionMenu() {
      const isL2D = (currentPetType === 'Live2D' && useLive2D);
      const isMMD = (currentPetType === 'MMD');
      const items = actionMenu.querySelectorAll('.menu-item[data-action^="act:"]');
      items.forEach(item => {
        const intent = (item.dataset.action || '').slice(4);
        let available = true;
        if (isL2D && intent) {
          available = (typeof PetBrain.hasMotion === 'function') ? !!PetBrain.hasMotion(intent) : false;
        } else if (isMMD && intent && mmdPet && typeof mmdPet.isIntentAvailable === 'function') {
          // MMD 模型：用户在动作编辑器中删除的内置动作不再显示在右键菜单
          available = mmdPet.isIntentAvailable(intent);
        }
        item.style.display = available ? '' : 'none';
      });
      // "动作模组" 入口仅在 Live2D 模型下可见（MMD 自身有动作体系，不需要 Live2D 动作模组）。
      // 非 Live2D 时隐藏该入口，下方"空分组标题"逻辑会自动连带隐藏「Live2D」分组标题。
      const l2dItem = actionMenu.querySelector('.menu-item[data-action="open-l2d"]');
      if (l2dItem) l2dItem.style.display = isL2D ? '' : 'none';
      // 隐藏没有可见子项的分组标题（如某模型所有"姿势"都用不了，则连"姿势"标题也藏起）
      actionMenu.querySelectorAll('.menu-section').forEach(sec => {
        let n = sec.nextElementSibling;
        let hasVisible = false;
        while (n && !n.classList.contains('menu-section')) {
          if (n.classList.contains('menu-item') && n.style.display !== 'none') { hasVisible = true; break; }
          n = n.nextElementSibling;
        }
        sec.style.display = hasVisible ? '' : 'none';
      });
      // 注意：不再自动展开动作模组面板——之前自动打开会导致面板遮挡右键菜单、且无法关闭。
      // 用户需通过右键菜单「动作模组」入口手动打开，面板自带关闭按钮。
    }

    // ====== 3D(MMD/PMX) 模型加载 ======
    // 销毁一个 WebGL 画布后，其上下文会 lost 且不可在同一元素上重建；
    // 因此每次销毁渲染器后都换一个全新 <canvas>（保留 id / class / 内联样式），
    // 确保下次 getContext 能拿到干净上下文。
    function cloneCanvasElement(oldEl) {
      const fresh = document.createElement('canvas');
      if (oldEl) {
        fresh.id = oldEl.id || '';
        fresh.className = oldEl.className || '';
        fresh.style.cssText = oldEl.style.cssText || '';
        if (oldEl.parentNode) oldEl.parentNode.replaceChild(fresh, oldEl);
      } else if (container) {
        container.insertBefore(fresh, container.firstChild);
      }
      return fresh;
    }

    // 销毁当前 MMD 实例与画布，复位为 Live2D 行为模式。
    // （即便随后走 CSS 降级，PetBrain 也不应再进入 MMD 分支。）
    function teardownMMD() {
      comboUserModel = null; // 清空组合模型引用
      toggleL2DPanel(false); // 切到 MMD 时收起 Live2D 动作模组面板
      if (mmdPet) {
        try { mmdPet.destroy(); } catch (e) {}
        mmdPet = null;
      }
      // 销毁 MMD 渲染器后换新画布（原画布 WebGL 上下文已 lost），切回 3D 时才能重新建上下文
      mmdCanvas = cloneCanvasElement(mmdCanvas);
      if (mmdCanvas) mmdCanvas.style.display = 'none';
      currentPetType = 'Live2D';
      // 切回 Live2D/CSS：恢复动态逐像素穿透（Live2D 的 shouldCaptureAtPoint 会接管）
      dynamicClickThrough = true;
      isCapturingMouse = false;
      window.api.setPetIgnoreMouseEvents(true, true);
    }

    // 组合模型主模型兜底选择（渲染端）：导入记录可能未带 primaryIndex（旧条目），
    // 这里按名称排除武器类、取其余中第一个作为人物主体。与 modelManager 的 selectPrimaryIndex 对齐。
    // （体积比较需要 fs，渲染端无 node 权限，故仅用名称启发式；主模型索引主要依赖导入时记录的 primaryIndex。）
    function choosePrimaryIndex(combo) {
      const acc = ['杖', '武器', '枪', '炮', '刀', '剑', '盾', '弓', '棒', '锤', '叉', '戟', '鞭', '伞', '扇',
        'staff', 'weapon', 'sword', 'gun', 'bow', 'shield', 'spear', 'axe', 'club', 'wand', 'cane',
        'blade', 'knife', 'lance', 'halberd', 'mace'];
      const isAcc = (n) => { n = (n || '').toLowerCase(); return acc.some(k => n.includes(k)); };
      for (let i = 0; i < combo.length; i++) {
        if (combo[i] && !isAcc(combo[i].name)) return i;
      }
      return 0;
    }

    // 加载 3D(MMD/PMX) 模型：隐藏 Live2D 画布、显示 MMD 画布，动态导入渲染模块并加载 PMX。
    // 返回是否加载成功（false 时调用方应走 CSS 降级）。
    async function loadMMDModel(userModel) {
      try {
        // ★ 切换到 MMD 前，必须彻底清理 Live2D/Bongocat 状态，否则默认模型残留不消失
        // 1. 停止 bongocat 交互（背景图片、键盘图片、鼠标跟随、全局钩子）
        if (window.isBongocatMode === true) {
          window.isBongocatMode = false;
          try { stopBongocatInteraction(); } catch (e) {}
          if (window.api && typeof window.api.setBongocatActive === 'function') {
            try { window.api.setBongocatActive(false); } catch (e) {}
          }
          // 隐藏 bongocat 背景图片和键盘图片
          const bgImg = document.getElementById('bongo-background-image');
          if (bgImg) bgImg.style.display = 'none';
          const keyImg = document.getElementById('bongo-key-image');
          if (keyImg) keyImg.style.display = 'none';
        }
        currentPetType = 'MMD'; // 先声明为 3D，使下方 refreshActionMenu 正确隐藏「动作模组」入口
        comboUserModel = null; // 先清空，避免切换到非组合模型后 Shift+F4 误调
        toggleL2DPanel(false); // 加载 MMD 时收起 Live2D 动作模组面板
        refreshActionMenu();   // 切回 MMD：复位被 Live2D 隐藏的通用动作/姿势/表情项（MMD 用自身动作体系，无需隐藏）
        // 画布切换：隐藏 Live2D，显示 MMD
        if (canvas) canvas.style.display = 'none';
        if (mmdCanvas) mmdCanvas.style.display = 'block';

        // 复用：销毁旧 MMD 实例并换新画布（原画布 WebGL 上下文已 lost，不可复用）
        if (mmdPet) { try { mmdPet.destroy(); } catch (e) {} mmdPet = null; }
        mmdCanvas = cloneCanvasElement(mmdCanvas);

        // ★ 先销毁 currentModel（从 stage 移除并释放资源），再销毁 PIXI
        if (currentModel) {
          try {
            if (pixiApp && pixiApp.stage) pixiApp.stage.removeChild(currentModel);
          } catch (e) {}
          try { currentModel.destroy({ children: true, texture: true, baseTexture: true }); } catch (e) {}
          currentModel = null;
          modelBaseW = 0;
          modelBaseH = 0;
        }
        ParamDriver.stop();

        // 关键：若是从 Live2D 切过来，彻底销毁 PIXI 的 WebGL 上下文，
        // 保证整个透明窗口内只有一个 WebGL 上下文（Three 用 mmd-canvas）。
        // 否则 PIXI 与 Three 各占一个上下文会争夺 GPU 资源，后建的 Three 上下文极易被丢弃，
        // 表现为所有着色器编译失败（program not valid）。
        if (pixiApp) {
          try {
            // 先停止 ticker，避免销毁过程中仍在渲染
            if (pixiApp.ticker) pixiApp.ticker.stop();
          } catch (e) {}
          try { pixiApp.destroy(true, { children: true, texture: true, baseTexture: true }); } catch (e) {}
          pixiApp = null;
        }
        // PIXI destroy(removeView=true) 会移除原 live2d 画布，这里补一个全新画布留给将来切回 Live2D
        canvas = cloneCanvasElement(canvas);
        // 确保新 canvas 也是隐藏的（cloneCanvasElement 克隆样式，但保险起见显式设置）
        if (canvas) canvas.style.display = 'none';

        // 普通脚本已通过 js/mmdPet.bundle.js 加载，全局 window.MmdPet 可用
        const mod = window.MmdPet;

        // 组合模型包：确定主模型（人物/身体），其余部件作为附加网格挂到主模型下。
        const combo = (Array.isArray(userModel.comboModels) && userModel.comboModels.length) ? userModel.comboModels : null;
        // 主模型索引：优先用导入时记录的 primaryIndex；旧条目无记录时按名称兜底（排除武器类）
        let primaryIdx = 0;
        if (combo) {
          primaryIdx = (typeof userModel.primaryIndex === 'number' && userModel.primaryIndex >= 0 && userModel.primaryIndex < combo.length)
            ? userModel.primaryIndex
            : choosePrimaryIndex(combo);
        }
        const primaryPart = (combo && combo[primaryIdx]) ? combo[primaryIdx] : null;
        // 主模型文件：优先取主模型部件的文件（旧条目 modelFile 可能仍是武器），保证动作引擎作用在人物上
        const mainFile = primaryPart ? primaryPart.modelFile : userModel.modelFile;
        const pmxUrl = modelPathToUrl(mainFile);
        mmdPet = mod.createMmdPet(mmdCanvas);
        const ok = await mmdPet.load(pmxUrl);
        if (!ok) { teardownMMD(); return false; }

        // 组合模型包：将其余部件（武器等）作为整体一并加载、展示，并应用每部件变换（挂到主模型下自动跟随）
        if (combo) {
          comboUserModel = userModel; // 供 Shift+F4 部件微调使用
          const transforms = Array.isArray(userModel.partTransforms) ? userModel.partTransforms : null;
          for (let ci = 0; ci < combo.length; ci++) {
            if (ci === primaryIdx) continue;
            const part = combo[ci];
            if (!part || !part.modelFile) continue;
            try {
              const partUrl = modelPathToUrl(part.modelFile);
              // null 表示未微调：保持模型原始（作者）位姿；非 null 才应用实际局部坐标
              const tf = (transforms && transforms[ci] != null) ? transforms[ci] : null;
              await mmdPet.addModel(partUrl, Object.assign({ comboIndex: ci }, tf || {}));
            } catch (e) {
              console.error('[Pet] 组合部件加载失败:', part.modelFile, e);
            }
          }
          // 提示：可用 Shift+F4 微调部件位姿（把武器放到手上）
          showBubble('组合模型：Shift+F4 可微调部件位置', 4000);
        }

        // 载入每模型的动作配置（自定义关键帧动作 + 相关动作 + 待机动作）
        try {
          const actionsPath = window.api.path.join(userModel.installPath, 'actions.json');
          const res = await window.api.readFile({ path: actionsPath });
          let raw = null;
          if (res && res.success && res.data != null) raw = res.data;
          else if (typeof res === 'string') raw = res;
          if (raw) mmdPet.setActions(JSON.parse(raw));
        } catch (e) { /* 无动作配置时忽略，回退到内置动作 */ }

        // 模块1：解析/生成并应用 pet_model_config.json（与 pmx 同名、同目录）
        try {
          const mf = modelFileToFsPath(mainFile); // 还原为真实 fs 路径，兼容 URL/原始路径（使用主模型文件）
          const cfgDir = window.api.path.dirname(mf);
          const cfgBase = window.api.path.basename(mf, window.api.path.extname(mf));
          const cfgPath = window.api.path.join(cfgDir, cfgBase + '.json');
          let cfg = null;
          try {
            const r = await window.api.readFile({ path: cfgPath });
            const txt = (r && r.success && r.data != null) ? r.data : (typeof r === 'string' ? r : null);
            if (txt) cfg = JSON.parse(txt);
          } catch (e) { cfg = null; }
          if (!cfg || typeof cfg !== 'object') {
            // 文件不存在 → 自动生成（含 BindPose 检测/骨骼约束/呼吸），并落盘供模块5 编辑
            cfg = mmdPet.generateModelConfig();
            try { await window.api.writeFile({ path: cfgPath, data: JSON.stringify(cfg, null, 2) }); } catch (e) {}
          }
          mmdPet.setModelConfig(cfg);
          console.log('[Pet] 模型配置已应用:', cfgPath,
            '| need_runtime_correction =', !!(cfg.bindpose_check && cfg.bindpose_check.need_runtime_correction),
            '| bone_limit 条目 =', cfg.bone_limit ? Object.keys(cfg.bone_limit).length : 0);
        } catch (e) { console.warn('[Pet] 模型配置解析失败（已降级默认）:', e.message); }

        currentPetType = 'MMD';
        // 初次按当前窗口尺寸校正相机/渲染缓冲
        if (mmdPet.resize) mmdPet.resize(windowW, windowH);
        // ★ MMD 模式：使用动态点击穿透，初始设置为穿透模式（forward:true），
        // 鼠标移动时通过 mmdPet.hitTest 射线检测判断是否在模型上，
        // 只有命中模型本体才切换到捕获模式（可拖动/点击），透明区域穿透到后方窗口。
        // 之前写死"整窗捕获"导致周围透明区域也不能点击。
        dynamicClickThrough = true;
        isCapturingMouse = false;
        window.api.setPetIgnoreMouseEvents(true, true);
        return true;
      } catch (e) {
        console.error('[Pet] MMD 加载失败:', e.message, e.stack);
        teardownMMD();
        return false;
      }
    }

    // computeLive2DContentBounds 已废弃：它用 getTransformedPoints（未经 localTransform 缩放的
    // 世界单位）算内容包围盒，再与 im.width/im.height（已乘 localTransform.a 的名义画布）混用，
    // 坐标系不一致，对部分 Cubism2 模型算出错误锚点 → 模型被推成“底部一条”。
    // 现改由 fitLive2DModelToWindow 直接用库自身报告的尺寸拟合（见该函数注释）。
    function computeLive2DContentBounds_DEPRECATED() { return null; }

    // 超大纹理检测与诊断（不再运行时降采样）。
    // 之前的运行时降采样在 addChild 后 destroy baseTexture，会破坏 Cubism4 已绑定的纹理引用，
    // 导致模型“只显示一瞬间”后部分 drawable（上半身）丢失，甚至引发 WebGL 上下文崩溃。
    // 正确做法应是加载前预处理 PNG，而不是在 Cubism 核心已持有 GL texture 后替换它。
    // 这里仅记录尺寸诊断，供排查显存问题。
    function diagnoseModelTextures(model) {
      try {
        const textures = model && model.textures || [];
        if (!Array.isArray(textures) || !textures.length) return;
        for (let i = 0; i < textures.length; i++) {
          const t = textures[i];
          if (!t || !t.baseTexture || !t.baseTexture.resource || !t.baseTexture.resource.source) continue;
          const src = t.baseTexture.resource.source;
          const w = src.width || t.baseTexture.width;
          const h = src.height || t.baseTexture.height;
          const longest = Math.max(w || 0, h || 0);
          if (longest > 4096) {
            console.warn('[diagnoseModelTextures] 发现超大纹理 #' + i + ': ' + w + 'x' + h +
              '（约 ' + Math.round(w * h * 4 / 1024 / 1024) + 'MB 显存）。若加载后闪退，请预处理缩小该纹理。');
          }
        }
      } catch (e) {
        // 诊断失败忽略
      }
    }

    // computeContentBoundsByPixels 已废弃：readPixels 像素采样 + 坐标系翻转还原，
    // 在 Cubism2 上经常算出错误锚点把模型推成“底部一条”，且与 fitLive2DModelToWindow 的新方案冲突。
    // 现统一由 fitLive2DModelToWindow 用库自身尺寸拟合。
    function computeContentBoundsByPixels_DEPRECATED() { return null; }

    // 拟合 Live2D 模型到宠物窗口（Cubism2 / Cubism4 通用）。
    //
    // ★ 设计原则（对照 CSDN 教程 140717574 + pixi-live2d-display 源码）：
    //   1. 用库自身报告的 im.width/im.height（= originalWidth * localTransform.a）做等比缩放。
    //      这个尺寸是"模型画布"的固定值，不受动作/表情/物理影响——不会因 idle 动作
    //      每帧变化，避免了"读取实时顶点→每次算出不同中心→模型跳动=闪烁"的 bug。
    //   2. 默认 anchor=(0,0) ⇒ pivot=(0,0) ⇒ 模型内容中心映射到 (model.x, model.y)。
    //      （Cubism2 内容居中于模型空间原点；Cubism4 由 centeringTransform 居中）
    //   3. 底部居中对齐（桌面宠物形态）。
    //   4. ★ Bongocat 模式下直接返回，不覆盖 setupBongocatInteraction 设置的
    //      anchor=0.5 + 居中定位（参考程序 ayangweb/BongoCat 的标准做法）。
    //
    // 历史教训（2026-08-24 五轮迭代）：
    //   - Round 1-3：用 readPixels/顶点包围盒/覆盖率猜测算锚点 → 坐标系不一致 → 底部一条
    //   - Round 4：用库尺寸但用了"左上角数学"配 anchor=(0,0) → 推到左下角 → 不显示
    //   - Round 5（上一版）：读实时顶点算内容中心 → 受 idle 动作影响每帧变 → 闪烁+只剩尾巴
    //   → 最终结论：只用库自身尺寸 + anchor=(0,0) 内容中心约定，不读顶点
    function fitLive2DModelToWindow(model, winW, winH) {
      if (!model || !model.internalModel) return;

      // ★ Bongocat 键盘猫：定位完全由 setupBongocatInteraction 控制（anchor=0.5 + 居中），
      //   fit 函数不得覆盖，否则会破坏键盘猫与背景图片的对齐、或把模型推到窗外。
      if (window.isBongocatMode) return;

      const im = model.internalModel;
      let baseW = (im && im.width) || model.width || 1;
      let baseH = (im && im.height) || model.height || 1;

      const marginX = winW * 0.08; // 水平边距，给动作时手臂左右扩展留出空间
      const marginY = winH * 0.15; // 垂直边距，给动作时手脚上下扩展、全屏特效留出空间
      const availW = Math.max(1, winW - marginX * 2);
      const availH = Math.max(1, winH - marginY * 2);

      let scale = Math.min(availW / baseW, availH / baseH);
      if (!isFinite(scale) || scale <= 0) scale = 0.1;
      if (scale > 4) scale = 4;

      // pivot=(0.5,0.5): 模型中心点映射到 (model.x, model.y)
      // Live2DModel 继承 PIXI.Container，使用 pivot 而非 anchor
      if (model.pivot) model.pivot.set(baseW / 2, baseH / 2);
      model.scale.set(scale);

      // 模型中心点垂直居中偏下：既给顶部（头发/头饰）留空间，也给底部（手脚/特效）留空间
      model.x = winW / 2;
      model.y = winH / 2 + (baseH * scale) * 0.1;

      // 记录到全局变量，供 resize / pet 尺寸变化复用
      modelBaseW = baseW;
      modelBaseH = baseH;

      console.log('[fitLive2DModelToWindow] 标准拟合(教程方式): ' +
        'canvas=' + baseW.toFixed(1) + 'x' + baseH.toFixed(1) +
        ' scale=' + scale.toFixed(3) +
        ' pos=' + model.x.toFixed(1) + ',' + model.y.toFixed(1) +
        ' win=' + winW + 'x' + winH);
      return { scale };
    }

    let _modelLoading = false;
    async function loadModel(modelPath, modelFormat) {
      // ★ 防重复调用锁：避免连续调用导致模型加载混乱（两次加载时间戳几乎相同）
      if (_modelLoading) {
        console.log('[loadModel] 已有模型正在加载，跳过本次调用:', modelPath);
        return false;
      }
      _modelLoading = true;
      try {
        useLive2D = true;
        currentPetType = 'Live2D';
        window.isBongocatMode = false;
        stopBongocatInteraction();
        // ★ 关键修复：切换模型时必须停止全局键盘钩子和鼠标跟踪。
        // 之前只调用 stopBongocatInteraction() 停止渲染端交互，但主进程的全局钩子仍在运行，
        // 旧的 onKeyDown 回调可能在新模型加载过程中被触发，访问已销毁的对象导致 V8 致命错误闪退。
        if (window.api && typeof window.api.setBongocatActive === 'function') {
          try { window.api.setBongocatActive(false); } catch (e) {}
        }

        const windowW = window.innerWidth || 320;
        const windowH = window.innerHeight || 460;

        // 销毁旧模型（保留PIXI app复用，避免destroy/recreate导致runners崩溃）
        if (currentModel) {
          try { pixiApp.stage.removeChild(currentModel); } catch(e) {}
          try { currentModel.destroy({ children: true, texture: true, baseTexture: true }); } catch(e) {}
          currentModel = null;
        }
        modelBaseW = 0; modelBaseH = 0;

        // 确保canvas有效且在DOM中
        if (!canvas || !canvas.parentNode) {
          canvas = document.createElement('canvas');
          canvas.id = 'live2d-canvas';
          canvas.style.cssText = 'display:block; width:100%; height:100%;';
          if (container) container.insertBefore(canvas, container.firstChild);
        }
        // ★ 关键：加载前就确保canvas可见、CSS fallback隐藏（防止showCSSFallback残留状态）
        canvas.style.display = 'block';
        if (cssLobster) cssLobster.style.display = 'none';

        // 创建或复用PIXI Application
        const pixiValid = pixiApp && pixiApp.renderer && pixiApp.renderer.gl &&
          typeof pixiApp.renderer.gl.isContextLost === 'function' &&
          !pixiApp.renderer.gl.isContextLost();
        if (!pixiValid) {
          if (pixiApp) { try { pixiApp.destroy(true, { children: true, texture: true, baseTexture: true }); } catch(e) {} pixiApp = null; }
          // 再次确保canvas在DOM中（destroy可能移除了canvas）
          if (!canvas || !canvas.parentNode) {
            canvas = document.createElement('canvas');
            canvas.id = 'live2d-canvas';
            canvas.style.cssText = 'display:block; width:100%; height:100%;';
            if (container) container.insertBefore(canvas, container.firstChild);
          }
          canvas.style.display = 'block';
          // ★ 默认使用 devicePixelRatio 让模型和 HTML 元素（键盘叠加层）一样清晰
          // 之前 resolution:1 导致高DPI屏幕上模型模糊，与打字手清晰度不一致
          const defaultDpr = window.devicePixelRatio || 1;
          pixiApp = new PIXI.Application({
            view: canvas,
            transparent: true,
            autoStart: true,
            width: windowW,
            height: windowH,
            resolution: defaultDpr,
            autoDensity: false,
            backgroundAlpha: 0,
            antialias: false,
            preserveDrawingBuffer: true
          });
          const fps = (petConfig && petConfig.pet && petConfig.pet.frameRate) || 60;
          pixiApp.ticker.maxFPS = fps;
          // ★ 暴露为全局变量，方便远程调试
          window.pixiApp = pixiApp;
          window.currentModel = currentModel;
          console.log('[loadModel] PIXI 创建成功, canvas:', canvas.width + 'x' + canvas.height);
        } else {
          // 复用现有PIXI：调整尺寸、确保ticker运行、清空stage
          try {
            // 确保分辨率为 devicePixelRatio（模型切换时可能被之前的设置改变）
            const dpr = window.devicePixelRatio || 1;
            if (pixiApp.renderer.resolution !== dpr) {
              pixiApp.renderer.resolution = dpr;
            }
            pixiApp.renderer.resize(windowW, windowH);
          } catch(e) {}
          if (!pixiApp.ticker.started) pixiApp.ticker.start();
          while (pixiApp.stage.children.length > 0) {
            try { pixiApp.stage.removeChildAt(0); } catch(e) { break; }
          }
          console.log('[loadModel] 复用现有 PIXI Application');
        }

        // 加载模型
        const url = modelPathToUrl(modelPath);
        console.log('[loadModel] 加载模型:', modelPath);

        // ★ 保存模型目录路径，用于播放动作音效（Sound 字段是相对路径）
        try {
          const lastSep = Math.max(modelPath.lastIndexOf('\\'), modelPath.lastIndexOf('/'));
          window._currentModelDir = lastSep >= 0 ? modelPath.substring(0, lastSep + 1) : '';
          console.log('[loadModel] 模型目录:', window._currentModelDir);
        } catch (_) {}

        // ★ 加载前自愈 model3.json：确保 FileReferences.Motions / Expressions 存在且正确。
        // 部分从 VTuber 软件导出的模型 model3.json 缺少 Motions/Expressions 引用，
        // 导致 pixi-live2d-display 不创建 motionManager.definitions / expressionManager，
        // 表现为"模型能显示但播不了动作/表情"。这里在加载前让主进程扫描目录并补全 JSON。
        try {
          if (window.api && typeof window.api.healLive2DModelJson === 'function') {
            const fsPath = modelFileToFsPath(modelPath);
            if (fsPath) {
              const healRes = await window.api.healLive2DModelJson(fsPath);
              if (healRes && healRes.changed) {
                console.log('[loadModel] model3.json 已自愈:', 'motions=' + healRes.motions, 'expressions=' + healRes.expressions);
              }
            }
          }
        } catch (e) {
          console.warn('[loadModel] healLive2DModelJson 失败(忽略):', e.message);
        }

        currentModel = await PIXI.live2d.Live2DModel.from(url, { autoInteract: false });
        console.log('[loadModel] 模型创建成功, 尺寸:', currentModel.width, 'x', currentModel.height);

        // ★★★ 干净加载模式：跳过所有 patch，只用标准 pixi-live2d-display 方式显示
        // 用于验证模型本身能否正常显示，排除各种 patch 导致的渲染错乱
        if (window.__useCleanLoad) {
          console.log('[loadModel] ★ 干净加载模式：跳过所有 patch');
          const winW = window.innerWidth || 320;
          const winH = window.innerHeight || 460;
          const imClean = currentModel.internalModel;
          const baseW = imClean ? imClean.width : currentModel.width;
          const baseH = imClean ? imClean.height : currentModel.height;
          const marginX = winW * 0.04;
          const marginY = winH * 0.03;
          const availW = Math.max(1, winW - marginX * 2);
          const availH = Math.max(1, winH - marginY * 2);
          const scaleClean = Math.min(availW / baseW, availH / baseH);
          currentModel.pivot.set(baseW / 2, baseH / 2);
          currentModel.scale.set(scaleClean);
          currentModel.x = winW / 2;
          currentModel.y = winH - (baseH * scaleClean) / 2 - marginY;
          pixiApp.stage.addChild(currentModel);
          window.currentModel = currentModel;
          currentModel.autoUpdate = true;
          modelBaseW = baseW;
          modelBaseH = baseH;

          // 绑定点击事件
          currentModel.on('hit', (hitAreas) => {
            if (!hitAreas || hitAreas.length === 0) return;
            // 获取第一个命中的部位
            const hitArea = String(hitAreas[0] || '').toLowerCase();
            // 根据部位触发不同反应
            let action = null;
            let bubbleType = 'clicked';
            if (hitArea.includes('head') || hitArea.includes('hair')) {
              // 头部：摸头反应
              action = ['shy', 'happy', 'click'][Math.floor(Math.random() * 3)];
              bubbleType = 'patHead';
            } else if (hitArea.includes('face') || hitArea.includes('cheek') || hitArea.includes('eye')) {
              // 脸部：害羞/脸红
              action = ['shy', 'blush', 'surprise'][Math.floor(Math.random() * 3)];
              bubbleType = 'touchedFace';
            } else if (hitArea.includes('hand') || hitArea.includes('arm') || hitArea.includes('paw')) {
              // 手部：挥手/握手
              action = ['greet', 'wave', 'flick'][Math.floor(Math.random() * 3)];
              bubbleType = 'handShake';
            } else if (hitArea.includes('chest') || hitArea.includes('belly') || hitArea.includes('body')) {
              // 身体：打招呼
              action = ['greet', 'click', 'tap'][Math.floor(Math.random() * 3)];
              bubbleType = 'clicked';
            } else if (hitArea.includes('tail')) {
              // 尾巴：开心
              action = ['happy', 'excited', 'flick'][Math.floor(Math.random() * 3)];
              bubbleType = 'tailTouch';
            } else if (hitArea.includes('leg') || hitArea.includes('foot') || hitArea.includes('shoe')) {
              // 腿部：惊讶
              action = ['surprise', 'flick', 'tap'][Math.floor(Math.random() * 3)];
              bubbleType = 'footTouch';
            } else if (hitArea.includes('cloth') || hitArea.includes('dress') || hitArea.includes('skirt')) {
              // 衣服：整理衣服
              action = ['shy', 'click', 'tap'][Math.floor(Math.random() * 3)];
              bubbleType = 'clicked';
            } else {
              // 其他部位：默认点击
              PetBrain.handleClick();
              return;
            }
            // 播放对应动作
            PetBrain.onInteraction('click');
            PetBrain.playMotion(action);
            ParamDriver.express(action, 1000);
            const bubble = PetBrain.randomBubble(bubbleType);
            if (bubble) showBubble(bubble, 2000);
          });

          // ★ 动作播放完成后自动恢复 idle 状态
          // pixi-live2d-display 的 MotionManager 在动作完成后触发 'finish' 事件，
          // 监听该事件并自动播放 idle，避免动作做完后模型停在最后一帧。
          if (currentModel.motionManager) {
            currentModel.motionManager.on('finish', () => {
              setTimeout(() => {
                if (!currentModel) return;
                // ★ 睡眠状态下不自动恢复 idle，避免 sleep 动作完成后被 idle 覆盖
                // （idle 中的眨眼/微笑表情会与睡眠闭眼冲突，导致左右眼状态不一致）
                if (typeof PetBrain !== 'undefined' && PetBrain.state === 'SLEEPING') return;
                // Bongocat 模式不播放 idle（完全由键盘/鼠标驱动）
                if (window.isBongocatMode) return;
                // 检查当前是否还有动作在播放（避免打断新播放的动作）
                const mm = currentModel.motionManager;
                if (mm && mm.isFinished && !mm.isFinished()) {
                  try { currentModel.motion('idle'); } catch (_) {}
                } else if (mm && typeof mm.isFinished === 'undefined') {
                  // 旧版本没有 isFinished 方法，直接播放 idle
                  try { currentModel.motion('idle'); } catch (_) {}
                }
              }, 150);
            });
            console.log('[loadModel] ★ 已监听动作完成事件，自动恢复 idle');
          }

          // 发现动作/表情/参数驱动
          discoverMotions();
          detectKeyboardMotions();
          discoverExpressions();
          refreshActionMenu();
          ParamDriver.setup();

          lastLoadedModel = { path: modelPath, format: modelFormat };

          // 延迟再发现一次（模型可能异步填充动作组）
          setTimeout(() => {
            if (!currentModel) return;
            discoverMotions();
            detectKeyboardMotions();
            discoverExpressions();
            refreshActionMenu();
            if (typeof ParamDriver.refreshMotionState === 'function') ParamDriver.refreshMotionState();
          }, 120);

          // ★ Bongocat 模型不播放 idle 动作：Bongocat 模式完全由键盘/鼠标驱动，
          // idle 动作中的动画（头发飘动等）会与参数更新冲突，导致部件时有时无、闪烁。
          const isBongoModel = !!(currentModelInfo && currentModelInfo.isBongocat);
          if (!isBongoModel && typeof currentModel.motion !== 'undefined') {
            currentModel.motion('idle');
          } else if (isBongoModel) {
            console.log('[loadModel] ★ Bongocat 模型，跳过 idle 动作播放');
          }
          console.log('[loadModel] ★ 干净加载完成! scale=' + scaleClean.toFixed(3) +
            ' pos=' + currentModel.x.toFixed(1) + ',' + currentModel.y.toFixed(1) +
            ' base=' + baseW + 'x' + baseH);
          return true;
        }

        // ★★★ 关键修复：无条件给 internalModel 补上 getDrawableCount() 方法 ★★★
        // pixi-live2d-display 0.4.0 的 Cubism4Model 实例上没有 getDrawableCount() 方法，
        // 但底层 coreModel 上有且返回正确的 drawable 数量（如初音未来=110）。
        // 之前代码检查 typeof im.getDrawableCount === 'function' 结果为 false，
        // 导致所有依赖 drawableCount 的逻辑（内容边界计算、部位检查等）拿到 0，模型不显示。
        try {
          const imPatch = currentModel.internalModel;
          if (imPatch) {
            const hadMethod = typeof imPatch.getDrawableCount === 'function';
            // 无条件添加/替换，多路径兜底
            imPatch.getDrawableCount = function() {
              // 路径1: coreModel.getDrawableCount()（Cubism4 原生核心）
              try {
                if (this.coreModel && typeof this.coreModel.getDrawableCount === 'function') {
                  const c = this.coreModel.getDrawableCount();
                  if (c > 0) return c;
                }
              } catch (_) {}
              // 路径2: coreModel._model.drawables.count
              try {
                if (this.coreModel && this.coreModel._model && this.coreModel._model.drawables) {
                  const c = this.coreModel._model.drawables.count;
                  if (c > 0) return c;
                }
              } catch (_) {}
              // 路径3: _model.drawables.count
              try {
                if (this._model && this._model.drawables) {
                  const c = this._model.drawables.count;
                  if (c > 0) return c;
                }
              } catch (_) {}
              // 路径4: getModelContext().getDrawableCount()
              try {
                if (this.coreModel && typeof this.coreModel.getModelContext === 'function') {
                  const ctx = this.coreModel.getModelContext();
                  if (ctx && typeof ctx.getDrawableCount === 'function') {
                    const c = ctx.getDrawableCount();
                    if (c > 0) return c;
                  }
                }
              } catch (_) {}
              // 路径5: 原始方法（如果存在）
              try {
                if (this.__origGetDrawableCount) return this.__origGetDrawableCount();
              } catch (_) {}
              // 路径6: Cubism2 drawDataCount
              if (typeof this.drawDataCount === 'number') return this.drawDataCount;
              return 0;
            };
            // 同样补全 getDrawableOpacity（部位完整性检查需要）
            if (typeof imPatch.getDrawableOpacity !== 'function') {
              imPatch.getDrawableOpacity = function(index) {
                try {
                  if (this.coreModel && typeof this.coreModel.getDrawableOpacity === 'function') {
                    return this.coreModel.getDrawableOpacity(index);
                  }
                } catch (_) {}
                try {
                  if (this.coreModel && this.coreModel._model && this.coreModel._model.drawables &&
                      this.coreModel._model.drawables.opacities) {
                    return this.coreModel._model.drawables.opacities[index];
                  }
                } catch (_) {}
                return 1;
              };
            }
            // 补全 getDrawableIDs（诊断需要）
            if (typeof imPatch.getDrawableIds !== 'function') {
              imPatch.getDrawableIds = function(index) {
                try {
                  if (this.coreModel && typeof this.coreModel.getDrawableId === 'function') {
                    return this.coreModel.getDrawableId(index);
                  }
                } catch (_) {}
                try {
                  if (this.coreModel && this.coreModel._model && this.coreModel._model.drawables &&
                      this.coreModel._model.drawables.ids) {
                    return this.coreModel._model.drawables.ids[index];
                  }
                } catch (_) {}
                return '';
              };
            }
            // 补全 getDrawableVertices（内容边界计算需要）
            if (typeof imPatch.getDrawableVertices !== 'function') {
              imPatch.getDrawableVertices = function(index) {
                try {
                  if (this.coreModel && typeof this.coreModel.getDrawableVertices === 'function') {
                    return this.coreModel.getDrawableVertices(index);
                  }
                } catch (_) {}
                try {
                  if (this.coreModel && this.coreModel._model && this.coreModel._model.drawables &&
                      this.coreModel._model.drawables.vertexPositions) {
                    return this.coreModel._model.drawables.vertexPositions[index];
                  }
                } catch (_) {}
                return null;
              };
            }
            // ★★★ 关键修复：drawable 可见性兜底（修复"只显示一下就消失/缺失"）★★★
            // CubismRenderer_WebGL.doDrawModel 会逐个检查 getDrawableDynamicFlagIsVisible，
            // 当 dynamicFlags 的 IsVisible 位未被置位时直接跳过该 drawable。
            // 部分模型 / 加载时机下 dynamicFlags 整组为 0，导致整个模型被跳过而不可见。
            // 兜底：当 dynamic 可见位为 false 时，改用 drawable 的 opacity 判断真实可见性，
            // 只要 opacity > 0 即视为可见，避免模型被整体丢失绘制。
            try {
              const cm = imPatch.coreModel;
              if (cm && typeof cm.getDrawableDynamicFlagIsVisible === 'function') {
                const origVis = cm.getDrawableDynamicFlagIsVisible.bind(cm);
                cm.getDrawableDynamicFlagIsVisible = function(index) {
                  const v = origVis(index);
                  if (v) return v;
                  try {
                    const op = (typeof cm.getDrawableOpacity === 'function') ? cm.getDrawableOpacity(index) : undefined;
                    if (typeof op === 'number') {
                      // opacity > 0 的真实可见 → 强制可见，并把可见位写回 dynamicFlags 保持逻辑一致；
                      // opacity === 0 → 保持原判定（可能为合法隐藏）
                      if (op > 0) {
                        try { if (this._model && this._model.drawables && this._model.drawables.dynamicFlags) this._model.drawables.dynamicFlags[index] |= 1; } catch (_) {}
                        return true;
                      }
                      return v;
                    }
                    // opacity 取不到时保守判定为可见（避免误隐藏整个模型）
                    return true;
                  } catch (_) {
                    return true;
                  }
                };
              }
            } catch (e) {
              console.warn('[loadModel] 可见性兜底 patch 失败(忽略):', e.message);
            }
            // ★★★ 关键修复：遮罩（clipping mask）强制每帧重绘（修复"面部/眼睛/嘴巴等组件缺失"）★★★
            // CubismRenderer_WebGL.setupClippingContext 每帧都会 gl.clear 清除整个遮罩缓冲区，
            // 但只对 getDrawableDynamicFlagVertexPositionsDidChange() 返回 true 的遮罩 drawable 重新绘制。
            // 模型加载稳定后，顶点位置不再变化，该标志返回 false → 遮罩不被重绘 → 缓冲区为空 →
            // 所有依赖遮罩的 drawable（眼睛、嘴巴、眉毛等面部组件）被裁剪掉而不可见。
            // 修复：强制该方法始终返回 true，让遮罩每帧都重新绘制，确保面部组件持续可见。
            // 性能影响极小：遮罩 drawable 通常只有几个，且只在使用遮罩的模型上生效。
            try {
              const cm2 = imPatch.coreModel;
              if (cm2 && typeof cm2.getDrawableDynamicFlagVertexPositionsDidChange === 'function') {
                const origVertChange = cm2.getDrawableDynamicFlagVertexPositionsDidChange.bind(cm2);
                cm2.getDrawableDynamicFlagVertexPositionsDidChange = function(index) {
                  // 始终返回 true，强制每帧重绘所有遮罩
                  return true;
                };
                console.log('[loadModel] ★ 遮罩强制重绘 patch 完成（修复面部组件缺失）');
              }
              // ★★★ 关键修复：禁用所有 drawable 的背面剔除（修复"部分组件/面部被剔除不显示"）★★★
              // CubismRenderer_WebGL.doDrawModel 和 setupClippingContext 中，
              // 每个 drawable 单独调用 setIsCulling(model.getDrawableCulling(drawableIndex))。
              // 若模型中某些 drawable（如面部 ArtMesh、遮罩用 drawable）的 ConstantFlags 启用了 culling，
              // 且顶点绕序与 gl.frontFace(CCW) 不匹配，这些 drawable 会被背面剔除而完全不绘制，
              // 表现为"脸是空的/眼睛嘴巴缺失/只有身体没有头"。
              // 修复：patch getDrawableCulling 始终返回 false，禁用所有 drawable 的背面剔除。
              // 桌面宠物为透明窗口、无封闭背面需求，禁用 culling 无副作用且更稳定。
              if (cm2 && typeof cm2.getDrawableCulling === 'function') {
                cm2.getDrawableCulling = function(index) { return false; };
                console.log('[loadModel] ★ 全 drawable 禁用背面剔除 patch 完成（修复面部/组件被剔除）');
              }

              // ★★★ 关键修复：setParameterValueByIndex NaN 防护 ★★★
              // 问题：加载时参数已重置为默认值（无 NaN），但动作播放后参数又变成 NaN。
              // 根因可能是：物理引擎计算、动作曲线评估、或其他逻辑产生了 NaN，
              // 然后通过 setParameterValueByIndex 传播到参数数组，导致后续动作计算
              // v = sourceValue + (value-sourceValue)*weight = NaN + ... = NaN，模型不动。
              // 修复：patch setParameterValueByIndex，如果值是 NaN/Infinity，拒绝设置并打印警告，
              // 防止 NaN 传播，同时帮助定位是哪个逻辑产生了 NaN。
              try {
                if (cm2 && typeof cm2.setParameterValueByIndex === 'function') {
                  const origSetParam = cm2.setParameterValueByIndex.bind(cm2);
                  let nanWarnCount = 0;
                  cm2.setParameterValueByIndex = function(index, value, weight) {
                    if (typeof value !== 'number' || !isFinite(value)) {
                      if (nanWarnCount < 10) {
                        nanWarnCount++;
                        console.warn('[L2D] ⚠ 拒绝设置 NaN/非有限参数值: index=' + index +
                          ' value=' + value + ' weight=' + weight +
                          ' (调用栈已记录，防止 NaN 传播)');
                        try { console.trace('[L2D] NaN 参数设置调用栈'); } catch (_) {}
                      }
                      return; // 拒绝设置，保持原值
                    }
                    return origSetParam(index, value, weight);
                  };
                  console.log('[loadModel] ★ setParameterValueByIndex NaN 防护 patch 完成');
                }
              } catch (e) {
                console.warn('[loadModel] setParameterValueByIndex NaN 防护 patch 失败(忽略):', e.message);
              }
            } catch (e) {
              console.warn('[loadModel] 遮罩强制重绘 patch 失败(忽略):', e.message);
            }
            // 验证
            const verifyCount = imPatch.getDrawableCount();
            console.log('[loadModel] ★ getDrawableCount patch 完成! 之前有方法=' + hadMethod +
              ' 验证返回=' + verifyCount +
              ' coreModel=' + (imPatch.coreModel ? '存在' : '不存在'));

            // ★★★ 注意：不需要时间单位转换！★★★
            // pixi-live2d-display 的 InternalModel.update 方法中已经做了转换：
            //   update(dt, now) { dt /= 1e3; now /= 1e3; ... motionManager.update(coreModel, now); }
            // 所以传给 doUpdateMotion 的 now 已经是秒，不需要再次转换。
            // 之前错误地再次除以 1000，导致时间变成 0.0075 秒，动作几乎不前进，模型不动。
            console.log('[loadModel] ★ 时间单位：pixi-live2d-display 已自动转换（无需 patch）');
          }
        } catch (e) {
          console.error('[loadModel] getDrawableCount patch 失败:', e.message);
        }

        // 物理引擎：保留运行但清零重力/风力（防止头发/衣服因重力风力大幅摆动出视野）。
        // 之前直接 im.physics = null 完全禁用物理引擎，会导致依赖物理的参数不更新、
        // drawable 动态标志（VertexPositionsDidChange 等）状态异常，进而引发遮罩丢失、
        // 面部组件缺失、部分组件不刷新等连锁问题。现在恢复物理运行，仅消除外力影响。
        try {
          const im = currentModel.internalModel;
          if (im) {
            if (im.physics) {
              try {
                if (im.physics.gravity && typeof im.physics.gravity === 'object') { im.physics.gravity.x = 0; im.physics.gravity.y = 0; }
                if (im.physics.wind && typeof im.physics.wind === 'object') { im.physics.wind.x = 0; im.physics.wind.y = 0; }
                // 不再覆盖 update、不再设为 null，让物理引擎正常参与每帧参数更新
              } catch(_) {}
            }
            // im.physics = null;  // ← 已移除：完全禁用物理会导致连锁问题
            const origUpdate = im.update.bind(im);
            // ★★★ 关键修复（Cubism2 模型加载不全/完全不显示）：必须原样转发 now 参数 ★★★
            // Cubism2 的 updateNaturalMovements(dt, now) 用 now 计算 sin 相位：
            //   t = now/1000*2π; setParamFloat(PARAM_ANGLE_X/Y/Z, sin(t/…)); setParamFloat(PARAM_BREATH, …)
            // 之前的包装只转发 dt，now 恒为 undefined → t=NaN → PARAM_ANGLE_*/PARAM_BREATH
            // 全部被污染成 NaN → 变形器输出 NaN 顶点 → 模型整体/部分完全不显示（“加载不全”）。
            // Cubism4 的 updateNaturalMovements 只用 dt（呼吸），所以不受影响。
            // 这里转发 now；若调用方未传 now（如手动 update(dt)），兜底为单调递增时钟，避免 NaN。
            let _imFallbackNow = performance.now();
            im.update = function(dt, now) {
              try {
                if (typeof now !== 'number' || !isFinite(now)) {
                  _imFallbackNow += (typeof dt === 'number' && isFinite(dt)) ? dt : 16;
                  now = _imFallbackNow;
                }
                return origUpdate(dt, now);
              } catch(e) { console.error('[loadModel] internalModel.update 抛出错误:', e.message, e.stack); }
            };
            // 禁用culling（防止上半身被裁剪）
            // ★ 关键修复：Cubism4 coreModel.isCulling 是函数(getter)，不是布尔属性！
            // 直接赋值 cm.isCulling = false 会覆盖函数，导致库内部调用 this.isCulling()
            // 抛出 "this.isCulling is not a function"，模型加载后立即崩溃不显示。
            // 正确做法：优先用 setIsCulling(false) 方法；只有当 isCulling 确实是
            // 非函数属性时才直接赋值。内部属性 _isCulling / _culling 可直接赋值。
            if (typeof im.disableCulling !== 'undefined') im.disableCulling = true;
            const cm = im.coreModel;
            if (cm) {
              // isCulling 可能是函数（Cubism4 getter）或布尔属性（Cubism2/旧版）
              if (typeof cm.isCulling === 'function') {
                // 函数形式：优先调用 setIsCulling(false)；若不存在则不碰 isCulling
                if (typeof cm.setIsCulling === 'function') {
                  try { cm.setIsCulling(false); } catch (_) {}
                }
              } else if (typeof cm.isCulling !== 'undefined') {
                cm.isCulling = false;
              }
              if (typeof cm._isCulling !== 'undefined') cm._isCulling = false;
              if (typeof cm.culling !== 'undefined') cm.culling = false;
              if (typeof cm._culling !== 'undefined') cm._culling = false;
            }
            // ★ 关键修复：之前只设置 coreModel.isCulling，但 Live2D 的逐 drawable 剔除
            // 实际由 Cubism 渲染器（im.renderer）的 _isCulling 控制，不在 coreModel 上。
            // 结果部分 drawable 在窗口边缘被渲染器按屏幕矩形剔除，表现为"部分缺失"。
            // 这里同时关闭渲染器层的剔除，确保所有可见 drawable 都进入绘制队列。
            if (im.renderer) {
              if ('_isCulling' in im.renderer) im.renderer._isCulling = false;
              // renderer.isCulling 同样可能是函数，安全处理
              if ('isCulling' in im.renderer) {
                if (typeof im.renderer.isCulling === 'function') {
                  if (typeof im.renderer.setIsCulling === 'function') {
                    try { im.renderer.setIsCulling(false); } catch (_) {}
                  }
                } else {
                  im.renderer.isCulling = false;
                }
              }
              if ('culling' in im.renderer) im.renderer.culling = false;
              if ('_culling' in im.renderer) im.renderer._culling = false;
            }
            // 同时把 PIXI sprite 的可剔除标志也关掉，防止父级被 PIXI 整层剔除
            if (typeof currentModel.cullable !== 'undefined') currentModel.cullable = false;
          }
        } catch(e) { console.warn('[loadModel] 物理/剔除禁用失败(忽略):', e.message); }

        // ★★★ 关键修复：Cubism2 模型渲染器 WebGL 上下文手动初始化 ★★★
        // 问题：Cubism2 模型的 update→preDraw→initShader→loadShaders2 需要 WebGL 上下文，
        // 但 pixi-live2d-display 在某些情况下没有把 PIXI 的 gl 上下文传递给 Cubism2 渲染器，
        // 导致 "Cannot read properties of undefined (reading 'createProgram')" 错误，模型完全不渲染。
        // 修复：在模型创建后、第一次 update 之前，手动把 PIXI 的 WebGL 上下文设置给 Cubism2 渲染器，
        // 并尝试触发 shader 预初始化，确保后续 update/render 能正常工作。
        try {
          const imGl = currentModel.internalModel;
          if (imGl && imGl.renderer && pixiApp && pixiApp.renderer && pixiApp.renderer.gl) {
            const gl = pixiApp.renderer.gl;
            const renderer = imGl.renderer;
            let glSet = false;

            // 尝试多种路径设置 WebGL 上下文
            // 路径1: 直接设置 gl 属性（最常见）
            if (typeof renderer.gl === 'undefined' || renderer.gl === null) {
              renderer.gl = gl;
              glSet = true;
            }
            // 路径2: _gl 属性
            if (typeof renderer._gl === 'undefined' || renderer._gl === null) {
              renderer._gl = gl;
              glSet = true;
            }
            // 路径3: setGL 方法
            if (typeof renderer.setGL === 'function') {
              try { renderer.setGL(gl); glSet = true; } catch (_) {}
            }
            // 路径4: setGl 方法（大小写变体）
            if (typeof renderer.setGl === 'function') {
              try { renderer.setGl(gl); glSet = true; } catch (_) {}
            }
            // 路径5: 渲染器内部的 _renderer 或 coreRenderer
            if (renderer._renderer && (typeof renderer._renderer.gl === 'undefined' || renderer._renderer.gl === null)) {
              renderer._renderer.gl = gl;
              glSet = true;
            }

            // 尝试预初始化 shader（不经过 update，直接调用渲染器的初始化方法）
            try {
              if (typeof renderer.initShader === 'function') {
                renderer.initShader();
              }
            } catch (shaderErr) {
              // 如果 initShader 失败，尝试 loadShaders2
              try {
                if (typeof renderer.loadShaders2 === 'function') {
                  renderer.loadShaders2();
                }
              } catch (_) {}
            }

            // 尝试设置模型实例的 gl（某些版本存在 model.gl）
            if (imGl.model && (typeof imGl.model.gl === 'undefined' || imGl.model.gl === null)) {
              imGl.model.gl = gl;
            }

            if (glSet) {
              console.log('[loadModel] ★ Cubism2 渲染器 WebGL 上下文已手动初始化（修复 createProgram 错误）');
            }
          }
        } catch(e) { console.warn('[loadModel] Cubism2 gl 初始化失败(忽略):', e.message); }

        // ★★★ 全面渲染修复（解决部分组件不显示/遮罩丢失/面部缺失）★★★
        // 不区分 Cubism2/Cubism4，对所有模型都尝试应用。多种路径探索内部属性，

                console.warn('[loadModel] 像素安全检查: 检测到内容不完整! ' +
                  '覆盖率=' + (coverageRatio * 100).toFixed(0) + '%, ' +
                  '顶部空白=' + (topGapRatio * 100).toFixed(0) + '%, ' +
                  '内容边界=' + pMinX + ',' + screenMinY + ' ' + contentW + 'x' + contentH + '/' + pw + 'x' + ph +
                  ' → 强制用 anchor=(0.5,0.5) 重新居中');
                currentModel.anchor.set(0.5, 0.5);
                // 用内容实际像素尺寸来算合适的 scale
                const fitScaleForContent = Math.min((pw * 0.9) / contentW, (ph * 0.9) / contentH);
                currentModel.scale.set(Math.min(fitScaleForContent, currentModel.scale.x * 1.2));
                currentModel.x = pw / 2;
                currentModel.y = ph / 2;
                pixiApp.renderer.render(pixiApp.stage);
                continue;
              }

              // 检查是否完全在窗口内（留 2px 边距）
              const margin = 2;
              const topOut = screenMinY < margin;
              const bottomOut = screenMaxY > ph - margin;
              const leftOut = pMinX < margin;
              const rightOut = pMaxX > pw - margin;

              if (!topOut && !bottomOut && !leftOut && !rightOut) {
                console.log('[loadModel] 像素安全检查通过: 内容完全在窗口内',
                  '边界=' + pMinX + ',' + screenMinY + ' ' + contentW + 'x' + contentH,
                  '窗口=' + pw + 'x' + ph,
                  '覆盖率=' + (coverageRatio * 100).toFixed(0) + '%',
                  '迭代=' + pixelSafetyIter);
                break;
              }

              // 先尝试调整位置
              let needShrink = false;
              if (topOut) {
                const adjustY = margin - screenMinY;
                currentModel.y += adjustY;
                console.log('[loadModel] 像素安全检查: 顶部超出 ' + (margin - screenMinY) + 'px, 下移 ' + adjustY + 'px');
              }
              if (bottomOut) {
                const adjustY = screenMaxY - (ph - margin);
                currentModel.y -= Math.min(adjustY, currentModel.y - margin);
                console.log('[loadModel] 像素安全检查: 底部超出 ' + adjustY + 'px, 上移');
              }
              if (leftOut) {
                const adjustX = margin - pMinX;
                currentModel.x += adjustX;
                console.log('[loadModel] 像素安全检查: 左侧超出 ' + adjustX + 'px, 右移');
              }
              if (rightOut) {
                const adjustX = pMaxX - (pw - margin);
                currentModel.x -= Math.min(adjustX, currentModel.x - margin);
                console.log('[loadModel] 像素安全检查: 右侧超出 ' + adjustX + 'px, 左移');
              }

              // 渲染一帧让位置调整生效，再次检查
              pixiApp.renderer.render(pixiApp.stage);
              glFinal.readPixels(0, 0, pw, ph, glFinal.RGBA, glFinal.UNSIGNED_BYTE, pixelData);
              let pMinX2 = pw, pMinY2 = ph, pMaxX2 = 0, pMaxY2 = 0;
              let hasPixel2 = false;
              for (let py = 0; py < ph; py++) {
                for (let px = 0; px < pw; px++) {
                  const idx = (py * pw + px) * 4;
                  if (pixelData[idx + 3] > alphaThreshold) {
                    hasPixel2 = true;
                    if (px < pMinX2) pMinX2 = px;
                    if (py < pMinY2) pMinY2 = py;
                    if (px > pMaxX2) pMaxX2 = px;
                    if (py > pMaxY2) pMaxY2 = py;
                  }
                }
              }
              if (hasPixel2) {
                const sMinY2 = ph - 1 - pMaxY2;
                const sMaxY2 = ph - 1 - pMinY2;
                const stillOut = sMinY2 < margin || sMaxY2 > ph - margin || pMinX2 < margin || pMaxX2 > pw - margin;
                if (stillOut && pixelSafetyIter < maxPixelIter) {
                  // 位置调整后仍然超出，说明模型太大，需要缩小缩放
                  const curScale = currentModel.scale.x;
                  const newScale = curScale * 0.88;
                  currentModel.scale.set(newScale);
                  // 缩小后重新居中
                  currentModel.x = pw / 2;
                  currentModel.y = ph / 2;
                  console.log('[loadModel] 像素安全检查: 模型过大，缩小缩放 ' + curScale.toFixed(3) + ' → ' + newScale.toFixed(3));
                  continue;
                }
              }
              break;
            }
            if (pixelSafetyIter > 1) {
              console.log('[loadModel] 像素安全检查完成，迭代 ' + pixelSafetyIter + ' 次，最终 scale=' + currentModel.scale.x.toFixed(3) + ' pos=' + currentModel.x.toFixed(1) + ',' + currentModel.y.toFixed(1));
            }

        } catch (e) {
          console.warn('[loadModel] 像素安全检查失败(忽略):', e.message);
        }

        // 确保ticker运行（窗口在后台时rAF可能不触发，上面的手动渲染已保证模型可见）
        if (!pixiApp.ticker.started) { try { pixiApp.ticker.start(); } catch(e) {} }

        // ★★★ 关键修复：确保 Live2D 模型的 autoUpdate 生效，解决"动作启动成功但模型不动" ★★★
        // 根因：pixi-live2d-display 的 autoUpdate setter 依赖 window.PIXI.Ticker：
        //   tickerRef || (tickerRef = window.PIXI.Ticker);
        //   if (tickerRef) tickerRef.shared.add(this.onTickerUpdate, this);
        // 如果 PIXI 通过 ES module 加载、没有暴露到 window.PIXI，tickerRef 为 undefined，
        // autoUpdate 不会注册到 ticker，onTickerUpdate 不被调用，this.deltaTime 永远为 0。
        // 而 _render 中只有 if (this.deltaTime) 才调用 internalModel.update()，
        // 导致 motionManager.update 不执行，动作参数不更新，模型保持静止。
        // 修复：手动注册 ticker 回调调用 currentModel.update(dt)，确保 deltaTime 被设置。
        try {
          if (currentModel && typeof currentModel.update === 'function') {
            // 先尝试启用 autoUpdate（如果 window.PIXI.Ticker 存在会自动注册）
            try { currentModel.autoUpdate = true; } catch (e) {}
            // 检查 autoUpdate 是否真的生效（_autoUpdate 为 true 表示已注册到 ticker）
            if (!currentModel._autoUpdate) {
              console.log('[loadModel] ★ autoUpdate 未生效（window.PIXI.Ticker 可能不存在），手动注册 ticker 更新回调');
              const _manualUpdateCb = function(delta) {
                if (currentModel && currentModel.update && !currentModel._destroyed) {
                  // delta 是帧间隔倍数（60fps=1），转换为毫秒传给 update
                  currentModel.update(delta * (1000 / 60));
                }
              };
              pixiApp.ticker.add(_manualUpdateCb);
              currentModel._manualUpdateCallback = _manualUpdateCb;
              console.log('[loadModel] ★ 已注册手动 ticker 更新回调，动作将正常播放');
            } else {
              console.log('[loadModel] autoUpdate 已生效（_autoUpdate=true）');
            }
          }
        } catch (autoUpdateErr) {
          console.warn('[loadModel] autoUpdate 设置失败(忽略):', autoUpdateErr.message);
        }

        // ★★★ 最终确保canvas可见（这是模型能显示的关键）★★★
        canvas.style.display = 'block';
        if (cssLobster) cssLobster.style.display = 'none';

        if (!canvas.parentNode && container) container.insertBefore(canvas, container.firstChild);

        console.log('[loadModel] ✓ 加载完成! scale=' + currentModel.scale.x.toFixed(3) +
          ' pos=' + currentModel.x.toFixed(1) + ',' + currentModel.y.toFixed(1) +
          ' canvas.display=' + canvas.style.display);

        // ★ 确保2D模型加载后应用色彩调节（.model-awake 类包含 --pet-color-filter）
        // 修复：色彩调节之前只在 exitSleep() 时应用 .model-awake，导致从未睡眠的2D模型色彩调节不生效
        // 3D模型通过 #mmd-canvas 直接应用 --pet-color-filter，所以总是生效
        if (canvas && !canvas.classList.contains('model-sleeping')) {

        try {

                  if (pts && pts.length >= 4) {

                    for (let i = 0; i < pts.length; i += 2) {
                      if (pts[i] < minX) minX = pts[i];

                    }
                    boundsList.push({ idx: di, minX: minX.toFixed(1), minY: minY.toFixed(1), maxX: maxX.toFixed(1), maxY: maxY.toFixed(1), w: (maxX-minX).toFixed(1), h: (maxY-minY).toFixed(1), ptCount: pts.length/2 });
                  } else {

                }
              }

            }

            // 输出 drawParamWebGL 关键状态
            if (cmDiag.drawParamWebGL) {

              console.log('[loadModel] ★ 自动诊断-drawParamWebGL:', JSON.stringify({

        // ★★★ Cubism 版本兼容性修复（基于 pixi-live2d-display + live2d.min.js 源码深度分析）★★★
        // 根因：Cubism 2 模型的渲染由 coreModel.drawParamWebGL 处理，遮罩由
        // coreModel.getModelContext().clipManager 管理。updateWebGLContext() 只在
        // glContextID 变化时调用，负责初始化遮罩 framebuffer（clipManager.getMaskRenderTexture()）。
        // 若模型加载后 glContextID 已被预设，updateWebGLContext 不会触发，遮罩未初始化，

        // 此外项目中大量 Cubism4 风格 API（getPartCount/setPartOpacityByIndex/getParameterCount）
        // 对 Cubism2 全部无效，Cubism2 核心库混淆属性为 _$5S._$8b/baseOpacity、_$5S._$F2/visible 等。
        try {
          if (currentModel && currentModel.internalModel) {

            // 检测模型版本：Cubism2 有 _$5S（模型上下文）和 drawParamWebGL（WebGL绘制参数）
            // Cubism4 有 _model / _renderer / getPartCount 等
            const isCubism2 = !!(cmCompat && cmCompat._$5S && cmCompat.drawParamWebGL);

              if (typeof imCompat.disableCulling !== 'undefined') {

              // Cubism2 核心库中 part 可见性存储在混淆属性 _$F2 数组中
              const s5Compat = cmCompat._$5S;

                let partVisReset = 0;
                for (let pi = 0; pi < s5Compat._$F2.length; pi++) {

                if (typeof cmCompat.getPartsOpacity === 'function' && typeof cmCompat.setPartsOpacity === 'function') {

              }

              // 修复5：强制重置所有 drawable 的基础透明度（_$5S._$8b[di].baseOpacity）
              // _$8b 是 drawable 运行时状态数组，baseOpacity 为基础透明度
              // 注意：不要重置 _$Us/_$7s/_$IS 等运行时属性，这些在每帧 update() 中由核心库重新计算，
              // 手动重置会干扰渲染状态，可能导致矩阵异常（d=0）使模型完全不可见
              if (s5Compat && Array.isArray(s5Compat._$8b)) {
                let drawOpReset = 0;
                for (let di = 0; di < s5Compat._$8b.length; di++) {
                  const dd = s5Compat._$8b[di];
                  if (dd && typeof dd.baseOpacity === 'number') {
                    dd.baseOpacity = 1;
                    drawOpReset++;
                  }
                }

              }

              if (s5Compat && Array.isArray(s5Compat._$aS)) {

              try {

                matDiag.modelScaleY = currentModel.scale.y;

                  matDiag.localD = imCompat.localTransform.d;

                  matDiag.drawD = imCompat.drawingMatrix.d;

              }

              console.log('[loadModel] ★ [Cubism2] 版本兼容性修复完成（glContextID已重置+遮罩已启用+背面剔除已禁用+part可见性+baseOpacity已重置）');
            } else if (isCubism4) {
              console.log('[loadModel] ★ [Cubism4] 检测到 Cubism 4 模型，使用标准兼容性处理');
              // Cubism4 使用标准 API，之前的 getPartCount/setPartOpacityByIndex 修复已适用
              // 强制重置 glContextID 确保 WebGL 上下文正确初始化
              currentModel.glContextID = -1;
            } else {
              console.log('[loadModel] ★ [Compat] 未知模型版本，跳过版本特定修复');
            }
          }
        } catch (compatErr) {
          console.warn('[loadModel] 版本兼容性修复失败(忽略):', compatErr.message, compatErr.stack);
        }

        // 绑定点击事件
        currentModel.on('hit', (hitAreas) => {
            if (!hitAreas || hitAreas.length === 0) return;

            } else if (hitArea.includes('hand') || hitArea.includes('arm') || hitArea.includes('paw')) {
              // 手部：挥手/握手
              action = ['greet', 'wave', 'flick'][Math.floor(Math.random() * 3)];
              bubbleType = 'handShake';
            } else if (hitArea.includes('chest') || hitArea.includes('belly') || hitArea.includes('body')) {
              // 身体：打招呼
              action = ['greet', 'click', 'tap'][Math.floor(Math.random() * 3)];
              bubbleType = 'clicked';
            } else if (hitArea.includes('tail')) {
              // 尾巴：开心
              action = ['happy', 'excited', 'flick'][Math.floor(Math.random() * 3)];
              bubbleType = 'tailTouch';
            } else if (hitArea.includes('leg') || hitArea.includes('foot') || hitArea.includes('shoe')) {

              action = ['surprise', 'flick', 'tap'][Math.floor(Math.random() * 3)];
              bubbleType = 'footTouch';
            } else if (hitArea.includes('cloth') || hitArea.includes('dress') || hitArea.includes('skirt')) {

              bubbleType = 'clicked';

              PetBrain.handleClick();

            // 播放对应动作
            PetBrain.onInteraction('click');
            PetBrain.playMotion(action);
            ParamDriver.express(action, 1000);
            const bubble = PetBrain.randomBubble(bubbleType);
            if (bubble) showBubble(bubble, 2000);
          });

        // 发现动作/表情/参数驱动
        discoverMotions();
        detectKeyboardMotions();
        discoverExpressions();
        refreshActionMenu();
        ParamDriver.setup();

        lastLoadedModel = { path: modelPath, format: modelFormat };

        // 延迟再发现一次（模型可能异步填充动作组）
        setTimeout(() => {
          if (!currentModel) return;
          discoverMotions();
          detectKeyboardMotions();
          discoverExpressions();
          refreshActionMenu();
          if (typeof ParamDriver.refreshMotionState === 'function') ParamDriver.refreshMotionState();
        }, 120);

        return true;
      } catch (err) {
        console.error('[loadModel] ✗ 模型加载失败:', err.message, '| stack:', (err.stack || '').slice(0, 500));
        currentModel = null;

      } finally {
        _modelLoading = false;
      }
    }
    function modelPathToUrl(p) {
      if (!p) return p;
      if (p.startsWith('http://') || p.startsWith('https://') || p.startsWith('file://') || p.startsWith('live2d://')) return p;
      const normalized = p.replace(/\\/g, '/');
      // 使用自定义 live2d 协议，确保打包后能可靠加载本地文件
      return 'live2d:///' + encodeURI(normalized);
    }

    // 把 userModel.modelFile（可能是原始 fs 路径，也可能是 file:// 或 live2d:// URL）
    // 统一还原成真实 fs 路径，供 path.* / fs 操作（写 pet_model_config.json 用）。
    function modelFileToFsPath(p) {
      if (!p) return '';
      let s = p.trim();
      if (s.startsWith('live2d://')) {
        s = decodeURI(s.slice('live2d://'.length)); // '/D:/models/x.pmx'
      } else if (s.startsWith('file://')) {
        s = decodeURI(s.slice('file://'.length)); // '///D:/models/x.pmx'
      }
      s = s.replace(/^\/+/, '');                    // 去掉开头的多余 / → 'D:/models/x.pmx'
      return s.replace(/\//g, '\\');                // 统一为 Windows 反斜杠路径
    }

      loading.style.opacity = '0';
