<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>浮灵饰界 - 灵汐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 320px;
      height: 460px;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 320px;
      height: 460px;
      position: relative;
      cursor: grab;
      overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }
    #live2d-canvas {
      display: block;
      width: 320px;
      height: 460px;
    }
    /* 灵汐默认形象 - 基于图片的多状态动画 */
    .css-lobster {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 200px;
      cursor: pointer;
      filter: drop-shadow(0 8px 24px rgba(255, 150, 180, 0.5)) var(--pet-color-filter, );
      user-select: none;
      transition: filter 0.3s ease;
    }
    .css-lobster img {
      display: block;
      width: 1em;
      height: 1em;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    /* idle 待机：呼吸浮动 */
    .css-lobster.state-idle img {
      animation: pet-idle 3s ease-in-out infinite;
    }
    @keyframes pet-idle {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.04) translateY(-2%); }
    }
    /* hover 悬停：轻微摇摆 */
    .css-lobster:hover img {
      animation: pet-hover 0.6s ease-in-out infinite;
    }
    @keyframes pet-hover {
      0%, 100% { transform: scale(1.02) rotate(-2deg); }
      50% { transform: scale(1.02) rotate(2deg); }
    }
    /* active 点击：压缩反馈 */
    .css-lobster:active img {
      animation: none;
      transform: scale(0.92);
    }
    /* happy 开心：跳跃动画（播放一次） */
    .css-lobster.state-happy img {
      animation: pet-happy 0.8s ease-out;
    }
    @keyframes pet-happy {
      0% { transform: scale(1, 1) translateY(0); }
      20% { transform: scale(1.1, 0.85) translateY(2%); }
      45% { transform: scale(0.9, 1.15) translateY(-25%); }
      70% { transform: scale(1.05, 0.95) translateY(-10%); }
      100% { transform: scale(1, 1) translateY(0); }
    }
    /* sleep 睡眠：慢速呼吸 + 微暗 */
    .css-lobster.state-sleep {
      filter: drop-shadow(0 4px 12px rgba(255, 150, 180, 0.3)) var(--pet-color-filter, );
    }
    .css-lobster.state-sleep img {
      animation: pet-sleep 5s ease-in-out infinite;
      opacity: 0.85;
    }
    @keyframes pet-sleep {
      0%, 100% { transform: scale(0.96) translateY(1%); }
      50% { transform: scale(1) translateY(-1%); }
    }
    /* 睡眠 Zzz */
    .pet-zzz {
      position: absolute;
      top: 15%;
      right: 10%;
      font-size: 0.25em;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .css-lobster.state-sleep .pet-zzz {
      opacity: 1;
      animation: zzz-float 2.5s ease-in-out infinite;
    }
    @keyframes zzz-float {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      30% { opacity: 0.8; }
      100% { transform: translateY(-120%) scale(1.2); opacity: 0; }
    }
    /* MMD 桌宠画布同样应用用户色彩设置（Live2D 由 .model-awake/.model-sleeping 处理） */
    #mmd-canvas { filter: var(--pet-color-filter, ); }
    #loading {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      text-align: center;
      pointer-events: none;
    }
    #loading .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #chat-bubble {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 40, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px 16px;
      min-width: 120px;
      max-width: 260px;
      color: #fff;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #chat-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-8px);
    }
    #chat-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: rgba(30, 30, 40, 0.92);
    }
    /* 思考指示器 */
    #thinking-indicator {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 40, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 10px 16px;
      color: #4fc3f7;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }
    #thinking-indicator.show { display: flex; }
    #thinking-indicator .dots {
      display: inline-flex;
      gap: 3px;
    }
    #thinking-indicator .dots span {
      width: 5px;
      height: 5px;
      background: #4fc3f7;
      border-radius: 50%;
      animation: dotPulse 1.4s infinite ease-in-out;
    }
    #thinking-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
    #thinking-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    /* 右键菜单 */
    #action-menu {
      position: absolute;
      background: rgba(25, 25, 35, 0.95);
      backdrop-filter: blur(15px);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
      z-index: 200;
      border: 1px solid rgba(255,255,255,0.1);
      min-width: 160px;
      max-width: 240px;
      /* 关键修复：菜单高度固定上限，不再随窗口(模型)放大而变长；
         超出则内部滚动，避免「右键菜单栏展示过长」 */
      max-height: min(380px, calc(100vh - 16px));
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    /* 菜单滚动条样式（细、低调，避免喧宾夺主） */
    #action-menu::-webkit-scrollbar { width: 6px; }
    #action-menu::-webkit-scrollbar-track { background: transparent; }
    #action-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
    #action-menu::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    #action-menu.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    #action-menu .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      color: #fff;
      font-size: 12.5px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #action-menu .menu-item:hover {
      background: rgba(79, 195, 247, 0.2);
    }
    #action-menu .menu-item .icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #action-menu .menu-item .icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    #action-menu .menu-divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 4px 0;
    }
    /* 分组标题：把过多功能归类，降低压迫感，便于快速定位"表情/动作" */
    #action-menu .menu-section {
      padding: 5px 12px 2px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(79, 195, 247, 0.9);
      text-transform: none;
      user-select: none;
    }
    #action-menu .menu-item:first-child { margin-top: 0; }

    /* 角色状态机控制面板（F9 切换；MMD 模型可用） */
    #sm-panel {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: rgba(20,22,28,0.82); color: #fff;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
      padding: 8px 10px; font-size: 12px; backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4); user-select: none;
    }
    #sm-panel.sm-hidden { display: none; }
    #sm-panel .sm-title { font-weight: 600; margin-bottom: 6px; text-align: center; letter-spacing: 1px; }
    #sm-panel .sm-row { display: flex; gap: 6px; margin-bottom: 6px; }
    #sm-panel .sm-btn {
      flex: 1; cursor: pointer; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08); color: #fff; border-radius: 6px;
      padding: 5px 8px; font-size: 12px; white-space: nowrap;
    }
    #sm-panel .sm-btn:hover { background: rgba(255,255,255,0.2); }
    #sm-panel .sm-btn:active { transform: translateY(1px); }
    #sm-panel .sm-hint { opacity: 0.6; font-size: 10px; text-align: center; margin-top: 2px; }
    /* Live2D 动作模组面板：列出当前模型真实拥有的动作组 + 表情，按小键盘 1-0 触发 */
    #l2d-panel {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 200px;
      max-height: min(70vh, 460px);
      background: rgba(25, 25, 35, 0.96);
      backdrop-filter: blur(15px);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
      z-index: 210;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: none;
    }
    #l2d-panel.show { display: block; }
    #l2d-panel::-webkit-scrollbar { width: 6px; }
    #l2d-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
    #l2d-panel .l2d-title {
      padding: 2px 8px 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(79, 195, 247, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #l2d-panel .l2d-close {
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: rgba(255,255,255,0.5);
      padding: 0 4px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      user-select: none;
      pointer-events: auto;
      position: relative;
      z-index: 10;
    }
    #l2d-panel .l2d-close:hover {
      color: rgba(255,255,255,0.95);
      background: rgba(255,255,255,0.1);
    }
    #l2d-panel .l2d-group {
      padding: 4px 8px 2px;
      font-size: 10.5px;
      color: rgba(255,255,255,0.45);
      font-weight: 600;
    }
    #l2d-panel .l2d-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      color: #fff;
      font-size: 12.5px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #l2d-panel .l2d-item:hover { background: rgba(79, 195, 247, 0.2); }
    #l2d-panel .l2d-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: #1a1a1a;
      background: rgba(255,255,255,0.85);
      border-radius: 4px;
      flex-shrink: 0;
    }
    #l2d-panel .l2d-item.expr .l2d-key { background: rgba(255, 183, 197, 0.9); }
    #l2d-panel .l2d-empty { padding: 10px 8px; font-size: 11.5px; color: rgba(255,255,255,0.5); line-height: 1.5; }
    /* 输入框区域 - hover时显示，圆角矩形 */
    #input-area {
      display: none;
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      /* 关键修复：搜索栏宽度固定上限并居中，模型放大(窗口变大)时不再变长变大 */
      max-width: 304px;
      margin: 0 auto;
      height: 72px;
      overflow: hidden;
      padding: 8px 12px 10px;
      background: rgba(20, 20, 28, 0.95);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 150;
      opacity: 0;
      transform: translateY(calc(100% + 8px));
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    /* 搜索条仅在以下情况显示：JS添加.show类（鼠标靠近底部）、输入框获得焦点、鼠标悬停搜索条本身 */
    #input-area.show,
    #input-area:focus-within,
    #input-area:hover {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    /* 拖动时强制隐藏输入框，防止 hover 触发布局变化 */
    #canvas-container.dragging #input-area {
      opacity: 0 !important;
      transform: translateY(calc(100% + 8px)) !important;
      pointer-events: none !important;
      transition: none !important;
    }
    .input-wrapper {
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 2px 2px 2px 12px;
      transition: border-color 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: rgba(79, 195, 247, 0.5);
      box-shadow: 0 0 0 2px rgba(79, 195, 247, 0.15);
    }
    #pet-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
      padding: 8px 0;
      font-family: inherit;
    }
    #pet-input::placeholder {
      color: rgba(255,255,255,0.35);
    }
    #pet-send {
      width: 32px;
      height: 32px;
      border: none;
      background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
      border-radius: 8px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    #pet-send:hover { transform: scale(1.08); }
    #pet-send:disabled { opacity: 0.5; cursor: not-allowed; }
    #pet-send svg { width: 16px; height: 16px; fill: white; }
    .input-hint {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      margin-top: 6px;
      text-align: center;
    }

    /* 模型透明度（来自设置里的“透明度”）：作用于画布和 BongoCat 背景/按键图片，保持视觉一致 */
    #live2d-canvas, #mmd-canvas, #bongo-background-image, #bongo-key-image { opacity: var(--model-opacity, 1); }
    /* 睡眠 ZZZ 指示器 */
    #sleep-indicator {
      position: absolute;
      top: 8%;
      right: 15%;
      font-size: 18px;
      color: rgba(180, 210, 255, 0.7);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 100;
      animation: none;
    }
    #sleep-indicator.show {
      opacity: 1;
      animation: floatUp 2.5s ease-out infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-30px); opacity: 0; }
    }
    /* 模型睡眠呼吸效果 */
    .model-sleeping {
      filter: brightness(0.7) saturate(0.6) var(--pet-color-filter, );
      transition: filter 1.5s ease;
    }
    .model-awake {
      filter: brightness(1.03) saturate(1.25) var(--pet-color-filter, );
      transition: filter 0.8s ease;
    }
    /* 执行动作提示 */
    #action-status {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(76, 175, 80, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 8px 14px;
      color: #fff;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
    }
    #action-status.show { display: flex; }
    #action-status .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
  <!-- Ammo(Bullet) 物理运行时：MMDPhysics 依赖它来驱动发/裙/胸等软组织的自然摆动。
       必须先于 mmdPet.bundle.js 加载。ammo.wasm.b64.js 内嵌 wasm(base64) 注入 Ammo，
       规避 Electron file:///asar 下 fetch wasm 失败；ammo.wasm.js 是 Emscripten glue，
       加载后在全局定义 window.Ammo 工厂函数。两者齐备后 mmdPet 的 ensureAmmo() 才会成功启用物理。 -->
  <script src="../../assets/lib/ammo/ammo.wasm.b64.js"></script>
  <script src="../../assets/lib/ammo/ammo.wasm.js"></script>
  <!-- MMD/PMX(3D) 模型渲染：Three.js + MMDLoader + mmdPet 已用 esbuild 打包为
       普通(classic)脚本，通过全局 window.MmdPet 暴露接口。用普通脚本标签加载可在
       file:// 下正常工作（ES Module 动态 import / import map 在 file:// 下会被 Chromium 拒绝）。 -->
  <script src="js/mmdPet.bundle.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="live2d-canvas"></canvas>
    <canvas id="mmd-canvas" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
    <!-- ★ BongoCat 键盘图片叠加层：严格参考 ayangweb/BongoCat 的实现 -->
    <!-- ★ BongoCat 键盘图片叠加层：大小和位置和模型完全一致（动态设置） -->
    <img id="bongo-background-image" style="display:none; position:absolute; pointer-events:none; z-index:-1;">
    <img id="bongo-key-image" style="display:none; position:absolute; pointer-events:none; z-index:100;">
    <div id="css-lobster" class="css-lobster state-idle" style="display:none;">
      <img src="../../assets/icons/pet-lingxi-512.png" alt="灵汐">
      <div class="pet-zzz">z Z</div>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">正在加载灵汐...</div>
    </div>
    <div id="chat-bubble"></div>
    <div id="thinking-indicator">
      <span>灵汐思考中</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>
    <div id="action-status">
      <span class="spinner"></span>
      <span id="action-status-text">执行中...</span>
    </div>
    <div id="sleep-indicator"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>
    <!-- 调试面板：用于诊断 2D 模型加载问题，按 Shift+F3 切换显示 -->
    <div id="debug-panel" style="display:none; position:absolute; top:4px; left:4px; right:4px; max-height:180px; background:rgba(0,0,0,0.85); color:#0f0; font-family:monospace; font-size:10px; padding:6px; z-index:99999; overflow:auto; border-radius:4px; pointer-events:auto; line-height:1.5;"></div>
    <script>
      // 全局调试日志收集器
      window.__debugLogs = [];
      window.__debugLog = function(msg) {
        const ts = new Date().toLocaleTimeString('zh-CN', {hour12:false});
        window.__debugLogs.push('[' + ts + '] ' + msg);
        if (window.__debugLogs.length > 50) window.__debugLogs.shift();
        var panel = document.getElementById('debug-panel');
        if (panel) panel.textContent = window.__debugLogs.join('\n');
      };
      // 组合模型部件位姿微调：Shift+F4 进入/退出，方向键与 PgUp/Dn 移动、r/R 旋转、[ ]切换、s 保存、Esc 退出
      var partAdjust = { active: false, idx: 0, step: 0.05, stepRot: 0.08 };

      function partAdjustHint() {
        if (!partAdjust.active) { showBubble('组合部件调整：已开启', 1500); return; }
        var extras = (mmdPet && mmdPet.getExtraMeshes) ? mmdPet.getExtraMeshes() : [];
        var m = extras[partAdjust.idx];
        if (!m) { showBubble('无附加部件可调', 1500); return; }
        showBubble('部件#' + partAdjust.idx + ' pos=' + m.position.x.toFixed(2) + ',' +
          m.position.y.toFixed(2) + ',' + m.position.z.toFixed(2) +
          '  ←→前后 ↑↓上下 PgUp/Dn左右 r/R转Y [ ]切换 s保存 Esc退出', 2500);
      }

      function savePartTransforms() {
        if (!comboUserModel) return;
        var combo = comboUserModel.comboModels || [];
        var extras = (mmdPet && mmdPet.getExtraMeshes) ? mmdPet.getExtraMeshes() : [];
        // 默认 null（保持作者位姿）；仅把当前确实加载的附加网格写成其实际局部坐标
        var pt = combo.map(function () { return null; });
        extras.forEach(function (m) {
          var ci = (typeof m.userData.comboIndex === 'number') ? m.userData.comboIndex : -1;
          if (ci >= 0 && ci < pt.length) {
            pt[ci] = {
              position: [m.position.x, m.position.y, m.position.z],
              rotation: [m.rotation.x, m.rotation.y, m.rotation.z],
              scale: m.scale.x
            };
          }
        });
        try { window.api.updateModel(comboUserModel.id, { partTransforms: pt }); }
        catch (e) { console.error('[Pet] 保存部件位姿失败:', e); }
      }

      document.addEventListener('keydown', function(e) {
        if (e.shiftKey && e.key === 'F3') {
          var panel = document.getElementById('debug-panel');
          if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
          return;
        }
        if (e.shiftKey && e.key === 'F4') {
          if (!comboUserModel) { showBubble('当前不是组合模型，无可调部件', 2000); return; }
          partAdjust.active = !partAdjust.active;
          if (partAdjust.active) partAdjust.idx = 0;
          partAdjustHint();
          return;
        }
        if (partAdjust.active) {
          if (!comboUserModel) { partAdjust.active = false; return; }
          var extras = (mmdPet && mmdPet.getExtraMeshes) ? mmdPet.getExtraMeshes() : [];
          var m = extras[partAdjust.idx];
          if (!m) { showBubble('无附加部件可调', 1500); return; }
          var handled = true;
          switch (e.key) {
            case 'ArrowLeft':  m.position.x -= partAdjust.step; break;
            case 'ArrowRight': m.position.x += partAdjust.step; break;
            case 'ArrowUp':    m.position.y += partAdjust.step; break;
            case 'ArrowDown':  m.position.y -= partAdjust.step; break;
            case 'PageUp':     m.position.z += partAdjust.step; break;
            case 'PageDown':   m.position.z -= partAdjust.step; break;
            case 'r': case 'R': m.rotation.y -= partAdjust.stepRot; break;
            case '[': partAdjust.idx = (partAdjust.idx - 1 + extras.length) % extras.length; break;
            case ']': partAdjust.idx = (partAdjust.idx + 1) % extras.length; break;
            case 's': case 'S': savePartTransforms(); showBubble('已保存部件位姿', 1500); break;
            case 'Escape': partAdjust.active = false; showBubble('已退出部件调整', 1500); break;
            default: handled = false;
          }
          if (handled) { e.preventDefault(); partAdjustHint(); }
          return;
        }
      });
    </script>

    <script>
      // ===== 全局崩溃/异常捕获 =====
      // 渲染进程“闪退”通常是 WebGL 上下文丢失（超大纹理导致显存溢出）或运行时异常，
      // 但 Electron 默认不会留下可读日志。这里在早期注册监听，把原因上报到主进程写入
      // userData/crash.log，并在上下文丢失时弹提示，避免“闪退无日志”无法定位。
      (function () {
        function reportCrash(tag, detail) {
          try {
            var msg = '[' + tag + '] ' + detail;
            console.error('[CRASH-CAPTURE] ' + msg);
            if (window.api && window.api.logCrash) window.api.logCrash(msg).catch(function () {});
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          var d = (e && e.message ? e.message : 'unknown') +
            (e && e.filename ? ' @ ' + e.filename + ':' + (e.lineno || '') : '');
          reportCrash('window.error', d);
          // ★ 增强：如果错误与 WebGL/渲染/模型相关，自动触发上下文丢失恢复流程。
          // 某些 Chromium 版本在 WebGL 上下文丢失时不会触发 webglcontextlost 事件，
          // 而是抛出 JS 异常（如 "WebGL: CONTEXT_LOST_WEBGL" 或 "framebuffer incomplete"）。
          // 这里通过错误消息匹配来兜底触发恢复，避免模型"一瞬间消失"后无法自愈。
          try {
            var msg = String(d || '').toLowerCase();
            var isRenderError = /webgl|context|framebuffer|shader|texture|render|drawing buffer|lost|gl\.|invalid operation|out of memory/.test(msg);
            if (isRenderError && !window.__webglContextLost) {
              console.warn('[CRASH-CAPTURE] 检测到渲染相关错误，触发 WebGL 恢复流程:', d);
              window.__webglContextLost = true;
            }
          } catch (_) {}
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          var s = r && (r.stack || r.message) ? (r.stack || r.message) : String(r);
          reportCrash('unhandledrejection', s);
          // ★ 增强：Promise rejection 也可能是渲染/模型加载失败，尝试触发恢复
          try {
            var reason = String(s || '').toLowerCase();
            if (/webgl|context|framebuffer|shader|texture|render|lost|out of memory/.test(reason) && !window.__webglContextLost) {
              console.warn('[CRASH-CAPTURE] 检测到渲染相关 rejection，触发恢复:', s);
              window.__webglContextLost = true;
            }
          } catch (_) {}
        });
        // WebGL 上下文丢失是最可能的"闪退"根因（大纹理/显存不足/驱动重置）
        document.addEventListener('webglcontextlost', function (e) {
          reportCrash('webglcontextlost', 'WebGL 上下文丢失（显存不足或驱动重置），超大纹理模型易触发');
          try { e.preventDefault(); } catch (err) {}
          // ★ 设置全局标志，主逻辑的恢复轮询会检测到并尝试重建 PIXI + 重载模型
          window.__webglContextLost = true;
        }, true);
      })();
    </script>

    // ★★★ 调试日志收集与复制功能 ★★★
    // 收集所有 [L2D] / [loadModel] / [Typing] / [Pet] / [live2d协议] 相关的日志，

    (function setupLogCollector() {

      const MAX_LOGS = 500;

      },

      // 根据意图解析出模型真实存在的动作组名（动态，依赖 availableMotions）
      resolveMotionGroup(intent) {
        const patterns = this.INTENT_PATTERNS[intent];
        if (!patterns) return null;
        const groups = Object.keys(availableMotions);
        const lower = groups.map(g => g.toLowerCase());
        for (const p of patterns) {
          const idx = lower.findIndex(g => g.includes(p));
          if (idx >= 0) return groups[idx];
        }
        return null;
      },

      hasMotion(intent) {
        return !!this.resolveMotionGroup(intent);
      },

      // 按意图播放动作：解析到模型真实动作组后随机挑一个动作强制播放
      // （priority=3 FORCE，确保打断当前动作，立即响应"操作"）
      playMotion(intent) {
        // ★ Bongocat 键盘猫不播放任何普通模型动作（睡觉/跳舞/待机表情等），
        // 其行为完全由键盘/鼠标驱动的手部参数接管（setupBongocatInteraction）。
        if (window.isBongocatMode) return false;
        // 睡眠状态下只允许 sleep/wake 动作，其他动作一律阻止
        if (this.state === 'SLEEPING' && intent !== 'sleep' && intent !== 'wake') return false;
        if (currentPetType === 'MMD' && mmdPet) { mmdPet.playIntent(intent); return true; }
        if (!useLive2D || !currentModel) return false;
        const group = this.resolveMotionGroup(intent);
        if (!group) return false;
        try {
          const count = availableMotions[group] || 0;
          const index = count > 0 ? Math.floor(Math.random() * count) : 0;
          currentModel.motion(group, index, 3);
          return true;
        } catch (e) { /* 静默失败 */ }
        return false;
      },

      // 随机播放模型任意一个真实存在的动作组（用于闲置时增加变化，充分利用模型自带动作）
      playRandomGroupMotion() {
        if (window.isBongocatMode) return false; // 键盘猫不随机播普通动作
        if (currentPetType === 'MMD' && mmdPet) { mmdPet.playIntent('idle'); return true; }
        const groups = Object.keys(availableMotions).filter(g => (availableMotions[g] || 0) > 0);
        if (!groups.length || !useLive2D || !currentModel) return false;
        const group = groups[Math.floor(Math.random() * groups.length)];
        const count = availableMotions[group];
        const index = Math.floor(Math.random() * count);
        try {
          currentModel.motion(group, index, 3);
          return true;
        } catch (e) { return false; }
      },

      // 语义意图 → 由模型真实动作组构成的"动作编排序列"
      // 模型若没有 dance/wave/think 等专门组，就用它真实拥有的组（Idle/Tap/Flick/FlickUp）
      // 连成一段小表演，让 AI 每个意图都能播出一个不一样、可辨识的动作组合（而非静默或永远同一套）。
      // 序列项可以是意图关键词，也可以是直接组名；解析不到真实组的项会被自动跳过。
      INTENT_SEQUENCES: {
        idle:      ['idle'],
        happy:     ['flickup', 'flick', 'flickup'],
        dance:     ['flick', 'tap', 'flickup', 'tap', 'flick'],
        greet:     ['tap', 'tap'],
        wave:      ['tap', 'tap'],
        hello:     ['tap'],
        hi:        ['tap'],
        think:     ['idle', 'idle'],
        sad:       ['idle'],
        surprise:  ['flickup'],
        confuse:   ['flick', 'tap'],
        shy:       ['idle'],
        angry:     ['flick'],
        lazy:      ['idle'],
        tap:       ['tap'],
        flick:     ['flick'],
        click:     ['tap'],
        flickup:   ['flickup'],
        reset:     ['idle'],
        turn:      ['turn'],
        spin:      ['turn'],
        nod:       ['nod'],
        shake:     ['shake'],
        bow:       ['bow'],
        jump:      ['jump'],
        back:      ['turn_away'],
        squat:     ['squat'],
        sit:       ['sit'],
        stand:     ['stand'],
        stretch:   ['stretch'],
        think:     ['think'],
        shy:       ['shy'],
        clap:      ['clap'],
        point:     ['point'],
        yawn:      ['yawn'],
        cross:     ['cross']
      },

      // 串联播放一段动作序列（利用 motion() 返回的 Promise 链式衔接）
      // 每个动作最长等待 ~850ms 即进入下一个，保证表演节奏明快；
      // 若某意图解析不到任何真实组：
      //   - 默认（非 exact）：退化为播放一个随机真实动作，确保宠物"总有反应"；
      //   - exact=true（显式语义意图）：不再随机播无关组，返回 false，交给调用方的
      //     ParamDriver.express(intent) 用模型参数（眼/嘴/头/身）表达该情绪，避免错配。
      playMotionSequence(seq, opts) {
        if (window.isBongocatMode) return false; // 键盘猫不播放动作序列
        const exact = !!(opts && opts.exact);
        if (currentPetType === 'MMD' && mmdPet) { mmdPet.playIntent(seq[0]); return true; }
        if (!useLive2D || !currentModel || !Array.isArray(seq) || !seq.length) return false;
        const groups = seq
          .map(item => {
            const g = this.resolveMotionGroup(item);
            if (g) return g;
            return (availableMotions[item] != null) ? item : null; // 允许直接写组名
          })
          .filter(Boolean);
        if (!groups.length) return exact ? false : this.playRandomGroupMotion();
        groups.reduce((prev, g) =>
          prev.then(() => new Promise(res => {
            try {
              const count = availableMotions[g] || 0;
              const idx = count > 0 ? (Math.random() * count | 0) : 0;
              const p = currentModel.motion(g, idx, 3);
              const cap = new Promise(r => setTimeout(r, 850));
              Promise.race([Promise.resolve(p).catch(() => {}), cap])
                .then(() => setTimeout(res, 100));
            } catch (e) { setTimeout(res, 150); }
          })),
          Promise.resolve()
        );
        return true;
      },

      // 接收主窗口推送的动作配置（含待机组合 idleCombo）
      setActionsConfig(data) {
        data = data || {};
        const combo = Array.isArray(data.idleCombo) ? data.idleCombo.filter(Boolean) : [];
        const changed = combo.join(',') !== this.idleCombo.join(',');
        this.idleCombo = combo;
        if (!combo.length) {
          // 配置被清空：立即停止进行中的循环
          this.stopIdleCombo();
          return;
        }
        // 已配置组合且在闲置态：立即（重）启动循环
        if (this.state !== 'SLEEPING' && this.state !== 'THINKING' && this.state !== 'DRAGGING') {
          if (changed || !this._comboLooping) this.startIdleCombo();
        }
      },

      // 模型载入后，把该模型的待机组合配置(idleCombo)灌给 PetBrain，
      // 确保即便没有再次"保存"，重启/换模型后待机组合依然生效（与既有"设为待机"单动作一致）。
      // 主窗口只在保存时推 pet:set-actions；这里在加载侧补一次，覆盖启动/换模场景。
      syncIdleCombo(model) {
        const m = model || userModel;
        if (!m) return Promise.resolve();
        return (async () => {
          try {
            let data = null;
            const isMmd = !!(m.type === 'MMD' || /\.(pmx|pmd)$/i.test(m.modelFile || ''));
            if (isMmd && m.installPath) {
              const actionsPath = window.api.path.join(m.installPath, 'actions.json');
              const res = await window.api.readFile({ path: actionsPath });
              const raw = (res && res.success && res.data != null) ? res.data : (typeof res === 'string' ? res : null);
              if (raw) data = JSON.parse(raw);
            } else if (m.id) {
              const res = await window.api.getActions(m.id);
              if (res && res.success && res.data != null) data = res.data;
              else if (res) data = res; // 直接返回对象
            }
            if (data) PetBrain.setActionsConfig(data);
          } catch (e) { /* 无动作配置时忽略，回退到默认随机摆动 */ }
        })();
      },

      // 开始待机组合循环播放（同步、顺序、循环）
      startIdleCombo() {
        // ★ Bongocat 键盘猫不循环待机组合动作
        if (window.isBongocatMode) { this._comboLooping = false; return; }
        if (!this.idleCombo || !this.idleCombo.length) { this._comboLooping = false; return; }
        // 先令进行中的旧循环（含 MMD 引擎侧）失效，再从新序列重启，避免叠加/残留
        this._comboToken = (this._comboToken || 0) + 1;
        if (currentPetType === 'MMD' && mmdPet && mmdPet.stopCombo) { try { mmdPet.stopCombo(); } catch (e) {} }
        this._comboLooping = true;
        this.playComboLoop(this.idleCombo.slice(), this._comboToken);
      },

      // 停止待机组合循环（令进行中的循环令牌失效，并通知 MMD 引擎侧停止）
      stopIdleCombo() {
        this._comboLooping = false;
        this._comboToken = (this._comboToken || 0) + 1;
        if (currentPetType === 'MMD' && mmdPet && mmdPet.stopCombo) { try { mmdPet.stopCombo(); } catch (e) {} }
      },

      isComboLooping() { return !!this._comboLooping; },

      // 循环播放一段组合：顺序播完各动作后自动重播，直到令牌失效
      playComboLoop(seq, token) {
        if (window.isBongocatMode) { this._comboLooping = false; return; } // 键盘猫不循环待机组合
        if (token !== this._comboToken) return; // 已被新循环/停止取代
        // MMD 模式：引擎直接消费"意图序列"（playCombo→playIntent 按意图驱动程序化动作）。
        // 必须在 Live2D 的 groups 解析之前处理——MMD 的 availableMotions 为空，
        // 若先做 groups 解析会因空数组提前 return，导致 MMD 组合永远不播放。
        if (currentPetType === 'MMD' && mmdPet && mmdPet.playCombo) {
          try { mmdPet.playCombo(seq.slice(), token); } catch (e) { /* 忽略 */ }
          return;
        }
        const groups = seq
          .map(item => {
            const g = this.resolveMotionGroup(item);
            if (g) return g;
            return (availableMotions[item] != null) ? item : null; // 允许直接写组名
          })
          .filter(Boolean);
        if (!groups.length) { this._comboLooping = false; return; }
        if (!useLive2D || !currentModel) { this._comboLooping = false; return; }
        let p = Promise.resolve();
        for (const g of groups) {
          p = p.then(() => new Promise(res => {
            if (token !== this._comboToken) { res(); return; }
            try {
              const count = availableMotions[g] || 0;
              const idx = count > 0 ? (Math.random() * count | 0) : 0;
              const pr = currentModel.motion(g, idx, 3);
              const cap = new Promise(r => setTimeout(r, 850));
              Promise.race([Promise.resolve(pr).catch(() => {}), cap])
                .then(() => setTimeout(res, 100));
            } catch (e) { setTimeout(res, 150); }
          }));
        }
        p.then(() => {
          if (token !== this._comboToken) return;
          // 一轮播完，稍作间隔后重播，形成循环
          setTimeout(() => this.playComboLoop(seq, token), 200);
        });
      },

      // 语义动作 → 意图映射（对外暴露的固定动作名，内部再解析为模型真实动作组）
      ACTION_INTENT: {
        sleep: 'sleep', wake: 'wake', dance: 'dance', happy: 'happy',
        wave: 'greet', greet: 'greet', hello: 'greet', hi: 'greet',
        think: 'think', sad: 'sad', surprise: 'surprise', idle: 'idle',
        confuse: 'confuse', shy: 'shy', angry: 'angry', lazy: 'lazy',
        click: 'tap', tap: 'tap', flick: 'flick', reset: 'reset',
        turn: 'turn', spin: 'turn', nod: 'nod', shake: 'shake',
        bow: 'bow', jump: 'jump', back: 'turn_away',
        squat: 'squat', sit: 'sit', stand: 'stand', stretch: 'stretch',
        clap: 'clap', point: 'point', yawn: 'yawn', cross: 'cross'
      },

      // 执行语义动作：播放对应动作 + 气泡（"睡觉就躺着、跳舞就跳、有声音就放"）
      // 返回是否成功触发
      doAction(name) {
        // ★ Bongocat 键盘猫不接受任何普通语义动作（睡觉/跳舞等），
        // 直接返回，避免通过动作编辑器/AI 指令把普通宠物动作套到键盘猫上。
        if (window.isBongocatMode) return false;
        const intent = this.ACTION_INTENT[name] || name;
        // MMD 模式：语义动作统一交给 MMD 控制器（程序化动作 + 表情 morph）
        if (currentPetType === 'MMD' && mmdPet) {
          return this.doActionMMD(name, intent);
        }
        try {
          // 睡眠：进入睡眠态（setState 内部会调用 enterSleep 统一处理睡眠表现，
          // 包括播放模型自带 sleep 动作、变暗、ZZZ），不要调用 onInteraction（否则会立刻唤醒）
          if (intent === 'sleep') {
            this.setState('SLEEPING');
            return true;
          }
          // 唤醒：若正处于睡眠则切回 AWAKE（exitSleep 会复位躺下并播 wake 动作）
          if (intent === 'wake') {
            if (this.state === 'SLEEPING') this.setState('AWAKE');
            else this.playMotion('wake');
            return true;
          }
          // 重置：自动复位状态/情绪，并播一段过渡（稍等 → 我学会了）
          if (intent === 'reset') {
            // 过渡①：重置中
            showBubble('稍等…', 1200);
            // 复位行为状态：退出睡眠/思考，回到待机
            if (this.state === 'SLEEPING' || this.state === 'THINKING') hideThinking();
            this.setState('AWAKE');   // 睡眠态会触发 exitSleep；并重排随机/睡眠计时
            this.mood = 50;           // 情绪归中
            this.resetIdle();         // 清除空闲/睡眠计时并重排
            // 过渡动画：快速"收缩→弹回"脉冲，给出明确的"重置"反馈
            this.petResetTransition();
            // 若模型自带 reset/recover 动作组则播放，否则用 idle/tap 兜底
            if (!this.playMotion('reset')) {
              this.playMotion('idle') || this.playMotion('tap');
            }
            // 过渡②：重置完成
            setTimeout(() => { if (this.state !== 'SLEEPING') showBubble('我学会了！', 2000); }, 700);
            return true;
          }
          // 其它动作：确保处于可交互状态后再播放
          if (this.state === 'SLEEPING' || this.state === 'THINKING') this.setState('AWAKE');
          this.onInteraction('action');
          // 用"动作编排序列"播出一个可辨识的表演（即便模型没有专门组，也会用真实组连成小段）
          const seq = this.INTENT_SEQUENCES[name] || this.INTENT_SEQUENCES[intent] || [intent];
          // exact=true：解析不到真实组时不再随机错配，交由下方 ParamDriver.express 用参数表达情绪
          this.playMotionSequence(seq, { exact: true });
          // 关键：无论模型是否有对应动作组，都用"模型组件(参数/部件)驱动"叠加表达该意图，
          // 让 AI 的每个意图都真正驱动模型做对应的表情/动作，而不是只会循环播放既有动画。
          // （例如模型只有 Idle/Tap/Flick 时，happy 也能通过嘴角/笑眼/头部等参数表现出"开心"）
          ParamDriver.express(intent, 1300);
          const b = this.ACTION_BUBBLE[name];
          if (b) showBubble(b, 2500);
          return true;
        } catch (e) { return false; }
      },

      // MMD 模式下的语义动作执行（与 doAction 平行，但走 Three.js 控制器）。
      // Live2D 路径的 doAction 已被上面的 MMD 分支短路，这里只处理 MMD 表现。
      doActionMMD(name, intent) {
        try {
          // 睡眠：进入睡眠态（setState 内部已切换 MMD 闭眼/睡眠姿势）
          if (intent === 'sleep') {
            this.setState('SLEEPING');
            return true;
          }
          // 唤醒：睡眠态则切回 AWAKE（会恢复睁眼）；否则播一段唤醒动作
          if (intent === 'wake') {
            if (this.state === 'SLEEPING') this.setState('AWAKE');
            else mmdPet.playIntent('wake');
            return true;
          }
          // 重置：复位状态/情绪，并给一段"重置"反馈
          if (intent === 'reset') {
            showBubble('稍等…', 1200);
            if (this.state === 'SLEEPING' || this.state === 'THINKING') hideThinking();
            this.setState('AWAKE');
            this.mood = 50;
            this.resetIdle();
            mmdPet.playIntent('reset');
            setTimeout(() => { if (this.state !== 'SLEEPING') showBubble('我学会了！', 2000); }, 700);
            return true;
          }
          // 其它动作：确保处于可交互状态后再表现
          if (this.state === 'SLEEPING' || this.state === 'THINKING') this.setState('AWAKE');
          this.onInteraction('action');
          mmdPet.playIntent(intent);
          const b = this.ACTION_BUBBLE[name];
          if (b) showBubble(b, 2500);
          return true;
        } catch (e) { return false; }
      },

      // 复合动作叠加：依次播放多个语义动作（如"开心跳舞"→happy+dance）。
      // 每个动作间隔一小段时间，保证各自表情/动作可辨识；单个动作等价于 doAction。
      doActions(names) {
        if (!Array.isArray(names) || !names.length) return false;
        if (names.length === 1) return this.doAction(names[0]);
        names.forEach((n, i) => {
          setTimeout(() => { try { this.doAction(n); } catch (e) {} }, i * 900);
        });
        return true;
      },

      ACTION_BUBBLE: {
        sleep: '晚安~我去睡啦', wake: '醒醒，我起来啦！', dance: '跳舞时间到！',
        happy: '好开心呀！', wave: '嗨！', greet: '你好呀！', think: '让我想想...',
        sad: '呜...', surprise: '哇！', idle: '发会儿呆~',
        confuse: '嗯？', shy: '呜…别看我', angry: '哼！', lazy: '好懒呀~',
        turn: '转个身~', nod: '嗯嗯！', shake: '不是不是', bow: '给你鞠个躬', jump: '跳！',
        squat: '蹲下！', sit: '坐下歇会儿', stand: '起立！', stretch: '伸个懒腰~',
        think: '让我想想...', shy: '呜…别看我', clap: '呱唧呱唧！', point: '看那儿！',
        yawn: '哈啊——', cross: '叉腰站着'
      },

      doShake() {
        if (!useLive2D || !currentModel || !pixiApp) return;
        try {
          const origX = currentModel.x;
          const origY = currentModel.y;
          const amplitude = 2 + Math.random() * 3;
          const duration = 300;
          const start = performance.now();

          function anim(ts) {
            const elapsed = ts - start;
            if (elapsed > duration) {
              currentModel.x = origX;
              currentModel.y = origY;
              return;
            }
            const progress = elapsed / duration;
            const decay = 1 - progress;
            const offset = Math.sin(progress * Math.PI * 6) * amplitude * decay;
            currentModel.x = origX + offset;
            currentModel.y = origY + offset * 0.5;
            requestAnimationFrame(anim);
          }
          requestAnimationFrame(anim);
        } catch (e) { /* ignore */ }
      },

      // 重置过渡动画：模型快速"收缩→弹回"脉冲，作为"已重置"的视觉反馈
      petResetTransition() {
        if (!useLive2D || !currentModel || !pixiApp || currentPetType === 'MMD') return;
        try {
          const baseScale = currentModel.scale.x || 1;
          const start = performance.now();
          const dur = 480;
          function step(ts) {
            const t = (ts - start) / dur;
            if (t >= 1) { currentModel.scale.set(baseScale); return; }
            // 先收缩到约 0.82 再弹回 1.0
            const s = baseScale * (1 - 0.18 * Math.sin(Math.PI * t));
            currentModel.scale.set(s);
            requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        } catch (e) { /* ignore */ }
      },

      // ====== 睡眠系统 ======

      enterSleep() {
        // ★ Bongocat 键盘猫不进入睡眠态：不调暗、不显示 ZZZ、不播放 sleep 动作。
        // 即便外部（如 AI 指令/动作编辑器）触发了 setState('SLEEPING')，这里也直接拦截。
        if (window.isBongocatMode) return;
        const sleepIndicator = document.getElementById('sleep-indicator');
        sleepIndicator.classList.add('show');

        // 模型变暗（睡眠呼吸效果）
        if (canvas) {
          canvas.classList.remove('model-awake'); // 清掉残留的唤醒态，避免与 model-sleeping 叠加导致不黯淡
          canvas.classList.add('model-sleeping');
        }
        if (cssLobster) {
          cssLobster.classList.remove('state-idle', 'state-happy');
          cssLobster.classList.add('state-sleep');
        }


        // 显示睡眠气泡
        const msg = this.randomBubble('goingToSleep');
        if (msg) showBubble(msg, 3000);

        // 定期显示 ZZZ
        this.sleepZZZInterval = setInterval(() => {
          sleepIndicator.style.animation = 'none';
          sleepIndicator.offsetHeight; // 强制回流
          sleepIndicator.style.animation = 'floatUp 2.5s ease-out';
        }, 3000);

        // 睡眠不再整体翻转/旋转整个模型容器：
        // 那种做法属于"整体变换"而非模型局部动画，且容易"倒下后回不正"。
        // 睡眠状态用 变暗(filter) + ZZZ 提示表达；若模型自身带 sleep 动作组则播放（局部动画）。
        ParamDriver.setSleeping(true);

        // 停掉模型正在播放的任意动作（含可能循环播放的 idle），避免睡眠时身体/睫毛继续动；
        // 之后再逐帧把姿势钉死（见下方 ticker 注册），盖过模型自带物理/眨眼残影。
        try {
          const mm = currentModel && currentModel.motionManager;
          if (mm && typeof mm.stopAllMotions === 'function') mm.stopAllMotions();
        } catch (e) { /* ignore */ }

        // 在模型自身 update（含物理）之后逐帧钉睡眠姿势：用低优先级 ticker 监听，
        // 确保晚于模型内部 update 执行，覆盖它之后的物理/动画改写。
        if (pixiApp && pixiApp.ticker && !this._sleepPin) {
          this._sleepPin = () => ParamDriver.pinSleep();
          pixiApp.ticker.add(this._sleepPin, null, -25);
        }

        if (this.hasMotion('sleep')) this.playMotion('sleep');
        else ParamDriver.express('sleep', 1500);

        // 睡眠一段时间后自动醒来活动一会儿，避免闲时一直睡觉
        clearTimeout(this.autoWakeTimer);
        this.autoWakeTimer = setTimeout(() => {
          if (this.state === 'SLEEPING') {
            // setState('AWAKE') 会触发 exitSleep，自动播放 wake 动作并重置眼睛
            this.setState('AWAKE');
            // 醒来后显示一个气泡，让用户明显感知到模型醒了
            setTimeout(() => {
              if (this.state === 'AWAKE') {
                const wakeMsgs = ['啊~睡醒了', '伸个懒腰~', '精神满满！', '刚才做了个好梦', '继续摸鱼~'];
                const msg = wakeMsgs[Math.floor(Math.random() * wakeMsgs.length)];
                showBubble(msg, 2500);
              }
            }, 800);
          }
        }, this.sleepDuration);
      },

      exitSleep() {
        const sleepIndicator = document.getElementById('sleep-indicator');
        sleepIndicator.classList.remove('show');
        clearInterval(this.sleepZZZInterval);
        clearTimeout(this.autoWakeTimer);

        // 移除睡眠姿势钉，恢复模型自身动画（唤醒后由 wake 动作/参数表达接管）
        if (this._sleepPin) {
          try { if (pixiApp && pixiApp.ticker) pixiApp.ticker.remove(this._sleepPin); } catch (e) {}
          this._sleepPin = null;
        }

        if (canvas) {
          canvas.classList.remove('model-sleeping');
          canvas.classList.add('model-awake');
        }
        if (cssLobster) {
          cssLobster.classList.remove('state-sleep', 'state-happy');
          cssLobster.classList.add('state-idle');
        }


        // 复位"躺着"变换
        if (container) container.style.transform = '';

        // 播放醒来动作（模型无对应动作组时退回参数驱动表达）
        ParamDriver.setSleeping(false);
        if (!this.playMotion('wake')) ParamDriver.express('wake', 1200);

        // 醒来气泡
        setTimeout(() => {
          const msg = this.randomBubble('returnFromSleep');
          if (msg) showBubble(msg, 3500);
        }, 600);
      },

      // ====== 点击处理 ======

      handleClick() {
        this.onInteraction('click');

        // 短时间内连击检测：快速连点会升级为更激动的反应
        this.clickCount++;
        clearTimeout(this.clickWindow);
        this.clickWindow = setTimeout(() => {
          const n = this.clickCount;
          let action;
          if (n >= 5) {
            action = 'happy';                       // 狂戳 → 开心/受不了
          } else if (n >= 2) {
            action = 'double_click';                // 双击 → 双击反应
          } else {
            // 单次点击：从一组反应里随机挑一个，让"每次触碰"都做出不一样的小动作
            action = ['click', 'tap', 'flick', 'greet', 'happy'][Math.floor(Math.random() * 5)];
          }
          // 播放对应动作组（模型有则播），并叠加"模型组件驱动"，
          // 保证无论模型有无对应动作组，触碰都会有不同且可见的反应（而非只播同一段动画）。
          this.playMotion(action);
          ParamDriver.express(action, 1000);
          const bubble = (n >= 5) ? this.randomBubble('rapidClick') : this.randomBubble('clicked');
          if (bubble) showBubble(bubble, 2000);
          this.clickCount = 0;
        }, 600);
      },

      // 拖拽反应
      onDragStart() {
        // 睡眠中被按下/拖拽：先唤醒（恢复亮度、播放 wake 动画），再进入拖拽态，
        // 否则状态会先被改成 DRAGGING，导致 onInteraction 的"睡眠中唤醒"分支永远不触发，
        // 宠物变黑后无法恢复。
        if (this.state === 'SLEEPING') this.setState('AWAKE');
        this.setState('DRAGGING');
        this.onInteraction('drag');
        // 被抓住时给一个"惊讶/被拎起来"的组件反应
        ParamDriver.express('surprise', 900);
      },

      onDragEnd() {
        this.setState('AWAKE');
        // 放下时播放对应动作并叠加组件驱动
        this.playMotion('drag_end');
        ParamDriver.express('drag_end', 1100);
        const msg = this.randomBubble('dragged');
        if (msg) showBubble(msg, 2000);
      },

      // AI思考状态
      onThinking() {
        ParamDriver.setThinking(true);
        this.setState('THINKING');
      },

      onThinkingDone() {
        ParamDriver.setThinking(false);
        this.setState('AWAKE');
        this.onInteraction('ai_done');
      },

      // 任务完成
      onTaskDone() {
        const msg = this.randomBubble('taskDone');
        if (msg) showBubble(msg, 2500);
      },

      // ====== 初始化 ======
      init(config) {
        if (config?.pet?.idleTimeout) {
          this.sleepTimeout = config.pet.idleTimeout * 1000;
        }
        this.lastInteraction = Date.now();
        this.setState('AWAKE');

        // 启动时显示问候语
        setTimeout(() => {
          if (this.state === 'AWAKE') {
            const msg = this.randomBubble('greet');
            if (msg) showBubble(msg, 4000);
          }
        }, 1500);
      },

      // ====== 清理 ======
      destroy() {
        clearTimeout(this.idleTimer);
        clearTimeout(this.randomActionTimer);
        clearTimeout(this.sleepTimer);
        clearTimeout(this.clickWindow);
        clearInterval(this.sleepZZZInterval);
        if (this._sleepPin) {
          try { if (pixiApp && pixiApp.ticker) pixiApp.ticker.remove(this._sleepPin); } catch (e) {}
          this._sleepPin = null;
        }
      }
    };

    // ==================== 参数/部件驱动引擎 (ParamDriver) ====================
    // 痛点：导入的模型若没有动作组(availableMotions 为空)，现有的 playMotion 会静默失败，
    // 宠物只能循环 idle 或仅做位置抖动，AI 无法让模型“动起来”。
    // 本引擎直接驱动模型自身的 Live2D 参数/部件(眼睛、嘴巴、头部、身体、呼吸)，
    // 让没有动作组的模型也能拥有丰富的“环境待机”表现；并在 AI 意图没有对应动作组时
    // 通过参数表达情绪，使动作更丰富。兼容 Cubism4(setParameterValueById) 与 Cubism2(setParamFloat)。
    const EXPR_POSES = {
      happy: [
        { id: 'ParamEyeLSmile', to: 1, neutral: 0 },
        { id: 'ParamEyeRSmile', to: 1, neutral: 0 },
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.35, neutral: 0 }
      ],
      dance: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.3, neutral: 0 },
        { id: 'ParamEyeLSmile', to: 0.8, neutral: 0 },
        { id: 'ParamEyeRSmile', to: 0.8, neutral: 0 }
      ],
      greet: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.2, neutral: 0 },
        { id: 'ParamAngleY', to: -4, neutral: 0 },
        { id: 'ParamBodyAngleX', to: 3, neutral: 0 }
      ],
      wave: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.2, neutral: 0 },
        { id: 'ParamAngleY', to: -4, neutral: 0 }
      ],
      think: [
        { id: 'ParamAngleZ', to: 5, neutral: 0 },
        { id: 'ParamAngleY', to: 3, neutral: 0 },
        { id: 'ParamEyeLOpen', to: 0.85, neutral: 1 },
        { id: 'ParamEyeROpen', to: 0.85, neutral: 1 }
      ],
      sad: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.05, neutral: 0 },
        { id: 'ParamEyeLOpen', to: 0.6, neutral: 1 },
        { id: 'ParamEyeROpen', to: 0.6, neutral: 1 },
        { id: 'ParamAngleZ', to: -3, neutral: 0 },
        { id: ['ParamMouthForm', 'ParamMouthFormY'], to: 0.4, neutral: 0 }
      ],
      surprise: [
        { id: 'ParamEyeLOpen', to: 1, neutral: 1 },
        { id: 'ParamEyeROpen', to: 1, neutral: 1 },
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.6, neutral: 0 },
        { id: ['ParamBrowLY', 'ParamBrowLForm'], to: 0.6, neutral: 0 },
        { id: ['ParamBrowRY', 'ParamBrowRForm'], to: 0.6, neutral: 0 }
      ],
      idle: [],
      tap: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.12, neutral: 0 },
        { id: 'ParamEyeLOpen', to: 0.9, neutral: 1 },
        { id: 'ParamEyeROpen', to: 0.9, neutral: 1 }
      ],
      flick: [
        { id: 'ParamAngleX', to: 6, neutral: 0 },
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.15, neutral: 0 }
      ],
      click: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.15, neutral: 0 },
        { id: 'ParamEyeLSmile', to: 0.6, neutral: 0 },
        { id: 'ParamEyeRSmile', to: 0.6, neutral: 0 }
      ],
      double_click: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.2, neutral: 0 },
        { id: 'ParamEyeLSmile', to: 0.9, neutral: 0 },
        { id: 'ParamEyeRSmile', to: 0.9, neutral: 0 }
      ],
      drag_end: [
        { id: 'ParamBodyAngleX', to: 4, neutral: 0 },
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.25, neutral: 0 }
      ],
      wake: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.2, neutral: 0 },
        { id: 'ParamAngleY', to: -3, neutral: 0 }
      ],
      sleep: [
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0, neutral: 0 },
        { id: 'ParamAngleZ', to: 0, neutral: 0 }
      ],
      confuse: [
        { id: 'ParamAngleZ', to: 6, neutral: 0 },
        { id: 'ParamAngleY', to: 2, neutral: 0 },
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.12, neutral: 0 }
      ],
      shy: [
        { id: 'ParamAngleY', to: 5, neutral: 0 },
        { id: ['ParamCheek'], to: 1, neutral: 0 },
        { id: ['ParamMouthForm', 'ParamMouthFormY'], to: 0.2, neutral: 0 },
        { id: 'ParamEyeLOpen', to: 0.85, neutral: 1 },
        { id: 'ParamEyeROpen', to: 0.85, neutral: 1 }
      ],
      angry: [
        { id: ['ParamBrowLY', 'ParamBrowLForm'], to: -0.6, neutral: 0 },
        { id: ['ParamBrowRY', 'ParamBrowRForm'], to: -0.6, neutral: 0 },
        { id: ['ParamMouthForm', 'ParamMouthFormY'], to: -0.4, neutral: 0 },
        { id: 'ParamAngleZ', to: -5, neutral: 0 }
      ],
      lazy: [
        { id: 'ParamAngleX', to: 3, neutral: 0 },
        { id: 'ParamAngleY', to: -2, neutral: 0 },
        { id: ['ParamMouthOpenY', 'ParamMouthOpen'], to: 0.08, neutral: 0 },
        { id: 'ParamEyeLOpen', to: 0.7, neutral: 1 },
        { id: 'ParamEyeROpen', to: 0.7, neutral: 1 }
      ]
    };

    const ParamDriver = {
      active: false,
      core: null,        // {type, set(id,v,w), get(id), setPart(id,v)}
      ver: null,         // 'c4' | 'c2'
      hasMotion: false,  // 模型是否拥有动作组（决定是否需要接管待机动画）
      clock: 0,
      last: 0,
      blink: null,
      expr: null,
      sleeping: false,
      thinking: false,
      _hasSleepMotion: false,  // 模型是否拥有 sleep 动作组（决定是否由 ParamDriver 闭眼兜底）
      _sleepEye: 1,            // 睡眠闭眼缓动值：1=睁眼，0=闭眼

      // 标准 Live2D 参数候选（不同模型命名一致；缺失者静默跳过）
      P: {
        angleX: 'ParamAngleX', angleY: 'ParamAngleY', angleZ: 'ParamAngleZ',
        bodyAngleX: 'ParamBodyAngleX',
        breath: 'ParamBreath',
        eyeLOpen: 'ParamEyeLOpen', eyeROpen: 'ParamEyeROpen',
        eyeLSmile: 'ParamEyeLSmile', eyeRSmile: 'ParamEyeRSmile',
        mouthOpen: ['ParamMouthOpenY', 'ParamMouthOpen'],
        mouthForm: ['ParamMouthForm', 'ParamMouthFormY'],
        browLY: 'ParamBrowLY', browRY: 'ParamBrowRY',
        browLForm: 'ParamBrowLForm', browRForm: 'ParamBrowRForm',
        eyeBallX: 'ParamEyeBallX', eyeBallY: 'ParamEyeBallY'
      },

      _im: null,   // 当前模型的 internalModel（用于挂载 afterMotionUpdate 事件）

      setup() {
        this.stop();
        if (!useLive2D || !currentModel) return;
        const im = currentModel.internalModel;
        const cm = im && im.coreModel;
        if (!cm) return;

        let api = null;
        if (typeof cm.setParameterValueById === 'function') {
          api = {
            type: 'c4',
            set: (id, v, w) => { try { cm.setParameterValueById(id, v, w == null ? 1 : w); } catch (e) {} },
            get: (id) => { try { return cm.getParameterValueById(id); } catch (e) { return 0; } },
            setPart: (id, v) => { try { cm.setPartOpacityById(id, v); } catch (e) {} }
          };
        } else if (typeof cm.setParamFloat === 'function') {
          api = {
            type: 'c2',
            set: (id, v, w) => { try { cm.setParamFloat(id, v, w == null ? 1 : w); } catch (e) {} },
            get: (id) => { try { return cm.getParamFloat(id); } catch (e) { return 0; } },
            setPart: (id, v) => { try { cm.setPartsOpacity(id, v); } catch (e) {} }
          };
        }
        if (!api) return;

        this.core = api;
        this.ver = api.type;
        this.hasMotion = Object.keys(availableMotions).length > 0;
        this._hasSleepMotion = (typeof PetBrain !== 'undefined' && PetBrain.hasMotion) ? !!PetBrain.hasMotion('sleep') : false;
        this.clock = 0;
        this.last = performance.now();
        this.blink = { state: 'open', t: 0, next: this._blinkDelay() };
        this.expr = null;
        this.sleeping = (PetBrain.state === 'SLEEPING');
        this.thinking = false;
        this.active = true;
        this._im = im;

        // 关键：挂在模型自身 update 内部的 afterMotionUpdate 事件上（Cubism4/Cubism2 都会发射），
        // 该事件发生在 saveParameters/saveParam 之前，因此这里设置的参数会被记入"保存基线"，
        // 从而躲过末尾的 loadParameters/loadParam 复位——这是让参数驱动"真正生效"的关键。
        // （若挂在 ticker 上（update 之后），下一帧 motion 的 loadParameters 会把值清掉，等于没驱动。）
        if (this._im && typeof this._im.on === 'function') {
          this._im.on('afterMotionUpdate', this._onUpdate, this);
        }
        console.log('[Pet] ParamDriver 就绪 (' + this.ver + ')，模型有动作组=' + this.hasMotion);
      },

      // 重新评估动作状态（在 discoverMotions 之后调用，用于模型 definitions 延迟填充时刷新 hasMotion / _hasSleepMotion）
      refreshMotionState() {
        if (!this.core) return;
        this.hasMotion = Object.keys(availableMotions).length > 0;
        this._hasSleepMotion = (typeof PetBrain !== 'undefined' && PetBrain.hasMotion) ? !!PetBrain.hasMotion('sleep') : false;
        console.log('[Pet] ParamDriver 刷新动作状态，模型有动作组=' + this.hasMotion);
      },

      stop() {
        if (this._im && typeof this._im.off === 'function') {
          try { this._im.off('afterMotionUpdate', this._onUpdate, this); } catch (e) {}
        }
        this._im = null;
        this.active = false;
        this.core = null;
        this.expr = null;
      },

      _blinkDelay() { return 2200 + Math.random() * 4200; },

      setSleeping(v) {
        this.sleeping = v;
        if (v) {
          this.expr = null;
        } else {
          this._sleepEye = 1;
          // 退出睡眠时显式把眼睛参数设为睁眼：模型有动作组时 _blink 不运行，
          // 若不显式设置，眼睛会停留在睡眠时的闭眼状态
          if (this.core && this.P) {
            try {
              this.core.set(this.P.eyeLOpen, 1, 1);
              this.core.set(this.P.eyeROpen, 1, 1);
            } catch (e) {}
          }
        }
      },
      setThinking(v) { this.thinking = v; },

      // 让 AI 意图通过模型参数表达（没有对应动作组时调用）。返回是否成功触发
      express(intent, duration) {
        if (currentPetType === 'MMD' && mmdPet) { mmdPet.setExpression(intent); return true; }
        if (!this.active || !this.core) return false;
        const poses = EXPR_POSES[intent] || EXPR_POSES[this._alias(intent)];
        if (!poses) return false;
        this.expr = { intent, start: performance.now(), dur: duration || 1200, poses };
        return true;
      },

      _alias(intent) {
        if (['flick', 'tap', 'click', 'double_click', 'idle_action'].includes(intent)) return 'tap';
        if (['wake', 'wake_up'].includes(intent)) return 'greet';
        if (['drag_end'].includes(intent)) return 'happy';
        if (['dance', '踊'].includes(intent)) return 'dance';
        return 'idle';
      },

      _onUpdate() {
        if (!this.active || !this.core || !currentModel) return;
        const now = performance.now();
        let dt = (now - this.last) / 1000;
        if (!isFinite(dt) || dt < 0) dt = 0;
        if (dt > 0.1) dt = 0.1; // 限制单帧步长，防止卡顿后跳变
        this.last = now;
        this.clock += dt;

        if (this.sleeping) {
          // 睡眠姿势统一由 pinSleep（ticker，模型 update 之后执行）逐帧钉死，
          // 这里仅提前 return，避免 breathing/blink/sway 在睡眠态被触发。
          return;
        }

        // 呼吸：仅 Cubism4 由我们接管（Cubism2 的 natural movement 自带呼吸/摇摆）
        if (this.ver === 'c4') this._breath(false);

        // 眨眼：仅在模型没有动作组时由我们驱动（有动作组时通常自带眨眼）
        if (!this.hasMotion) this._blink(dt);

        // 待机摇摆：仅 Cubism4 且无动作组时，让静态模型“活”起来
        if (this.ver === 'c4' && !this.hasMotion) this._sway(this.clock);

        // AI 意图表达（叠加在环境动画之上）
        if (this.expr) this._applyExpr(now);
      },

      _breath(sleeping) {
        const b = 0.5 + 0.5 * Math.sin(this.clock / 3.0);
        const v = sleeping ? (0.3 + 0.12 * (0.5 + 0.5 * Math.sin(this.clock / 4.5)))
                           : (0.3 + 0.25 * b);
        this.core.set(this.P.breath, v, 1);
      },

      // 睡眠时闭眼兜底：模型无自带 sleep 动作组时，用参数把眼睛缓缓闭上，
      // 让"睡觉"在视觉上明确可辨（否则龙虾睁着眼只变暗，用户感知不到入睡）。
      // 模型自带 sleep 动作组时交给模型动画处理，这里不干涉。
      _sleepEyes(dt) {
        if (this._hasSleepMotion) return;
        if (this._sleepEye == null) this._sleepEye = 1;
        this._sleepEye += (0 - this._sleepEye) * Math.min(1, dt * 3.5);
        if (this._sleepEye < 0.01) this._sleepEye = 0;
        this.core.set(this.P.eyeLOpen, this._sleepEye, 1);
        this.core.set(this.P.eyeROpen, this._sleepEye, 1);
      },

      // 睡眠姿势钉：挂在模型自身 update（含物理/自带动画）之后的 ticker 上逐帧执行，
      // 强制把模型钉在"睡眠态"，盖过模型自带的物理摆动/眨眼残影/循环 idle 尾段，
      // 让"尸体"真正静止。眼睛用缓动值 _sleepEye 平滑闭合（这里负责逐帧推进缓动，
      // 不依赖 afterMotionUpdate 是否触发），身体仅在模型无自带 sleep 动作组时归中
      // （有 sleep 组则交给模型动画表现躺姿）。
      pinSleep() {
        if (!this.sleeping || !this.core || !currentModel) return;
        // 自算帧间隔（PIXI ticker 回调不传 dt）
        const now = performance.now();
        let dt = (now - (this._pinLast || now)) / 1000;
        if (!isFinite(dt) || dt < 0) dt = 0;
        if (dt > 0.1) dt = 0.1;
        this._pinLast = now;
        // 眼睛缓动闭合（睫毛随之归位），盖过模型自带眨眼
        if (this._sleepEye == null) this._sleepEye = 1;
        this._sleepEye += (0 - this._sleepEye) * Math.min(1, dt * 3.5);
        if (this._sleepEye < 0.01) this._sleepEye = 0;
        const e = this._sleepEye;
        this.core.set(this.P.eyeLOpen, e, 1);
        this.core.set(this.P.eyeROpen, e, 1);
        // 呼吸：固定静息值，不再起伏
        this.core.set(this.P.breath, 0.3, 1);
        // 身体：仅当模型没有自带 sleep 动作组时归中，盖过物理摆动；有则交给模型动画
        if (!(typeof PetBrain !== 'undefined' && PetBrain.hasMotion && PetBrain.hasMotion('sleep'))) {
          this.core.set(this.P.angleX, 0, 1);
          this.core.set(this.P.angleY, 0, 1);
          this.core.set(this.P.angleZ, 0, 1);
          this.core.set(this.P.bodyAngleX, 0, 1);
        }
      },

      _blink(dt) {
        const b = this.blink;
        b.t += dt * 1000;
        let open = 1;
        if (b.state === 'open') {
          if (b.t >= b.next) { b.state = 'closing'; b.t = 0; }
        } else if (b.state === 'closing') {
          open = Math.max(0, 1 - b.t / 110);
          if (b.t >= 110) { b.state = 'closed'; b.t = 0; }
        } else if (b.state === 'closed') {
          open = 0;
          if (b.t >= 70) { b.state = 'opening'; b.t = 0; }
        } else if (b.state === 'opening') {
          open = Math.min(1, b.t / 140);
          if (b.t >= 140) { b.state = 'open'; b.t = 0; b.next = this._blinkDelay(); }
        }
        this.core.set(this.P.eyeLOpen, open, 1);
        this.core.set(this.P.eyeROpen, open, 1);
      },

      _sway(t) {
        this.core.set(this.P.angleX, 3 * Math.sin(t / 3.1), 1);
        this.core.set(this.P.angleY, 2 * Math.sin(t / 4.3 + 1), 1);
        this.core.set(this.P.angleZ, 1 * Math.sin(t / 5.7 + 2), 1);
        this.core.set(this.P.bodyAngleX, 2 * Math.sin(t / 7.3), 1);
        // 偶尔轻微环顾
        this.core.set(this.P.eyeBallX, 0.25 * Math.sin(t / 6.0), 1);
        this.core.set(this.P.eyeBallY, 0.2 * Math.sin(t / 8.0 + 1), 1);
      },

      _applyExpr(now) {
        const e = this.expr;
        const t = (now - e.start) / e.dur;
        if (t >= 1) { this.expr = null; return; }
        // 包络：前 18% 渐入，中间保持，后 35% 渐出回中性
        const env = t < 0.18 ? (t / 0.18) : (t > 0.65 ? Math.max(0, (1 - t) / 0.35) : 1);
        for (const item of e.poses) {
          const toArr = Array.isArray(item.id) ? item.id : [item.id];
          const neutral = (item.neutral == null) ? 0 : item.neutral;
          for (const id of toArr) {
            const v = neutral + (item.to - neutral) * env;
            this.core.set(id, v, 1);
          }
        }
      }
    };

    // 动态发现当前模型真实拥有的动作组（来自模型自身，不写死任何动作名）。
    // 读取 pixi-live2d 的 motionManager.definitions：{ 组名: [动作定义,...] }。
    function discoverMotions() {
      availableMotions = {};
      try {
        const mm = currentModel?.internalModel?.motionManager;
        if (!mm) return;
        const defs = mm.definitions;
        // 标准结构：{ 组名: [动作定义,...] }
        if (defs && typeof defs === 'object' && !Array.isArray(defs)) {
          for (const group of Object.keys(defs)) {
            const arr = defs[group];
            availableMotions[group] = Array.isArray(arr) ? arr.length : (typeof arr === 'number' ? arr : 0);
          }
        }
        // 兜底：个别模型/版本 definitions 为空或结构不同，尝试从 settings.motions 读取组名
        if (Object.keys(availableMotions).length === 0) {
          const motions = (mm.settings && mm.settings.motions) || (currentModel?.internalModel?.settings && currentModel.internalModel.settings.motions);
          if (motions && typeof motions === 'object') {
            for (const group of Object.keys(motions)) {
              const arr = motions[group];
              availableMotions[group] = Array.isArray(arr) ? arr.length : (typeof arr === 'number' ? arr : 0);
            }
          }
        }

        // ★ 运行时兜底：model3.json 缺少 Motions 引用（常见于从 VTuber 软件导出的 Cubism4 模型）
        // 内部发现为空且当前模型有 installPath → 通过 IPC 让主进程扫描目录中的 .motion3.json / .can3 文件
        if (Object.keys(availableMotions).length === 0 && currentModelInfo?.installPath) {
          discoverMotionsFallback();
        }

        console.log('[Pet] 发现动作组:', availableMotions);
      } catch (e) {
        console.warn('[Pet] 动作组发现失败:', e.message);
      }
    }

    // 运行时兜底：IPC 扫描模型目录注入 motions（异步，不阻塞首次 discoverMotions；120ms 延迟会再调一次）
    async function discoverMotionsFallback() {
      try {
        if (!window.api || !window.api.scanLive2DDir) return;
        const scan = await window.api.scanLive2DDir(currentModelInfo.installPath);
        if (!scan || !scan.motions || scan.motions.length === 0) return;
        // 注入到 internalModel.settings（让 pixi-live2d-display 的后续调用能读到）
        const im = currentModel?.internalModel;
        if (!im || !im.settings) return;
        // ★ Cubism2 与 Cubism4 的 settings 键形不同，必须分叉注入：
        // Cubism2：settings.motions[组] = [{ file, fade_in, fade_out }]（全小写，getMotionFile 读 def.file）
        // Cubism4：settings.FileReferences.Motions[组] = [{ File, FadeInTime, FadeOutTime }]（大写）
        const isCubism2 = (im.constructor && im.constructor.name === 'Cubism2InternalModel') ||
          typeof im.settings.moc === 'string';
        if (isCubism2) {
          if (!im.settings.motions) im.settings.motions = {};
          for (const m of scan.motions) {
            if (!im.settings.motions[m.name]) {
              im.settings.motions[m.name] = [{ file: m.file, fade_in: 0.5, fade_out: 0.3 }];
              availableMotions[m.name] = 1; // 每个文件算 1 个动作
            }
          }
        } else {
          if (!im.settings.FileReferences) im.settings.FileReferences = {};
          if (!im.settings.FileReferences.Motions) im.settings.FileReferences.Motions = {};
          for (const m of scan.motions) {
            if (!im.settings.FileReferences.Motions[m.name]) {
              im.settings.FileReferences.Motions[m.name] = [{ File: m.file, FadeInTime: 0.5, FadeOutTime: 0.3 }];
              availableMotions[m.name] = 1;
            }
          }
        }
        // 同步更新 motionManager.definitions（如果它已经初始化完毕的话）
        // Cubism2 的 definitions 就是 settings.motions 同一引用，Object.assign 无副作用。
        const mm = im.motionManager;
        if (mm && typeof mm.definitions === 'object' && !Array.isArray(mm.definitions)) {
          Object.assign(mm.definitions, isCubism2 ? im.settings.motions : im.settings.FileReferences.Motions);
        }
        console.log('[Pet] 兜底扫描发现动作:', Object.keys(availableMotions));
      } catch (e) { /* 静默 */ }
    }

    // Cubism2：def.name；Cubism4：def.Name。与 discoverMotions 一样不写死任何名字。
    // 这是「Live2D 独有特性」的核心：初音未来等模型的圈圈/哭哭/脸红等表情由此暴露出来。
    function discoverExpressions() {
      availableExpressions = [];
      try {
        const em = currentModel?.internalModel?.motionManager?.expressionManager;
        if (!em || !Array.isArray(em.definitions)) return;
        for (const def of em.definitions) {
          const name = def.Name || def.name;
          if (name && !availableExpressions.includes(name)) availableExpressions.push(name);
        }
        console.log('[Pet] 发现表情:', availableExpressions);

        // ★ 运行时兜底：model3.json 缺少 Expressions 引用 → IPC 扫描目录
        if (availableExpressions.length === 0 && currentModelInfo?.installPath) {

      } catch (e) {
        console.warn('[Pet] 表情发现失败:', e.message);
