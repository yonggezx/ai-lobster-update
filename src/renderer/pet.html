    // ==================== 逐像素点击穿透 ====================

    // 检查指定 CSS 坐标处的画素是否透明
    // ★ 增强：增加 WebGL 错误检测和节流。preserveDrawingBuffer:true 时 readPixels 能正确工作，
    // 但仍需检测 gl.getError()，避免在上下文异常时反复调用 readPixels 加剧问题。
    let _lastPixelCheckAt = 0;
    let _lastPixelCheckResult = true;
    let _lastPixelCheckX = 0; // ★ 上次检测的 X 坐标，用于判断是否需要重新检测
    let _lastPixelCheckY = 0; // ★ 上次检测的 Y 坐标
    function isPixelTransparent(cssX, cssY) {
      if (!pixiApp || !pixiApp.renderer || !pixiApp.renderer.gl) return true;
      // 节流：同一帧内且坐标变化不大时复用上次结果（mousemove 可能高频触发）
      // ★ 坐标变化超过 2px 时强制重新检测，避免鼠标快速移动时使用错误的缓存结果
      const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      const dx = Math.abs(cssX - _lastPixelCheckX);
      const dy = Math.abs(cssY - _lastPixelCheckY);
      if (now - _lastPixelCheckAt < 16 && dx < 2 && dy < 2) return _lastPixelCheckResult;
      _lastPixelCheckAt = now;
      _lastPixelCheckX = cssX;
      _lastPixelCheckY = cssY;
      try {
        const gl = pixiApp.renderer.gl;
        // 先检查上下文是否已丢失
        if (typeof gl.isContextLost === 'function' && gl.isContextLost()) {
          _lastPixelCheckResult = true;
          return true;
        }
        // ★ 修复坐标转换：使用 canvas 实际 CSS 尺寸计算比例，而非直接乘以 resolution
        // 之前假设 canvas CSS 尺寸 = PIXI 逻辑尺寸，但实际可能不同（如 canvas 宽高被 CSS 覆盖），
        // 导致物理像素坐标计算错误，readPixels 读取到错误位置，整个方形区域都被认为不透明。
        const canvasRect = canvas.getBoundingClientRect();
        const pxW = pixiApp.renderer.width;
        const pxH = pixiApp.renderer.height;
        const scaleX = canvasRect.width > 0 ? pxW / canvasRect.width : 1;
        const scaleY = canvasRect.height > 0 ? pxH / canvasRect.height : 1;
        const pxX = Math.round(cssX * scaleX);
        const pxY = Math.round(cssY * scaleY);
        // 越界视为透明
        if (pxX < 0 || pxX >= pxW || pxY < 0 || pxY >= pxH) {
          _lastPixelCheckResult = true;
          return true;
        }
        // 确保读取的是画布默认帧缓冲区
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        const pixels = new Uint8Array(4);
        // WebGL 原点在左下角，需要翻转 Y 轴
        gl.readPixels(pxX, pxH - pxY, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        // 检查 readPixels 是否触发了 WebGL 错误
        const err = gl.getError();
        if (err !== gl.NO_ERROR && err !== gl.CONTEXT_LOST_WEBGL) {
          // 非上下文丢失的错误（如 INVALID_FRAMEBUFFER_OPERATION），记录警告
          console.warn('[PixelCheck] gl.readPixels 错误码:', err, '，可能导致动态点击穿透失效');
        }
        if (err === gl.CONTEXT_LOST_WEBGL) {
          window.__webglContextLost = true;
          _lastPixelCheckResult = true;
          return true;
        }
        const result = pixels[3] < 10; // alpha 阈值：低于 10 视为透明
        _lastPixelCheckResult = result;
        return result;
      } catch (e) {
        _lastPixelCheckResult = true;
        return true;
      }
    }

    // 判断指定客户端坐标是否应该捕获鼠标事件
    function shouldCaptureAtPoint(clientX, clientY) {
      if (!dynamicClickThrough) return false;

      // 拖动中始终捕获
      if (isDragging) return true;

      // 右键菜单可见时，在菜单区域内捕获（务必先于 MMD hitTest 判断，
      // 否则 MMD 模式下菜单区域永远命中不到模型本体、菜单无法被捕获 → 点击/滚轮/滚动条全部失效）
      if (actionMenu.classList.contains('show')) {
        const r = actionMenu.getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
          return true;
        }
      }

      // 输入框可见时（opacity > 0），在输入框区域内捕获
      const inputOpacity = parseFloat(window.getComputedStyle(inputArea).opacity);
      if (inputOpacity > 0.01) {
        const r = inputArea.getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
          return true;
        }
      }

      // MMD 3D 模式：用射线检测判断是否戳到模型本体，只有命中龙虾身体才捕获鼠标
      // （可拖动/点击），透明留白区域让点击穿透到后方窗口。
      // 之前写死"整窗捕获"，导致点击穿透对 MMD 完全不生效。
      if (currentPetType === 'MMD' && mmdPet && mmdPet.ready) {
        if (typeof mmdPet.hitTest === 'function') return mmdPet.hitTest(clientX, clientY);
        return true; // 命中检测不可用时的兜底：整窗捕获（保证仍可拖动）
      }

      // Live2D 模型：直接逐像素检查透明度（移除 getBounds 快速检查，避免边界计算错误导致点击穿透不生效）
      // ★ getBounds() 在某些模型上返回的边界不正确（如 bongocat 模型），导致模型区域被误认为透明，
      //   鼠标在模型上也穿透，点击穿透"不生效"（应该捕获但没捕获）。直接像素检测更准确。
      if (useLive2D && currentModel && pixiApp) {
        const canvasRect = canvas.getBoundingClientRect();
        const cssX = clientX - canvasRect.left;
        const cssY = clientY - canvasRect.top;
        if (!isPixelTransparent(cssX, cssY)) {
          return true;
        }
      }

      // CSS 降级方案：检查 emoji 区域
      if (cssLobster.style.display !== 'none') {
        const r = cssLobster.getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
          return true;
        }
      }

      return false;
    }

    // 设置动态点击穿透
    function setupDynamicClickThrough() {
      // mousemove 事件在 setIgnoreMouseEvents(true, {forward:true}) 时仍会被转发
      document.addEventListener('mousemove', (e) => {
        if (!dynamicClickThrough) return;
        // 菜单/输入等UI覆盖层强制捕获期间，不切回穿透（否则菜单交互会被打断）
        // 对话框(AppDialog)活跃时也不切回穿透，否则确认框按钮点击穿透到桌面
        if (uiForceCapture || window.__petDialogActive) return;

        const shouldCapture = shouldCaptureAtPoint(e.clientX, e.clientY);

        if (shouldCapture && !isCapturingMouse) {
          // 切换到捕获模式
          window.api.setPetIgnoreMouseEvents(false, false);
          isCapturingMouse = true;
          // ★ 鼠标进入模型区域时聚焦窗口，使小键盘动作触发生效（不需要点击）
          // 但输入框有焦点时不聚焦，避免输入框失焦无法打字、键盘事件被宠物捕获触发动作
          if (currentPetType !== 'MMD' && window.isBongocatMode !== true) {
            const ae = document.activeElement;
            const isInputFocused = ae && (ae.id === 'pet-input' || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
            if (!isInputFocused && window.api && typeof window.api.focusPetWindow === 'function') {
              window.api.focusPetWindow();
            }
          }
        } else if (!shouldCapture && isCapturingMouse) {
          // 切换到穿透模式（保留 forward 以继续接收 mousemove）
          window.api.setPetIgnoreMouseEvents(true, true);
          isCapturingMouse = false;
        }
      });

      // ★ 鼠标点击模型区域时聚焦窗口，使窗口获得键盘焦点
      // 这样普通2D模型的小键盘动作切换才能生效（窗口内键盘事件需要窗口有焦点）
      // bongocat 模型不使用小键盘动作，不需要聚焦
      document.addEventListener('mousedown', (e) => {
        if (!dynamicClickThrough) return;
        if (window.isBongocatMode === true) return; // bongocat 不需要小键盘动作
        if (currentPetType === 'MMD') return; // MMD 不支持小键盘动作
        if (uiForceCapture || window.__petDialogActive) return;
        // 只在点击模型区域时聚焦（透明区域点击穿透到后方窗口，不聚焦）
        if (shouldCaptureAtPoint(e.clientX, e.clientY)) {
          const ae = document.activeElement;
          const isInputFocused = ae && (ae.id === 'pet-input' || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
          if (!isInputFocused && window.api && typeof window.api.focusPetWindow === 'function') {
            window.api.focusPetWindow();
          }
        }
      });

      // 鼠标离开窗口时恢复穿透
      document.addEventListener('mouseleave', () => {
        if (dynamicClickThrough && isCapturingMouse && !isDragging && !uiForceCapture && !window.__petDialogActive) {
          window.api.setPetIgnoreMouseEvents(true, true);
          isCapturingMouse = false;
        }
      });

      // 窗口失焦时恢复穿透（拖动也会在同一 blur 事件中被结束）
      window.addEventListener('blur', () => {
        if (dynamicClickThrough && isCapturingMouse && !uiForceCapture && !window.__petDialogActive) {
          window.api.setPetIgnoreMouseEvents(true, true);
          isCapturingMouse = false;
        }
      });
    }

    // 龙虾小动作动画
    // 灵汐开心动画
    function lobsterBounce() {
      if (useLive2D && currentModel) {
        if (!PetBrain.playMotion('happy')) ParamDriver.express('happy', 1000);
      } else if (cssLobster && !cssLobster.classList.contains('state-sleep')) {
        cssLobster.classList.remove('state-idle');
        cssLobster.classList.add('state-happy');
        setTimeout(() => {
          cssLobster.classList.remove('state-happy');
          cssLobster.classList.add('state-idle');
        }, 800);
      }
    }

    function setupEvents() {
      // 绑定到 container 而非 canvas/cssLobster，确保无论模型加载成功与否都能交互
      // （模型加载失败时 canvas 被隐藏，cssLobster 显示，原先绑定到 canvas 的事件无法触发）

      // ★ 监听独立窗口右键菜单的菜单项选择
      if (window.api && typeof window.api.onContextMenuAction === 'function') {
        window.api.onContextMenuAction((action) => {
          if (action) {
            handleMenuAction(action);
          }
        });
      }

      // 启用动态逐像素点击穿透
      setupDynamicClickThrough();

      container.addEventListener('mousedown', async (e) => {
        // 忽略输入框和菜单区域上的鼠标事件
        if (inputArea.contains(e.target) || actionMenu.contains(e.target)) return;
        if (e.button === 0) {
          isDragging = true;
          PetBrain.onDragStart();
          dragStartX = e.screenX;
          dragStartY = e.screenY;
          // 先用同步方式算窗口位置，避免 await 期间 mousemove 用到旧值导致跳到左上角
          dragWinX = e.screenX - e.clientX;
          dragWinY = e.screenY - e.clientY;
          // ★ 拖动模型时关闭独立输入框：模型与输入框是独立层级，拖动过程中不应残留
          try { hideInputBarWindow(); } catch (e2) {}
          try {
            const pos = await window.api.getPetPosition();
            if (pos) {
              dragWinX = pos.x;
              dragWinY = pos.y;
            }
          } catch (err) {}
          container.classList.add('dragging');
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) {
          // 悬停检测：鼠标在模型上时更新状态（含睡眠态唤醒）
          if (useLive2D && currentModel) {
            try {
              const bounds = currentModel.getBounds();
              const rect = canvas.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              if (bounds.contains(x, y)) {
                // 睡眠中鼠标移到模型上 → 唤醒（让"移动鼠标到龙虾上"也能叫醒它）
                if (PetBrain.state === 'SLEEPING') {
                  PetBrain.setState('AWAKE');
                  PetBrain.onInteraction('click');
                } else if (PetBrain.state !== 'HOVER' && PetBrain.state !== 'DRAGGING' && PetBrain.state !== 'THINKING') {
                  PetBrain.setState('HOVER');
                }
              } else {
                if (PetBrain.state === 'HOVER') {
                  PetBrain.setState('AWAKE');
                }
              }
            } catch (err) { /* ignore */ }
          }
          return;
        }
        // 新窗口位置 = 鼠标屏幕坐标 - 鼠标相对窗口的偏移
        // 偏移 = 鼠标屏幕坐标 - 窗口坐标（在 mousedown 时计算）
        const offsetFromWinX = dragStartX - dragWinX;
        const offsetFromWinY = dragStartY - dragWinY;
        dragPendingX = e.screenX - offsetFromWinX;
        dragPendingY = e.screenY - offsetFromWinY;
        if (!dragRafId) {
          dragRafId = requestAnimationFrame(() => {
            dragRafId = 0;
            window.api.petDrag(dragPendingX, dragPendingY);
          });
        }
      });

      function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        container.classList.remove('dragging');
        if (dragRafId) {
          cancelAnimationFrame(dragRafId);
          dragRafId = 0;
        }
        const moved = Math.abs(e.screenX - dragStartX) + Math.abs(e.screenY - dragStartY);
        if (moved < 5) {
          handleClick(e);
        } else {
          PetBrain.onDragEnd();
        }
        // 拖动结束后立即检查是否需要恢复穿透模式
        if (dynamicClickThrough && !uiForceCapture && !window.__petDialogActive && !shouldCaptureAtPoint(e.clientX, e.clientY)) {
          window.api.setPetIgnoreMouseEvents(true, true);
          isCapturingMouse = false;
        }
        // 保存窗口位置到配置文件，下次启动时恢复
        if (moved >= 5 && window.api.savePetPosition) {
          window.api.savePetPosition().catch(() => {});
        }
      }

      window.addEventListener('mouseup', endDrag);
      document.addEventListener('mouseup', endDrag);
      window.addEventListener('blur', () => {
        if (isDragging) {
          isDragging = false;
          container.classList.remove('dragging');
        }
      });

      container.addEventListener('contextmenu', (e) => {
        // 忽略输入框和菜单区域上的右键
        if (inputArea.contains(e.target) || actionMenu.contains(e.target)) return;
        e.preventDefault();
        showActionMenu(e.clientX, e.clientY);
      });

      document.addEventListener('click', (e) => {
        const l2dPanel = document.getElementById('l2d-panel');
        const clickInMenu = actionMenu.contains(e.target);
        const clickInInput = inputArea.contains(e.target);
        const clickInL2DPanel = l2dPanel && l2dPanel.contains(e.target);
        // 点击空白处（不在菜单、输入框、动作模组面板内）→ 关闭所有弹窗
        if (!clickInMenu && !clickInInput && !clickInL2DPanel) {
          hideActionMenu();
          if (l2dPanel && l2dPanel.classList.contains('show')) toggleL2DPanel(false);
        }
      });
    }

            function handleClick(e) {
      if (useLive2D && currentModel) {
        // 仅当点击位置在模型实际范围内时才触发交互
        try {
          const bounds = currentModel.getBounds();
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          if (bounds.contains(x, y)) {
            PetBrain.handleClick();
          }
        } catch (err) {
          // 降级：如果 getBounds 失败，不触发交互
        }
      } else if (cssLobster.contains(e.target)) {
        // CSS 降级方案：仅点击龙虾 emoji 时触发
        PetBrain.handleClick();
      } else if (currentPetType === 'MMD' && mmdPet && mmdPet.ready) {
        // MMD 模式：整窗捕获，点击角色窗口即触发交互（无需逐像素命中测试）
        PetBrain.handleClick();
      }
    }

    function showActionMenu(x, y) {
      // Bongocat模式下不显示右键菜单
      if (window.isBongocatMode) return;
      // 设置中禁用了右键菜单
      if (!showContextMenuEnabled) return;
      // 打开右键菜单时收起 Live2D 动作模组面板，避免两者重叠
      toggleL2DPanel(false);
      // 每次打开前刷新菜单项可见性（用户可能刚在动作编辑器删除了内置动作）
      try { refreshActionMenu(); } catch (e) { /* 菜单尚未初始化时忽略 */ }

      // ★ 使用独立窗口右键菜单：不遮挡模型，样式与退出弹窗一致（深色卡片 + 主题色 + 圆角）
      // 从 DOM 收集当前可见的菜单项数据
      const items = [];
      actionMenu.childNodes.forEach(node => {
        if (node.nodeType !== 1) return;
        if (node.classList.contains('menu-item') && node.style.display !== 'none') {
          const label = node.textContent.trim();
          const action = node.dataset.action || '';
          // 根据 action 推断图标
          let icon = 'default';
          if (action === 'chat') icon = 'chat';
          else if (action === 'change-model' || action === 'open-main') icon = 'model';
          else if (action === 'hide') icon = 'hide';
          else if (action === 'quit') icon = 'quit';
          else if (action === 'open-l2d') icon = 'list';
          else if (action.startsWith('act:')) icon = 'action';
          items.push({ type: 'item', action, label, icon });
        } else if (node.classList.contains('menu-divider')) {
          items.push({ type: 'divider' });
        } else if (node.classList.contains('menu-section')) {
          items.push({ type: 'section', label: node.textContent.trim() });
        }
      });

      if (items.length === 0) return;

      // 调用主进程显示独立窗口菜单
      if (window.api && typeof window.api.showContextMenu === 'function') {
        window.api.showContextMenu(x, y, items).catch(err => {
          console.warn('[showActionMenu] 独立菜单显示失败:', err.message);
        });
      }
    }

    function hideActionMenu() {
      // 独立窗口菜单由主进程管理（失焦自动关闭），这里不需要额外处理
      contextMenuVisible = false;
    }

    // ★ 菜单项点击已改由独立窗口菜单处理（onContextMenuAction），此处不再需要 DOM 点击监听器

    // ===== 角色状态机控制面板（F9 切换显示；MMD 模型可用）=====
    (function setupSMControls() {
      const smPanel = document.getElementById('sm-panel');
      if (!smPanel) return;
      let smVisible = false;
      let smForceCapture = false;
      function showSMPanel() {
        smPanel.classList.remove('sm-hidden');
        smVisible = true;
        // 打开时强制捕获鼠标（同右键菜单）：暂停动态穿透，避免点击/滚轮失效
        if (typeof dynamicClickThrough !== 'undefined' && dynamicClickThrough && window.api && window.api.setPetIgnoreMouseEvents) {
          window.api.setPetIgnoreMouseEvents(false, false);
          isCapturingMouse = true;
          smForceCapture = true;
        }
      }
      function hideSMPanel() {
        smPanel.classList.add('sm-hidden');
        smVisible = false;
        if (smForceCapture && window.api && window.api.setPetIgnoreMouseEvents) {
          smForceCapture = false;
          window.api.setPetIgnoreMouseEvents(true, true);
          isCapturingMouse = false;
        }
      }
      smPanel.querySelectorAll('.sm-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const cmd = btn.dataset.sm;
          if (!mmdPet || typeof mmdPet.getState !== 'function') return;
          if (currentPetType !== 'MMD') { if (typeof showBubble === 'function') showBubble('状态机仅 MMD 模型支持', 1600); return; }
          try {
            if (cmd === 'sideling') mmdPet.enterState('sideling');
            else if (cmd === 'floating') mmdPet.enterState('floating');
            else if (cmd === 'sleep') mmdPet.enterState('sleep');
            else if (cmd === 'wake') mmdPet.wake();
            else if (cmd === 'stop') mmdPet.stopStateMachine();
          } catch (e) { console.warn('[SM] 触发失败:', e); }
        });
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'F9') { e.preventDefault(); smVisible ? hideSMPanel() : showSMPanel(); }
      });
    })();

    // 小键盘触发 Live2D 专属动作/表情：Numpad1..Numpad9 → 第 1..9 个，Numpad0 → 第 10 个。
    // 用 e.code（始终为 Numpad*，不受 NumLock 开关影响）；在输入框打字时不拦截，保留正常数字输入。
    // 这是用户要求的「小键盘」入口：初音未来的拿葱/唱歌/比心/大小变/前倾（动作）+ 圈圈/哭哭/脸红（表情）皆经此触发。
    // ★ 点击穿透模式下，鼠标点击模型区域时窗口会获得焦点（见 setupDynamicClickThrough 的 mousedown），
    //   因此窗口内键盘事件正常触发，不需要全局键盘（避免打字时误触发动作）。
    document.addEventListener('keydown', function(e) {
      if (!e.code || !e.code.startsWith('Numpad')) return;
      const ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
      if (currentPetType === 'MMD') return; // 小键盘动作模组仅 Live2D 支持
      if (!useLive2D || !currentModel) return;
      const map = { Numpad1:0, Numpad2:1, Numpad3:2, Numpad4:3, Numpad5:4, Numpad6:5, Numpad7:6, Numpad8:7, Numpad9:8, Numpad0:9 };
      const idx = map[e.code];
      if (idx === undefined) return;
      e.preventDefault();
      triggerL2DAction(idx);
    });

    // ===== Bongocat 按键打字：使用模型自带的键盘/打字动作组，播放motion =====
    // 支持两种触发方式：①窗口内键盘事件 ②主进程全局键盘钩子（窗口失去焦点也能响应）
    (function setupBongocatTyping() {
      const MODIFIER_KEYS = new Set(['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'NumLock', 'ScrollLock']);
      const FUNCTION_KEYS = /^F\d{1,2}$/;
      let lastTapAt = 0;
      let motionIndex = 0;

      // 核心打字处理函数（窗口内键盘和全局键盘都调用这个）
      function handleTypingKey(key, code) {
        // ★ 只有 Bongocat 模型才响应打字动作，普通2D模型只响应小键盘
        if (!bongoInteractionActive) return;
        if (currentPetType !== 'Live2D' || !useLive2D || !currentModel) return;
        // 输入框中打字不触发
        const ae = document.activeElement;
        if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
        if (MODIFIER_KEYS.has(key)) return;
        if (FUNCTION_KEYS.test(key)) return;
        if (key && key.startsWith && key.startsWith('Arrow')) return;
        if (['PageUp','PageDown','Home','End','Insert','Delete'].includes(key)) return;
        if (key === 'PrintScreen' || key === 'Pause') return;

        // 节流
        const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
        if (now - lastTapAt < 60) return;
        lastTapAt = now;

        // ★ Bongocat模式：使用专用参数控制打字动作（模型没有Motions动作组）
        if (bongoInteractionActive) {
          const ok = bongocatTypeDirect(code);
          console.log('[Typing] Bongocat参数打字:', ok ? '成功' : '失败', 'key=', key, 'code=', code);
          return;
        }

        // 普通 Live2D 模型：播放模型自带的键盘/打字动作组
        if (!keyboardMotionGroups || keyboardMotionGroups.length === 0) {
          try { detectKeyboardMotions(); } catch (err) {}
        }
        if (!keyboardMotionGroups || keyboardMotionGroups.length === 0) return;

        // 播放模型自带的键盘/打字动作组
        try {
          const group = keyboardMotionGroups[motionIndex % keyboardMotionGroups.length];
          motionIndex++;
          const count = availableMotions[group] || 0;
          const idx = count > 0 ? Math.floor(Math.random() * count) : 0;
          console.log('[Typing] 普通模型播放动作: group=', group, 'idx=', idx, 'key=', key);
          // ★ 关键修复：统一使用 playMotionGroup 而不是直接调用 currentModel.motion
          // playMotionGroup 包含播放前 state 预重置、definition 检查、启动失败诊断和重试，
          // 直接调用 currentModel.motion 会导致快速打字时多个动作竞态，state.reserve/start 失败。
          const played = playMotionGroup(group, idx);
          if (!played) {
            console.warn('[Typing] playMotionGroup 返回 false，动作未播放:', group);
          }
        } catch (err) {
          console.warn('[Typing] 播放异常:', err.message);
        }
      }

      // ① 窗口内键盘事件
      window.addEventListener('keydown', function(e) {
        try {
          handleTypingKey(e.key, e.code);
          // ★ BongoCat 模式下，窗口内键盘事件也更新按键叠加层
          if (bongoInteractionActive && !bongoDestroyed) {
            try { updateBongoKeyOverlay(e.code, true); } catch (err) {}
          }
        } catch (err) {}
      }, true);
      // ★ 窗口内键盘释放事件：隐藏按键图片
      window.addEventListener('keyup', function(e) {
        try {
          if (bongoInteractionActive && !bongoDestroyed) {
            try { updateBongoKeyOverlay(e.code, false); } catch (err) {}
          }
        } catch (err) {}
      }, true);

      // ② 全局键盘事件（主进程通过IPC发送，窗口失去焦点也能响应）
      // ★ try-catch 包裹：IPC 回调中的未捕获异常可能导致渲染进程崩溃
      if (window.api && window.api.on) {
        window.api.on('bongocat:global-keydown', (data) => {
          // ★ 防崩溃：已销毁则忽略
          if (bongoDestroyed) return;
          console.log('[Bongocat] 全局键盘事件:', JSON.stringify(data));
          // ★ 增强：BongoCat 模式下且输入框聚焦时，忽略全局键盘事件，避免打字时触发 BongoCat 动作
          try {
            const ae = document.activeElement;
            if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
          } catch (_) {}
          if (data && data.key) {
            try {
              // ★ 根据按键状态（down/up）分别处理
              const isUp = data.type === 'up';
              // ★ 键盘叠加层：按下时切换到对应键的高亮图片，释放时恢复默认
              console.log('[Bongocat] 调用 updateBongoKeyOverlay: code=', data.code, 'isDown=', !isUp);
              try { updateBongoKeyOverlay(data.code, !isUp); } catch (e) { console.error('[Bongocat] updateBongoKeyOverlay 异常:', e.message); }
              if (bongoInteractionActive) {
                // BongoCat 模式：跟踪左右手按键状态，释放后保持300ms再缩回
                const keyInfo = (typeof getBongoKeyHand === 'function') ? getBongoKeyHand(data.code) : null;
                let hand = keyInfo ? keyInfo.hand : null;
                // ★ 调试：方向键和 WASD 键的详细信息
                if (data.code && (data.code.startsWith('Arrow') || data.code === 'KeyW' || data.code === 'KeyA' || data.code === 'KeyS' || data.code === 'KeyD')) {
                  const foundDebug = findBongoKeyImage(data.code);
                  console.log('[Bongocat] ★ 方向键/WASD调试:', 'code=', data.code, 'key=', data.key,
                    'keyInfo=', JSON.stringify(keyInfo), 'hand=', hand,
                    'found=', foundDebug ? foundDebug.keyName : 'null',
                    'bongoKeyImages长度=', bongoKeyImages ? Object.keys(bongoKeyImages).length : 0);
                }
                // ★ 修复：只有模型支持的按键（有对应按键图片）才触发手部动作
                // 避免按下模型不支持的按键时左手也会消失的问题
                // 使用通用查找函数（支持 num1 等多种命名），确保和 updateBongoKeyOverlay 一致
                // ★ 例外：方向键（已绑定到 WASD）始终触发手部动作，不管模型有没有对应按键图片
                const isArrowKey = data.code && (data.code.startsWith('Arrow') || data.code === 'Numpad8' || data.code === 'Numpad2' || data.code === 'Numpad4' || data.code === 'Numpad6');
                if (!isArrowKey && bongoKeyImages && Object.keys(bongoKeyImages).length > 0 && hand !== null) {
                  const found = findBongoKeyImage(data.code);
                  if (!found) {
                    console.log('[Bongocat] 模型不支持按键', data.code, '，不触发手部动作');
                    hand = null;
                  }
                }
                const nowMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
                if (isUp) {
                  // 释放：减少对应手的按键计数，记录释放时间（不立即归零，等300ms后在update中衰减）
                  if (hand === 'left' || hand === 'both') {
                    if (bongoLeftKeyDownCount > 0) bongoLeftKeyDownCount--;
                    if (bongoLeftKeyDownCount === 0) bongoLeftLastUpTime = nowMs;
                  }
                  if (hand === 'right' || hand === 'both') {
                    if (bongoRightKeyDownCount > 0) bongoRightKeyDownCount--;
                    if (bongoRightKeyDownCount === 0) bongoRightLastUpTime = nowMs;
                  }
                  // 未知键（hand=null）不影响手的状态
                } else {
                  // 按下：增加对应手的按键计数，调用 bongocatTypeDirect 设置敲击参数和位置
                  if (hand === 'left' || hand === 'both') {
                    bongoLeftKeyDownCount++;
                  }
                  if (hand === 'right' || hand === 'both') {
                    bongoRightKeyDownCount++;
                  }
                  // 只有模型支持的按键才调用 bongocatTypeDirect
                  if (hand !== null) {
                    bongocatTypeDirect(data.code);
                  }
                }
              } else {
                // 普通 Live2D 模型：只在按下时播放动作，释放时忽略
                if (!isUp) {
                  handleTypingKey(data.key, data.code);
                }
              }
            } catch (err) {
              console.error('[Bongocat] 全局键盘回调异常:', err);
            }
          }
        });

        // ③ 全局鼠标事件（主进程通过IPC发送，鼠标在屏幕任意位置移动时 BongoCat 都能做眼球跟踪）
        // 之前只有 window.addEventListener('mousemove') 捕获窗口内鼠标事件，鼠标移出窗口后
        // BongoCat 眼球/头部就停止跟随，鼠标左右键也不响应。现在主进程定期查询屏幕鼠标坐标和按键状态，全局生效。
        window.api.on('bongocat:global-mousemove', (data) => {
          if (!bongoInteractionActive || bongoDestroyed) return;
          // ★ 统一使用全局鼠标事件，鼠标在屏幕任意位置都能跟踪
          if (!data || typeof data.x !== 'number' || typeof data.y !== 'number') return;
          try {
            // 使用屏幕坐标归一化：x 从 0~screenWidth 映射到 -1~1，y 从 0~screenHeight 映射到 -1~1
            const sw = data.screenWidth || (window.screen && window.screen.width) || 1920;
            const sh = data.screenHeight || (window.screen && window.screen.height) || 1080;
            const nx = (data.x / sw) * 2 - 1;
            const ny = (data.y / sh) * 2 - 1;
            bongoMouseX = Math.max(-1, Math.min(1, nx));
            bongoMouseY = Math.max(-1, Math.min(1, ny));
            // ★ 全局鼠标左右键状态（之前只能在窗口内捕获，现在全局生效）
            if (typeof data.leftDown === 'boolean') bongoLeftDown = data.leftDown ? 1 : 0;
            if (typeof data.rightDown === 'boolean') bongoRightDown = data.rightDown ? 1 : 0;
          } catch (e) {
            // 静默处理单次鼠标事件异常
          }
        });
        console.log('[Bongocat] 全局键盘+鼠标事件监听器已注册（含鼠标按键状态）');
      }

      // 暴露给外部调用
      window.__bongocatHandleKey = handleTypingKey;
    })();

    // 滚轮支持：菜单内滚动只滚动菜单本身（解决"太多功能显示不全、无法滚轮选择表情"）
    // 关键修复：之前在菜单【中间区域】调用 e.preventDefault() 阻止了浏览器原生滚动，
    // 导致滚轮完全失效、超出菜单项被裁切（"显示不完整"）。
    // 正确做法：不拦截默认滚动（overflow-y:auto + overscroll-behavior:contain 已让其自然滚动并在边界处不链到父级），
    // 仅 stopPropagation 阻止事件冒泡到画布/容器引发意外交互。
    actionMenu.addEventListener('wheel', (e) => {
      e.stopPropagation();
    }, { passive: true });

    function handleMenuAction(action) {
      // 动作类菜单：act:<动作名> → 交给 PetBrain 按模型真实动作播放
      if (action && action.startsWith('act:')) {
        const name = action.slice(4);
        PetBrain.doAction(name);
        return;
      }
      switch (action) {
        case 'chat':
          // 先显示输入框区域（添加 .show 类，确保 pointer-events: auto）
          inputArea.classList.add('show');
          // 先让窗口获得焦点，否则输入框无法接收键盘输入
          if (window.api && typeof window.api.focusPetWindow === 'function') {
            window.api.focusPetWindow();
          }
          // 延迟一点 focus 输入框，确保窗口已获得焦点、输入框已显示
          setTimeout(() => { petInput.focus(); petInput.select(); }, 80);
          break;
        case 'open-main':
          window.api.openMain();
          break;
        case 'change-model':
          // ★ 打开主窗口并自动切换到模型管理页面
          window.api.openMain('models');
          showBubble('去主界面换个造型吧！', 2000);
          break;
        case 'open-l2d':
          toggleL2DPanel();
          break;
        case 'hide':
          window.api.togglePet(false);
          break;
        case 'quit':
          // ★ 使用独立窗口对话框（主进程 showProjectDialog）：
          // 1. 无遮罩 — 独立 BrowserWindow，不是覆盖层，没有半透明背景
          // 2. 不受模型/窗口大小限制 — 独立窗口尺寸固定 480x260，不会被宠物窗口裁剪
          // 3. 样式符合项目规范 — 深色卡片 + 主题色按钮 + SVG 图标，与 AppDialog 视觉一致
          // 4. 以宠物窗口为父窗口居中显示，模态阻塞父窗口交互
          window.api.confirm({
            type: 'warning',
            title: '退出浮灵饰界',
            message: '确定要退出浮灵饰界吗？',
            buttons: ['退出', '取消']
          }).then(confirmed => {
            if (confirmed) window.api.quitApp();
          });
          break;
      }
    }

    // ==================== 输入框与AI对话 ====================

    // 本地指令识别：把自然语言短指令映射为语义动作（不依赖 AI，立即响应"操作"）。
    // 统一走通用匹配模块 CommandMatch，覆盖文档十大固定分类，支持复合动作叠加。
    // 返回语义分类 key 数组（可能为空：表示普通聊天交给 AI；可能含 idle：用户明确要待机）。
    function tryLocalAction(text) {
      if (!window.CommandMatch) return [];
      const hits = window.CommandMatch.get_hit_categories(text);
      if (hits.length) return hits;
      // 兼容历史控制指令：醒来（文档十大分类无 wake，但唤醒是必要控制，非情绪分类）
      if (/(起床|醒来|醒醒|wake)/i.test(text || '')) return ['wake'];
      // 重置（同样是非常规情绪分类的控制动作，与 wake 并列作为兼容指令）
      if (/(重置|复位|重新初始化|初始化|restart|reset|reload)/i.test(text || '')) return ['reset'];
      return [];
    }

    // ===== 输入框独立窗口状态（外部作用域，供其他函数调用）=====
    let inputBarFocused = false;
    let inputBarVisible = false;
    function showInputBarWindow() {
      if (inputBarVisible) return;
      inputBarVisible = true;
      if (!showInputEnabled || window.isBongocatMode) return;

      if (window.api && typeof window.api.showInputBar === 'function') {
        let barX = window.innerWidth / 2;
        let barY = window.innerHeight + 4; // 独立窗口显示在宠物窗口下方外面
        try {
          if (currentModel && modelBaseH > 0) {
            const scale = currentModel.scale ? currentModel.scale.y : 1;
            const modelBottomY = currentModel.y + (modelBaseH * scale) / 2;
            barX = currentModel.x || window.innerWidth / 2;
            barY = Math.max(modelBottomY + 4, window.innerHeight + 4);
          }
        } catch (e) {}
        window.api.showInputBar(barX, barY).catch(() => {});
      }
    }
    function hideInputBarWindow() {
      if (!inputBarVisible) return;
      inputBarVisible = false;
      // ★ 关闭输入框时清除“聚焦中”标记，否则 shouldShow = nearBottom || inputBarFocused
      //   会因残留的 true 立刻再次弹出，破坏“只有鼠标移到模型底部才出现”的规则。
      inputBarFocused = false;
      if (window.api && typeof window.api.hideInputBar === 'function') {
        window.api.hideInputBar().catch(() => {});
      }
    }

    function setupInput() {
      // ===== 输入框已改为独立窗口，不再操作 DOM 输入框 =====
      const SHOW_THRESHOLD = 55; // 鼠标距离底部多少px内显示输入框

      function updateInputVisibility(clientY) {
        // ★ 拖拽进行中一律关闭输入框：模型与输入框保持独立层级，
        //   拖动时输入框必须消失，且不能被“鼠标经过底部”重新唤起。
        if (typeof isDragging !== 'undefined' && isDragging) {
          hideInputBarWindow();
          return;
        }
        // 设置中禁用了输入框
        if (!showInputEnabled) {
          hideInputBarWindow();
          return;
        }
        // 完全点击穿透（dynamicClickThrough=false）时，输入框不应显示
        if (typeof dynamicClickThrough !== 'undefined' && !dynamicClickThrough) {
          hideInputBarWindow();
          return;
        }
        // Bongocat模式下不显示AI输入框
        if (window.isBongocatMode) {
          hideInputBarWindow();
          return;
        }
        // 动作面板打开时不显示输入框，避免冲突
        if (l2dPanelOpen) {
          hideInputBarWindow();
          return;
        }
        const nearBottom = (window.innerHeight - clientY) <= SHOW_THRESHOLD;
        const shouldShow = nearBottom || inputBarFocused;
        if (shouldShow) {
          showInputBarWindow();
        } else {
          hideInputBarWindow();
        }
      }

      // 监听全局mousemove
      window.addEventListener('mousemove', (e) => {
        updateInputVisibility(e.clientY);
      });
      // ★ 修复拖拽：不要在 mousedown 时弹出独立输入框。
      // 输入框窗口是 alwaysOnTop 弹出窗，mousedown 时弹出会抢走宠物窗口焦点 → 宠物窗口 blur
      // → 正在开始的拖拽被 blur 处理器取消，表现为“模型拖拽不了”。
      // 现在输入框只在「鼠标移到模型底部」时出现，拖动模型时关闭。

      // 监听独立输入框的消息发送
      if (window.api && typeof window.api.onInputBarSend === 'function') {
        window.api.onInputBarSend((text) => {
          sendPetMessage(text);
        });
      }

      // 监听独立输入框的焦点变化
      if (window.api && typeof window.api.onInputBarFocus === 'function') {
        window.api.onInputBarFocus((focused) => {
          inputBarFocused = focused;
          if (focused && !l2dPanelOpen) {
            showInputBarWindow();
          }
        });
      }
    }

    // 桌宠对话历史：保留最近 N 轮，让 AI 有上下文记忆（修复"重复问题答案不同/答非所问"）
    // 每轮 = { role: 'user'|'assistant', content: string }。过长自动截断，控制 token 消耗。
    const PET_CHAT_HISTORY = [];
    const PET_CHAT_HISTORY_MAX = 12; // 最多保留 12 条（约 6 轮对话）
    function pushChatHistory(role, content) {
      if (!content) return;
      PET_CHAT_HISTORY.push({ role, content: String(content).slice(0, 2000) });
      while (PET_CHAT_HISTORY.length > PET_CHAT_HISTORY_MAX) PET_CHAT_HISTORY.shift();
    }

    async function sendPetMessage(content) {
      content = (content || '').trim();
      if (!content || isProcessing) return;

      // 本地指令：命中即让模型做对应动作（睡觉/跳舞/挥手/疑惑/害羞…），不依赖 AI、立即响应"操作"。
      // 去掉原来的 12 字长度限制——无论长短指令（如"龙虾去睡觉吧"）都先识别意图并执行动作，
      // 避免走到 AI 路径后模型只回一句"搞定"却没有任何实际行动。复合语义（如"开心跳舞"）会叠加多个动作。
      let didLocalAction = false;
      const localActs = tryLocalAction(content);
      if (localActs.length) {
        PetBrain.doActions(localActs);
        // 纯指令（本身就是一个短命令）直接执行动作即可，无需再调用 AI 闲聊
        if (content.length <= 12) return;
        // 较长句子（如"龙虾去睡觉吧"）：动作已执行，仍让 AI 给出一句回复，
        // 但最后不要再说"搞定啦"（由下方 AI 分支读取 didLocalAction 抑制该气泡）
        didLocalAction = true;
      }

      isProcessing = true;

      // 仅当没有本地动作时，才进入"思考"态（否则 onThinking→onThinkingDone 会覆盖 sleep/wake 等动作）
      const shouldThink = !didLocalAction;
      if (shouldThink) {
        // 思考态：让龙虾做出"思考"动作（模型无对应动作组时静默，降级仍走 lobsterBounce）
        if (!PetBrain.playMotion('think')) lobsterBounce();
        PetBrain.onThinking();
        showBubble('收到！让我想想...', 2000);
      }

      try {
        // 检查AI是否可用（有已启用的提供商即可，不依赖 activeProvider 是否显式设置）
        const status = await window.api.getAIStatus();
        if (status.cloudProvidersCount === 0 && status.localModelsCount === 0) {
          showBubble('AI还没连接呢！请先在主界面配置AI模型~', 4000);
          isProcessing = false;
          return;
        }

        if (shouldThink) showThinking();

        // 模块4：MMD 模式下，把「3D 骨骼动作上下文」（bone_limit + 当前姿态 + 可用骨名）注入 system prompt，
        // 让 AI 可选输出 <pose> 骨骼偏移关键帧（自适应、不夸张）。非 MMD 时保持原 prompt。
        let sysPrompt = PET_SYSTEM_PROMPT;
        if (currentPetType === 'MMD' && mmdPet) {
          const ctx = buildAIPoseContext();
          if (ctx) {
            sysPrompt = PET_SYSTEM_PROMPT + '\n\n[3D 骨骼动作模式]\n' +
              '当前是 3D 模型（PMX）。除用 [ACT:动作] 触发预设身体动作外，还可用 <pose> 标签输出自定义骨骼动作（更精细、自然、克制）：\n' +
              '在回复中加一个 <pose> JSON </pose> 块，例如：\n' +
              '{ "duration": 1.2, "keyframes": [ { "t": 0.0, "bones": { "右腕": {"x":10,"z":5} } }, { "t": 0.6, "bones": { "右腕": {"x":35,"z":20} } }, { "t": 1.0, "bones": { "右腕": {"x":0,"z":0} } } ] }\n' +
              '说明：duration=总时长(秒)；每个 keyframe 的 t∈[0,1] 为归一化时间；bones 数值为相对静止姿态的偏移(度)，可用逻辑骨名(右腕/頭/上半身…)或实际骨名；缺失的骨保持静止。\n' +
              '约束（必须克制、自然，多数关节偏移 < 40°；超限会被自动截断防穿模）：\n' +
              'bone_limit = ' + JSON.stringify(ctx.bone_limit) + '\n' +
              'current_pose(度，相对静止) = ' + JSON.stringify(ctx.current_pose) + '\n' +
              'available_bones(部分) = ' + JSON.stringify(ctx.available_bones) + '\n' +
              '【人体工学与自然姿态规则（务必遵守，确保动作自然、不穿模、不反关节）】\n' +
              '· 骨骼链：上半身→上半身2→颈→头；肩→大臂→肘→腕；大腿→膝→踝。修改上游骨（如上半身）时，下游肢端的偏移要相应减小并做反向微调，避免肢体"飘离"躯干。\n' +
              '· 肘部弯曲时，同侧肩部应略外展配合；禁止给同一手臂的"肩+大臂+肘"同时施加方向相反的过大偏移（极易穿模/扭曲）。\n' +
              '· 手腕偏移幅度应明显小于肘部；膝盖只能向"屈膝"方向弯（正值），切勿给负值造成反关节。\n' +
              '· 躯干大幅前倾时配一点屈膝缓冲更自然；整体幅度克制，大多数单关节偏移 < 35°，且首尾关键帧回到接近 0（静止），避免动作结束后肢体停在怪异姿态。\n' +
              '· 关键帧之间会自动缓动插值，无需手工堆很多中间帧；用 2~4 个关键帧表达"起→峰→回"即可。\n' +
              '若预设动作已足够表达，直接 [ACT:] 即可，不必输出 <pose>。';
          }
        }

        // 构建消息：历史对话 + 当前用户消息，让 AI 有上下文记忆（修复"重复问题答案不同"）
        const chatMessages = PET_CHAT_HISTORY.slice();
        chatMessages.push({ role: 'user', content });

        // 使用 Agent 模式：支持工具调用（写文件/运行命令等），让宠物真正能帮用户做事
        // 宠物窗口默认自动授权工具执行，不弹窗打扰
        const result = await window.api.petAgentChat({
          messages: chatMessages,
          systemPrompt: sysPrompt,
          temperature: 0.5,
          maxTokens: 2048,
          thinkMode: true,
          autoAuthorize: true
        });

        if (shouldThink) hideThinking();
        if (shouldThink) PetBrain.onThinkingDone();

        if (result.success) {
          const rawText = result.content || '';
          // 解析动作标签
          const { text, actions } = parseActions(rawText);

          // 模块4：若 AI 给出骨骼关键帧且为 MMD，优先播放（意图兜底由下方 executeActions 覆盖）
          const poseRes = (currentPetType === 'MMD' && mmdPet) ? parseAIPose(rawText) : null;
          let aiPosePlayed = false;
          if (poseRes) aiPosePlayed = dispatchAIMotion(poseRes.clip);

          // 提升识别精度：扫描用户原始消息里的动作关键词，若 AI 漏打 [ACT:] 标签也能触发
          const userAct = detectActionFromText(content);
          if (userAct && !actions.some(a => a.type === 'act' && a.intent === userAct)) {
            actions.push({ type: 'act', intent: userAct });
          }

          // 显示回复文本（剔除 <pose> / 关键帧 JSON 块，不暴露给用户）
          const displayText = poseRes ? text.replace(poseRes.block, '').trim() : text.trim();
          if (displayText) {
            showBubble(displayText, 4000);
          }

          // 记入对话历史（让后续提问有上下文），仅保留纯文本部分
          pushChatHistory('user', content);
          pushChatHistory('assistant', displayText || rawText);

          // 执行动作
          if (actions.length > 0) {
            if (didLocalAction) {
              // 本地动作已执行（如"睡觉"已让桌宠入睡），过滤掉 AI 返回的 ACT 类动作，
              // 避免 AI 的情绪标签（如 [ACT:happy]）覆盖本地动作（如把睡着的龙虾唤醒）。
              // 仅保留系统操作类动作（OPEN/TYPE/KEY/CMD/WAIT），让"睡觉前打开XX"仍能执行。
              const nonActActions = actions.filter(a => a.type !== 'act');
              if (nonActActions.length > 0) {
                await executeActions(nonActActions);
              }
            } else if (aiPosePlayed) {
              // AI 骨骼动作已播放（覆盖身体表现），跳过 [ACT:] 身体动作避免冲突；
              // 仍执行系统操作类动作（OPEN/TYPE/KEY/CMD/WAIT）。
              const nonActActions = actions.filter(a => a.type !== 'act');
              if (nonActActions.length > 0) {
                await executeActions(nonActActions);
              }
            } else {
              await executeActions(actions);
            }
          } else if (didLocalAction) {
            // 用户指令动作已执行，不再补"搞定啦"气泡，避免"只说不做"的观感
          } else if (aiPosePlayed) {
            // 骨骼动作已播放，无需再补情绪推断
          } else {
            // 纯文本回复：AI 未显式给动作标签时，按语义自动推断一个情绪动作（自主表现）
            const inferred = inferPetAction(text);
            if (inferred) PetBrain.doAction(inferred);
            else PetBrain.onTaskDone();
          }
        } else {
          showBubble('出错了：' + (result.error || 'AI无响应'), 4000);
        }
      } catch (err) {
        if (shouldThink) hideThinking();
        if (shouldThink) PetBrain.onThinkingDone();
        showBubble('网络出问题了：' + err.message, 4000);
      } finally {
        isProcessing = false;
      }
    }

    // 根据 AI 纯文本回复"思考"出宠物情绪动作（AI 未显式给 [ACT] 标签时的兜底，增强自主感）。
    // 不再只是"命中第一个非 idle 关键词"，而是对各分类做加权打分 + 简单推理信号，
    // 选出得分最高的情绪动作，让宠物像在理解内容后做出反应。统一走通用匹配模块 CommandMatch。
    function inferPetAction(text) {
      if (!window.CommandMatch || !text) return null;
      const cm = window.CommandMatch;
      const raw = (text || '').trim();
      const t = raw.toLowerCase();

      // 1) 基于话术库的关键词加权打分（长词/多字词权重更高，单字权重更低，避免误判）
      const scores = {};
      for (const cat of cm.CATEGORY_LIST) {
        if (cat === 'idle') continue; // 待机不主动表现
        let s = 0;
        for (const w of (cm.GROUP_WORDS[cat] || [])) {
          const lw = String(w).toLowerCase();
          if (!lw) continue;
          if (t.includes(lw)) s += lw.length >= 2 ? 2 : 1;
        }
        if (s > 0) scores[cat] = (scores[cat] || 0) + s;
      }

      // 2) 推理信号（不依赖固定话术，按句子特征补充分类权重，让"思考"更贴合语义）
      if (/[?？]/.test(raw)) scores['confuse'] = (scores['confuse'] || 0) + 1;            // 带问号 → 疑惑
      if (/(晚安|睡觉|休息|困了|睡|おやすみ)/.test(raw)) scores['sleep'] = (scores['sleep'] || 0) + 2;
      if (/^(你好|您好|嗨|哈喽|早安|早上好|晚上好|hi|hello|hey)/i.test(raw)) scores['greet'] = (scores['greet'] || 0) + 2;
      if (/(抱歉|对不起|不能|无法|不行|不会|失败|出错|做不到)/.test(raw)) scores['sad'] = (scores['sad'] || 0) + 1;
      if (/(哈哈|太好了|好棒|耶|恭喜|厉害|赞)/.test(raw)) scores['happy'] = (scores['happy'] || 0) + 1;

      // 3) 取最高分分类（阈值>=1，至少要有一点信号，避免把普通陈述句误判为情绪）
      let best = null, bestScore = 0;
      for (const cat of Object.keys(scores)) {
        if (scores[cat] > bestScore) { bestScore = scores[cat]; best = cat; }
      }
      return bestScore >= 1 ? best : null;
    }

    // 解析AI回复中的动作标签
    // 中文动作词 → 规范英文意图（让 AI 既能写 [ACT:turn] 也能写 [ACT:转身]）
    function normalizeAct(raw) {
      const s = String(raw).trim().toLowerCase();
      const alias = {
        '转身': 'turn', '转圈': 'turn', '转个圈': 'turn', '转过去': 'turn_away',
        '背过去': 'turn_away', '背对': 'turn_away', '转过身': 'turn_away',
        '点头': 'nod', '摇头': 'shake', '摆头': 'shake', '否认': 'shake',
        '鞠躬': 'bow', '弯腰': 'bow', '招手': 'wave', '挥手': 'wave',
        '跳': 'jump', '跳一下': 'jump', '蹦': 'jump', '蹦跳': 'jump',
        '跳舞': 'dance', '舞蹈': 'dance',
        '蹲下': 'squat', '蹲': 'squat', '下蹲': 'squat', '蹲着': 'squat',
        '坐下': 'sit', '坐下来': 'sit', '落座': 'sit', '跪': 'sit',
        '站起来': 'stand', '起身': 'stand', '起立': 'stand', '站起': 'stand',
        '伸懒腰': 'stretch', '伸展': 'stretch', '拉伸': 'stretch', '懒腰': 'stretch',
        '思考': 'think', '托腮': 'think', '沉思': 'think', '想想': 'think',
        '害羞': 'shy', '不好意思': 'shy', '脸红': 'shy', '捂脸': 'shy',
        '鼓掌': 'clap', '拍手': 'clap', '呱唧': 'clap',
        '指向': 'point', '指一指': 'point', '指给你看': 'point',
        '打哈欠': 'yawn', '哈欠': 'yawn',
        '叉腰': 'cross', '双手叉腰': 'cross', '抱臂': 'cross'
      };
      if (alias[s]) return alias[s];
      for (const k of Object.keys(alias)) {
        if (s.includes(k)) return alias[k];
      }
      return s;
    }

    // 扫描用户原始消息里的动作关键词，直接触发对应动作（提升识别精度）。
    // 即便 AI 回复忘了写 [ACT:] 标签，只要用户说了"蹲下/坐下/伸懒腰…"，宠物也会做出来。
    // 长词优先匹配；以多字短语为主，避免把"网站""指示""你想"等普通聊天误触发。
    const ACTION_KEYWORDS = {
      '蹲下': 'squat', '下蹲': 'squat', '蹲着': 'squat',
      '坐下': 'sit', '坐下来': 'sit', '落座': 'sit', '跪下': 'sit',
      '站起来': 'stand', '起身': 'stand', '起立': 'stand', '站起': 'stand',
      '伸懒腰': 'stretch', '伸展': 'stretch', '拉伸': 'stretch',
      '思考': 'think', '托腮': 'think', '沉思': 'think', '想想看': 'think',
      '害羞': 'shy', '不好意思': 'shy', '脸红': 'shy', '捂脸': 'shy',
      '鼓掌': 'clap', '拍手': 'clap', '呱唧': 'clap',
      '指向': 'point', '指一指': 'point', '指给你看': 'point',
      '打哈欠': 'yawn', '哈欠': 'yawn',
      '叉腰': 'cross', '双手叉腰': 'cross', '抱臂': 'cross',
      '转过身': 'turn_away', '背过去': 'turn_away', '背对': 'turn_away',
      '转身': 'turn', '转圈': 'turn', '转个圈': 'turn',
      '点头': 'nod', '摇头': 'shake', '摆头': 'shake', '鞠躬': 'bow', '弯腰': 'bow',
      '招手': 'wave', '挥手': 'wave', '跳一下': 'jump', '蹦': 'jump', '跳舞': 'dance', '舞蹈': 'dance'
    };
    function detectActionFromText(text) {
      if (!text) return null;
      const t = String(text).toLowerCase();
      const keys = Object.keys(ACTION_KEYWORDS).sort((a, b) => b.length - a.length);
      for (const k of keys) {
        if (t.includes(k.toLowerCase())) return ACTION_KEYWORDS[k];
      }
      return null;
    }

    function parseActions(text) {
      const actions = [];
      const tagRegex = /\[(OPEN|TYPE|KEY|CMD|WAIT|ACT):([^\]]+)\]/g;
      let match;
      let cleanText = text;

      while ((match = tagRegex.exec(text)) !== null) {
        const type = match[1].toLowerCase();
        const value = match[2].trim();

        switch (type) {
          case 'open':
            actions.push({ type: 'open', target: value });
            break;
          case 'type':
            actions.push({ type: 'type', text: value });
            break;
          case 'key':
            actions.push({ type: 'key', combo: value });
            break;
          case 'cmd':
            actions.push({ type: 'cmd', command: value });
            break;
          case 'wait':
            actions.push({ type: 'wait', ms: parseInt(value) || 1000 });
            break;
          case 'act':
            actions.push({ type: 'act', intent: normalizeAct(value.toLowerCase()) });
            break;
        }
      }

      // 移除所有标签，保留纯文本
      cleanText = text.replace(tagRegex, '').trim();
      return { text: cleanText, actions };
    }

    // 模块4：从 AI 回复文本中提取「骨骼偏移关键帧」剪辑。
    // 支持两种写法：<pose>JSON</pose> 块，或含 "keyframes" 的 ```json 围栏块。
    // 命中返回 { clip: 解析对象, block: 需从展示文本中剔除的原始片段 }，否则返回 null（交给意图兜底）。
    function parseAIPose(text) {
      if (!text) return null;
      let block = null, jsonStr = null;
      const m = text.match(/<pose>([\s\S]*?)<\/pose>/i);
      if (m) { block = m[0]; jsonStr = m[1]; }
      else {
        const fence = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
        if (fence && /keyframes/i.test(fence[1])) { block = fence[0]; jsonStr = fence[1]; }
      }
      if (!jsonStr) return null;
      try {
        const obj = JSON.parse(jsonStr.trim());
        if (obj && (Array.isArray(obj.keyframes) || Array.isArray(obj.frames))) return { clip: obj, block };
      } catch (e) { /* 解析失败 → 非骨骼动作，走意图兜底 */ }
      return null;
    }

    // 模块4：把 AI 剪辑派发到 MMD 引擎播放；非 MMD 或失败返回 false（供调用方走意图兜底）。
    function dispatchAIMotion(clip) {
      if (currentPetType === 'MMD' && mmdPet && typeof mmdPet.playAIPose === 'function') {
        try { return mmdPet.playAIPose(clip) === true; } catch (e) { console.warn('[Pet] playAIPose 失败:', e.message); return false; }
      }
      return false;
    }

    // 模块4：拼装给 AI 的「3D 骨骼动作上下文」——bone_limit（角度约束）+ 当前姿态 + 可用骨名，
    // 让 AI 自适应模型、输出克制不夸张的偏移关键帧。仅 MMD 且有引擎时返回，否则 null。
    function buildAIPoseContext() {
      if (currentPetType !== 'MMD' || !mmdPet || typeof mmdPet.getModelConfig !== 'function') return null;
      const cfg = mmdPet.getModelConfig() || {};
      const bones = (typeof mmdPet.listBones === 'function') ? mmdPet.listBones() : [];
      const cur = (typeof mmdPet.getCurrentPose === 'function') ? mmdPet.getCurrentPose() : {};
      return {
        bone_limit: cfg.bone_limit || {},
        current_pose: cur,
        available_bones: bones.slice(0, 120) // 控制体积，取前 120 个实际骨名
      };
    }

    // 顺序执行动作
    async function executeActions(actions) {
      // AI 自主行为：模型局部动画类动作（[ACT:]），直接驱动 Live2D 模型，不走系统操作。
      // 允许文档十大固定分类 + 历史兼容动作名（wave/think/surprise/wake）。
      const ACT_ALLOWED = ['greet', 'dance', 'sleep', 'confuse', 'happy', 'shy', 'angry', 'sad', 'lazy', 'idle',
                           'wave', 'think', 'surprise', 'wake',
                           'turn', 'nod', 'shake', 'bow', 'jump', 'spin', 'back', 'turn_away',
                           'squat', 'sit', 'stand', 'stretch', 'clap', 'point', 'yawn', 'cross'];
      for (let i = 0; i < actions.length; i++) {
        const action = actions[i];
        if (action.type === 'act') {
          if (ACT_ALLOWED.includes(action.intent)) PetBrain.doAction(action.intent);
          continue;
        }
        const labels = {
          open: '正在打开 ' + (action.target || ''),
          type: '正在输入文本...',
          key: '正在发送按键 ' + (action.combo || ''),
          cmd: '正在执行命令...',
          wait: '等待中...'
        };

        showActionStatus(labels[action.type] || '执行中...');

        // 龙虾做一个小动作
        lobsterBounce();

        try {
          const result = await window.api.petExecuteAction(action);
          if (!result.success) {
            const errMsg = result.error || '未知错误';
            console.warn('Action failed:', action.type, errMsg);
            showBubble('操作失败：' + errMsg.slice(0, 80), 3000);
          }
          // cmd 类型显示输出
          if (action.type === 'cmd' && result.stdout) {
            showBubble(result.stdout.slice(0, 200), 4000);
          }
        } catch (e) {
          console.warn('Action error:', e.message);
          showBubble('操作异常：' + e.message.slice(0, 80), 3000);
        }

        // 动作之间小停顿
        await new Promise(r => setTimeout(r, 300));
      }

      hideActionStatus();
      // 桌宠正在睡眠时不调用 onTaskDone（避免显示"搞定啦"气泡干扰睡眠表现）
      if (PetBrain.state !== 'SLEEPING') PetBrain.onTaskDone();
    }

    // 将用户保存的模型色彩设置（饱和度/亮度/色相）应用到桌宠模型
    function applyPetColor(c) {
      const col = (c && typeof c === 'object') ? c : ((petConfig && petConfig.pet && petConfig.pet.color) || {});
      const sat = (typeof col.saturation === 'number' && isFinite(col.saturation)) ? col.saturation : 1;
      const bri = (typeof col.brightness === 'number' && isFinite(col.brightness)) ? col.brightness : 1;
      const hue = (typeof col.hue === 'number' && isFinite(col.hue)) ? col.hue : 0;
      const filter = `saturate(${sat}) brightness(${bri}) hue-rotate(${hue}deg)`;
      document.documentElement.style.setProperty('--pet-color-filter', filter);
    }

    function setupIpc() {
      // ★ 渲染倍率（同时影响模型和键盘叠加层清晰度）
      let currentRenderScale = 1.0;

      window.api.on('init:config', (config) => {
        petConfig = config;
        // 读取功能显示开关
        showInputEnabled = config.pet?.showInput !== false;
        showContextMenuEnabled = config.pet?.showContextMenu !== false;
        applyPetColor();
        // 应用帧率设置
        if (pixiApp && config.pet?.frameRate != null) {
          const fps = config.pet.frameRate;
          pixiApp.ticker.maxFPS = fps;
        }
        // 应用初始模型透明度（仅作用于画布，不影响输入框）
        if (config.pet?.opacity != null) {
          const op = Math.max(0.1, 1 - config.pet.opacity);
          currentModelOpacity = op; // ★ 同步保存到变量，避免模型加载后用默认值1覆盖
          document.documentElement.style.setProperty('--model-opacity', String(op));
        }

          // 应用初始渲染倍率（同时影响模型和键盘叠加层清晰度）
          if (config.pet?.renderScale != null) {
            const rs = (typeof config.pet.renderScale === 'number' && isFinite(config.pet.renderScale) && config.pet.renderScale > 0) ? config.pet.renderScale : 1.0;
            currentRenderScale = rs; // ★ 同步保存到变量，避免模型加载后用默认值1.0覆盖
            try {
              const dpr = window.devicePixelRatio || 1;
              if (pixiApp && pixiApp.renderer) {
                pixiApp.renderer.resolution = rs * dpr;
                console.log('[RenderScale] 初始化 PIXI resolution =', rs, '× dpr', dpr, '=', (rs*dpr).toFixed(2));
              }
            } catch(e) { console.error('[RenderScale] 初始化失败:', e); }
          }
        if (config.pet?.clickThrough) {
          // 完全点击穿透：所有事件穿透，包括模型本身
          container.style.pointerEvents = 'none';
          dynamicClickThrough = false;
          isCapturingMouse = false;
          // 完全穿透时隐藏输入框，避免其 .show 的 pointer-events:auto 打破穿透
          const ia = document.getElementById('input-area');
          if (ia && ia.classList.contains('show')) ia.classList.remove('show');
        } else {
          // 动态逐像素穿透：透明区域穿透，模型像素捕获
          container.style.pointerEvents = 'auto';
          dynamicClickThrough = true;
        }
      });

      // 设置面板实时调整色彩（饱和度/亮度/色相），无需重载宠物窗口
      window.api.on('pet:color', (color) => {
        if (!color || typeof color !== 'object') return;
        if (petConfig && petConfig.pet) petConfig.pet.color = color;
        applyPetColor(color);
      });

      // 透明度（“透明度”设置）：作用于模型画布，不影响输入框/菜单等 UI（避免输入框被一起变淡）
      window.api.on('pet:opacity', (v) => {
        const op = (typeof v === 'number' && isFinite(v) && v > 0) ? v : 1;
        currentModelOpacity = op; // ★ 保存当前透明度，模型加载后重新应用 CSS 变量
        // ★ 通过 CSS 变量控制 canvas 透明度（#live2d-canvas, #mmd-canvas, #bongo-background-image, #bongo-key-image）
        // 不直接设置 currentModel.alpha，避免和 CSS opacity 叠加导致双重透明度
        document.documentElement.style.setProperty('--model-opacity', String(op));
      });

      // ★ 渲染倍率（同时影响模型和键盘叠加层清晰度，解决清晰度不一致问题）
      // 模型：调节 PIXI.Application.resolution = 倍率 × devicePixelRatio（WebGL渲染分辨率）
      // 键盘叠加层：使用 CSS zoom 改变渲染分辨率，配合 transform:scale 保持显示大小不变

      window.api.on('pet:render-scale', (scale) => {
        const s = (typeof scale === 'number' && isFinite(scale) && scale > 0) ? scale : 1.0;
        currentRenderScale = s;
        try {
          // 调节 PIXI 渲染分辨率（2D Live2D 模型）：乘以 devicePixelRatio 让模型默认和 HTML 元素一样清晰
          const dpr = window.devicePixelRatio || 1;
          if (pixiApp && pixiApp.renderer) {
            pixiApp.renderer.resolution = s * dpr;
            pixiApp.renderer.resize(window.innerWidth, window.innerHeight);
            console.log('[RenderScale] PIXI(2D) resolution =', s, '× dpr', dpr, '=', (s*dpr).toFixed(2));
          }
          // ★ 调节 MMD 渲染分辨率（3D 模型）：通过 mmdPet.setRenderScale 方法
          if (currentPetType === 'MMD' && mmdPet && typeof mmdPet.setRenderScale === 'function') {
            try {
              mmdPet.setRenderScale(s);
              console.log('[RenderScale] MMD(3D) setRenderScale =', s);
            } catch (e) {
              console.warn('[RenderScale] MMD(3D) setRenderScale 失败:', e.message);
            }
          }
          // 调节键盘叠加层清晰度：
          // s < 1 时用 filter:blur 模拟低分辨率模糊（和 PIXI resolution 降低效果一致）
          //   模型放大倍数 = 1/s，模糊程度与 (1/s - 1) 成正比
          // s >= 1 时保持原生清晰（图片本身分辨率有限，无法更清晰）
          const keyImage = document.getElementById('bongo-key-image');
          const bgImage = document.getElementById('bongo-background-image');
          if (s < 1) {
            // 模糊程度：与模型低分辨率放大后的模糊程度匹配
            // 模型 resolution = s*dpr，放大倍数 = 1/s，模糊程度 ≈ (1/s - 1) * 系数
            const blurPx = Math.min((1/s - 1) * 1.2, 6).toFixed(2);
            [keyImage, bgImage].forEach(el => {
              if (el) el.style.filter = `blur(${blurPx}px)`;
            });
            console.log('[RenderScale] 键盘叠加层 s<1 blur =', blurPx, 'px');
          } else {
            [keyImage, bgImage].forEach(el => {
              if (el) el.style.filter = 'none';
            });
            console.log('[RenderScale] 键盘叠加层 s>=1 原生清晰');
          }
        } catch (e) {
          console.warn('[RenderScale] 设置渲染倍率失败:', e.message);
        }
      });

      // 外部（主界面/聊天/AI）指挥桌宠做语义动作（支持单个动作名或动作名数组/复合叠加）
      window.api.on('pet:action', (name) => {
        if (!name) return;
        if (Array.isArray(name)) PetBrain.doActions(name);
        else PetBrain.doAction(name);
      });

      // 主窗口动作编辑器预览某个关键帧动作定义（循环播放便于观察）
      window.api.on('pet:preview-action', (def) => {
        if (currentPetType === 'MMD' && mmdPet && mmdPet.ready) {
          try { mmdPet.previewAction(def); } catch (e) { console.error('[Pet] 预览动作失败:', e); }
        }
      });

      // 主窗口动作编辑器保存后，实时把整套动作配置推给龙虾（待机/相关动作立即生效）
      window.api.on('pet:set-actions', (data) => {
        if (currentPetType === 'MMD' && mmdPet && mmdPet.ready) {
          try { mmdPet.setActions(data); } catch (e) { console.error('[Pet] 载入动作配置失败:', e); }
          try { refreshActionMenu(); } catch (e) { /* 菜单尚未初始化时忽略 */ }
        }
        // Live2D / 通用：保存待机组合动作配置（idleCombo），供待机循环播放使用
        try { PetBrain.setActionsConfig(data); } catch (e) { console.error('[Pet] 载入待机组合配置失败:', e); }
      });

      window.api.on('pet:resize', ({ width, height }) => {
        // 更新全局窗口尺寸变量（供 loadModel 等函数使用）
        windowW = width;
        windowH = height;
        // 更新窗口和画布尺寸
        document.body.style.width = width + 'px';
        document.body.style.height = height + 'px';
        container.style.width = width + 'px';
        container.style.height = height + 'px';
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        if (currentPetType === 'MMD' && mmdPet) {
          // MMD 模式：校正 Three.js 渲染缓冲与相机宽高比
          mmdPet.resize(width, height);
        } else if (pixiApp) {
          pixiApp.renderer.resize(width, height);
          // ★ Bongocat 模式：重新应用特殊的显示方式（pivot/scale/position），确保居中不被裁剪
          if (bongoInteractionActive && currentModel) {
            try {
              const im = currentModel.internalModel;
              const canvasW = im ? (im.width || currentModel.width || 1400) : (currentModel.width || 1400);
              const canvasH = im ? (im.height || currentModel.height || 1400) : (currentModel.height || 1400);
              const scaleX = width / canvasW;
              const scaleY = height / canvasH;
              const scale = Math.min(scaleX, scaleY);
              currentModel.pivot.set(canvasW / 2, canvasH / 2);
              currentModel.scale.set(scale);
              currentModel.x = width / 2;
              currentModel.y = height / 2;
              // 重新计算背景图片的大小和位置（和模型一致）
              const bgImgEl = document.getElementById('bongo-background-image');
              if (bgImgEl) {
                const bgW = canvasW * scale;
                const bgH = canvasH * scale;
                const bgX = currentModel.x - bgW / 2;
                const bgY = currentModel.y - bgH / 2;
                bgImgEl.style.width = bgW + 'px';
                bgImgEl.style.height = bgH + 'px';
                bgImgEl.style.left = bgX + 'px';
                bgImgEl.style.top = bgY + 'px';
              }
              // 重新计算按键图片的大小和位置（和模型一致）
              const keyImgEl = document.getElementById('bongo-key-image');
              if (keyImgEl) {
                const keyW = canvasW * scale;
                const keyH = canvasH * scale;
                const keyX = currentModel.x - keyW / 2;
                const keyY = currentModel.y - keyH / 2;
                keyImgEl.style.width = keyW + 'px';
                keyImgEl.style.height = keyH + 'px';
                keyImgEl.style.left = keyX + 'px';
                keyImgEl.style.top = keyY + 'px';
              }
              console.log('[Bongocat] resize 重新居中: canvas=', canvasW, 'x', canvasH, 'win=', width, 'x', height, 'scale=', scale.toFixed(3));
            } catch (e) {
              console.warn('[Bongocat] resize 重新居中失败:', e.message);
            }
          } else if (currentModel) {
            // 普通 Live2D 模型：重新缩放并居中
            try {
              // 窗口尺寸变化后先强制更新/渲染一帧，再重新量边界
              if (currentModel.internalModel && typeof currentModel.internalModel.update === 'function') {
                currentModel.internalModel.update(0);
              }
              pixiApp.renderer.render(pixiApp.stage);
            } catch (e) {}
            fitLive2DModelToWindow(currentModel, width, height);
          }
        }
      });

      window.api.on('pet:clickthrough', (enabled) => {
        if (enabled) {
          // 完全点击穿透：所有事件穿透，模型不能拖动
          // setIgnoreMouseEvents(true, {forward:true}) 保证点击穿透，同时 mousemove 转发
          // bongocat 的眼球跟踪使用全局鼠标事件，不受影响
          container.style.pointerEvents = 'none';
          dynamicClickThrough = false;
          window.api.setPetIgnoreMouseEvents(true, true);
          isCapturingMouse = false;
          // ★ 完全穿透时输入框不应捕获事件（其 .show 的 pointer-events:auto 会打破穿透），
          // 强制隐藏输入框并恢复模型居中（取消底部预留）。
          const ia = document.getElementById('input-area');
          if (ia && ia.classList.contains('show')) {
            ia.classList.remove('show');
            if (currentModel && typeof fitLive2DModelToWindow === 'function' && windowW > 0 && windowH > 0) {
              try {
                if (currentModel.internalModel && typeof currentModel.internalModel.update === 'function') currentModel.internalModel.update(0);
                if (pixiApp) pixiApp.renderer.render(pixiApp.stage);
                fitLive2DModelToWindow(currentModel, windowW, windowH);
              } catch (e) {}
            }
          }
        } else {
          // 动态逐像素穿透：透明区域穿透，模型像素捕获（可拖动模型）
          container.style.pointerEvents = 'auto';
          dynamicClickThrough = true;
          window.api.setPetIgnoreMouseEvents(true, true); // 前向模式，mousemove 转发用于像素检测
          // 下次 mousemove 会自动处理捕获/穿透切换
        }
      });

      // 显示输入框开关
      window.api.on('pet:show-input', (enabled) => {
        showInputEnabled = !!enabled;
        if (!enabled) hideInputBarWindow();
      });

      // 显示右键菜单开关
      window.api.on('pet:show-contextmenu', (enabled) => {
        showContextMenuEnabled = !!enabled;
      });

      window.api.on('init:models', (models) => {
        petModels = models || [];
      });

      // BongoCat 模型加载：主进程通知宠物窗口加载BongoCat模型
      window.api.on('bongocat:load-model', async (modelPath) => {
        console.log('[BongoCat] 收到模型加载请求:', modelPath);
        if (!modelPath) return;
        try {
          // 隐藏右键菜单
          hideActionMenu();
          // 加载Live2D模型
          const success = await loadModel(modelPath, 'Live2D');
          console.log('[BongoCat] 模型加载结果:', success);
          if (!success) {
            stopBongocatInteraction();
            // 通知主进程停止全局键盘钩子
            if (window.api && typeof window.api.setBongocatActive === 'function') {
              try { window.api.setBongocatActive(false); } catch (e) {}
            }
            showBubble('BongoCat 模型加载失败', 5000);
            return;
          }

          // ★ 复用 startBongocatMode：内部会隐藏UI + 等待参数就绪 + 启动特殊交互 +
          // 通知主进程启动全局键盘钩子。之前重复实现导致「主界面按钮启动」和
          // 「模型列表应用」行为不一致，且 200ms 固定延迟下参数经常未就绪。
          setTimeout(() => { startBongocatMode(); }, 50);

          showBubble('BongoCat 键盘猫已启动！', 3000);
        } catch (e) {
          stopBongocatInteraction();
          if (window.api && typeof window.api.setBongocatActive === 'function') {
            try { window.api.setBongocatActive(false); } catch (e) {}
          }
          console.error('[BongoCat] 模型加载失败:', e.message);
          showBubble('BongoCat 加载失败: ' + e.message, 5000);
        }
      });

      window.api.on('model:changed', async (modelInfo) => {
        // 切换模型前先关闭右键菜单：避免菜单仍处于打开态时模型重载导致
        // contextMenuVisible / uiForceCapture 状态残留，菜单卡死无法关闭
        hideActionMenu();

        // ★ 从Bongocat模式切换到普通模型时，恢复AI输入框和右键菜单，并停止Bongocat交互循环
        if (window.isBongocatMode) {
          window.isBongocatMode = false;
          stopBongocatInteraction();
          if (inputArea) inputArea.style.display = '';
          if (actionMenu) actionMenu.style.display = '';
          // ★ 通知主进程停止全局键盘钩子（避免窗口失焦后还持续监听系统键盘）
          if (window.api && typeof window.api.setBongocatActive === 'function') {
            try { window.api.setBongocatActive(false); } catch (e) {}
          }
          console.log('[BongoCat] 已退出Bongocat模式，恢复UI');
        }

        const stateStr = JSON.stringify({
          id: modelInfo?.id, name: modelInfo?.name, type: modelInfo?.type,
          hasModelFile: !!modelInfo?.modelFile, petType: currentPetType,
          useLive2D: useLive2D, hasPixiApp: !!pixiApp, hasCurrentModel: !!currentModel,
          canvasDisplay: canvas?.style.display, cssLobsterDisplay: cssLobster?.style.display
        });
        console.log('[model:changed] 收到事件:', stateStr);
        if (window.__debugLog) window.__debugLog('model:changed ' + stateStr);
        try {
          // null 表示恢复默认模型（显示 CSS 龙虾形象）
          if (!modelInfo) {
            // 销毁当前 Live2D 模型（如果有）
            if (currentModel && pixiApp) {
              pixiApp.stage.removeChild(currentModel);
              currentModel.destroy({ children: true, texture: true, baseTexture: true });
              currentModel = null;
              modelBaseW = 0;
              modelBaseH = 0;
            }
            ParamDriver.stop();
            stopBongocatInteraction();
            showCSSFallback();
            showBubble('已恢复默认灵汐造型！', 3000);
            return;
          }

          // modelInfo 已包含完整模型信息，无需再查询
          const model = modelInfo;
          // 判断是否为 3D(MMD/PMX) 模型：优先用 type 标记，退化为按扩展名识别
          const isMMD = (m) => !!(m && (m.type === 'MMD' || /\.(pmx|pmd)$/i.test(m.modelFile || '')));

          if (isMMD(model)) {
            // 切换到 3D(MMD) 模型
            loadingText.textContent = '正在更换模型...';
            loading.style.display = 'block';
            loading.style.opacity = '1';
            const success = await loadMMDModel(model);
            if (success) {
              hideLoading();
              PetBrain.syncIdleCombo(model || fullModel);
              showBubble('换了个新造型！好看吗？', 3000);
            } else {
              showCSSFallback();
              showBubble('模型加载失败，显示备用形象', 3000);
            }
            return;
          }

          if (model && model.modelFile) {
            console.log('[model:changed] Live2D分支, currentPetType=', currentPetType,
              'useLive2D=', useLive2D, 'modelFile=', model.modelFile);
            // 从 MMD 切回 Live2D：先销毁 MMD 实例，恢复 canvas 状态
            if (currentPetType === 'MMD') {
              teardownMMD();
              // 关键修复：teardownMMD 隐藏了 mmdCanvas 但未恢复 live2d-canvas 的可见性。
              // MMD 加载时 canvas 被 display:none（第1997行），切回 Live2D 必须显式恢复，
              // 否则 PIXI 在不可见/脱离 DOM 的画布上创建 WebGL 上下文，导致模型"看不见"。
              if (canvas) {
                canvas.style.display = 'block';
                // 确保 canvas 仍在 DOM 中（MMD 加载时 pixiApp.destroy(true) 可能移除了旧 canvas）
                if (!canvas.parentNode && container) {
                  container.insertBefore(canvas, container.firstChild);
                }
              }
              // pixiApp 已被 MMD 加载时销毁（第2008行），置空避免残留引用
              if (pixiApp) { try { pixiApp.destroy({ children: true, texture: true, baseTexture: true }); } catch(e) {} pixiApp = null; }
              currentModel = null; modelBaseW = 0; modelBaseH = 0;
            }
            if (!useLive2D) {
              showBubble('Live2D引擎未加载，暂时无法换装', 3000);
              return;
            }
            loadingText.textContent = '正在更换模型...';
            loading.style.display = 'block';
            loading.style.opacity = '1';
            currentModelInfo = model; // 保存完整模型信息（含 installPath），供 discoverMotions/Expressions 兜底扫描用
            const success = await loadModel(model.modelFile, model.format);
            console.log('[model:changed] loadModel 返回:', success,
              'currentModel=', !!currentModel, 'canvas.display=', canvas?.style.display);
            if (window.__debugLog) window.__debugLog('loadModel返回=' + success + ' currentModel=' + !!currentModel + ' canvas=' + canvas?.style.display);
            if (success) {
              hideLoading();
              PetBrain.syncIdleCombo(model || fullModel);
              // ★ BongoCat 模型：自动启动键盘猫特殊交互（鼠标跟随+打字响应+键盘叠加层）
              // 修复：之前只依赖 model.isBongocat 注册表字段，如果导入时识别错误（isBongocat=false），
              // 即使模型有 resources/left-keys/ 键盘图片也不会启动键盘叠加层 → "只显示人物不显示键盘"。
              // 现在重新检测：调用 bongocatGetKeyImages 扫描模型目录，如果有键盘图片就强制启动 BongoCat 模式。
              const modelDir = model && model.installPath;
              const hasBongocatFlag = model && model.isBongocat === true;
              if (hasBongocatFlag) {
                // 注册表已标记为 BongoCat，直接启动
                setTimeout(() => { startBongocatMode(); }, 200);
                showBubble('BongoCat 键盘猫已启动！打字和鼠标移动会有响应', 3500);
              } else if (modelDir && window.api && window.api.bongocatGetKeyImages) {
                // 注册表未标记，但重新检测是否有键盘图片
                try {
                  const keyImages = await window.api.bongocatGetKeyImages(modelDir);
                  const hasKeys = (keyImages.left && keyImages.left.length > 0) || (keyImages.right && keyImages.right.length > 0);
                  if (hasKeys) {
                    console.log('[model:changed] 检测到键盘图片，强制启动 BongoCat 模式（注册表 isBongocat=' + model.isBongocat + '）');
                    if (model) model.isBongocat = true; // 修正注册表字段
                    setTimeout(() => { startBongocatMode(); }, 200);
                    showBubble('BongoCat 键盘猫已启动！打字和鼠标移动会有响应', 3500);
                  } else {
                    showBubble('换了个新造型！好看吗？', 3000);
                  }
                } catch (e) {
                  console.warn('[model:changed] 检测键盘图片失败:', e.message);

        return out.join('\n');
      } catch(e) { return 'TEXDIAG ERROR: ' + e.message + '\n' + e.stack; }
    };

    // ★ Drawable 顶点边界框诊断：检查每个 drawable 的实际渲染位置和大小
    // 这可以帮助确定哪些 drawable 实际渲染到了屏幕上，哪些在屏幕外或大小为 0
    window.__debugDrawableBounds = function() {
      try {
        if (!currentModel || !currentModel.internalModel) return 'NO MODEL';
        var im = currentModel.internalModel;
        var cm = im.coreModel;
        if (!cm) return 'NO CORE MODEL';
        var out = [];
        var drawableCount = typeof im.getDrawableCount === 'function' ? im.getDrawableCount() : (cm._$5S && cm._$5S._$aS ? cm._$5S._$aS.length : 0);
        out.push('=== Drawable Bounds Diagnostic ===');
        out.push('drawableCount=' + drawableCount);
        out.push('canvas size=' + pixiApp.renderer.width + 'x' + pixiApp.renderer.height);
        out.push('model scale=' + currentModel.scale.x.toFixed(4) + ',' + currentModel.scale.y.toFixed(4));
        out.push('model pos=' + currentModel.x.toFixed(1) + ',' + currentModel.y.toFixed(1));

        // 统计
        var onScreen = 0, offScreen = 0, zeroSize = 0, hasPoints = 0, noPoints = 0;
        var totalArea = 0;
        var boundsList = [];

        for (var di = 0; di < drawableCount; di++) {
          try {
            // 获取变换后顶点
            var points = null;
            if (typeof cm.getTransformedPoints === 'function') {
              points = cm.getTransformedPoints(di);
            }
            if (!points || points.length === 0) {
              noPoints++;
              boundsList.push({idx: di, error: 'no points', opacity: cm._$5S && cm._$5S._$8b ? (cm._$5S._$8b[di] ? cm._$5S._$8b[di]._$7s : 'N/A') : 'N/A'});
              continue;
            }
            hasPoints++;
            // 计算边界框（顶点是模型坐标系，需要转换为屏幕坐标系）
            var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (var pi = 0; pi < points.length; pi += 2) {
              var px = points[pi], py = points[pi + 1];
              if (px < minX) minX = px;
              if (py < minY) minY = py;
              if (px > maxX) maxX = px;
              if (py > maxY) maxY = py;
            }
            var w = maxX - minX, h = maxY - minY;
            var area = w * h;
            if (w < 0.01 || h < 0.01) {
              zeroSize++;
            }
            totalArea += area;

            // 获取 drawable 信息
            var ddInfo = {};
            if (cm._$5S && cm._$5S._$aS && cm._$5S._$aS[di]) {
              var aS = cm._$5S._$aS[di];
              ddInfo.textureIndex = aS._$LP;
              ddInfo.culling = aS.culling;
              ddInfo.clipID = aS.clipID;
            }
            if (cm._$5S && cm._$5S._$8b && cm._$5S._$8b[di]) {
              var r8b = cm._$5S._$8b[di];
              ddInfo.baseOpacity = r8b.baseOpacity;
              ddInfo.finalOpacity = r8b._$7s;
              ddInfo.visible = r8b._$IS ? r8b._$IS[0] : 'N/A';
            }

            boundsList.push({
              idx: di,
              minX: minX.toFixed(1), minY: minY.toFixed(1),
              maxX: maxX.toFixed(1), maxY: maxY.toFixed(1),
              w: w.toFixed(1), h: h.toFixed(1),
              area: area.toFixed(0),
              info: ddInfo
            });
          } catch(e) {
            boundsList.push({idx: di, error: e.message});
          }
        }

        out.push('\n=== Summary ===');
        out.push('hasPoints=' + hasPoints + ' noPoints=' + noPoints);
        out.push('zeroSize=' + zeroSize);
        out.push('totalArea(model coords)=' + totalArea.toFixed(0));
        out.push('avgArea=' + (hasPoints > 0 ? (totalArea / hasPoints).toFixed(0) : 0));

        // 按面积排序，输出最大的 20 个和最小的 10 个
        boundsList.sort(function(a, b) { return (b.area || 0) - (a.area || 0); });
        out.push('\n=== Top 20 by area ===');
        for (var ti = 0; ti < Math.min(20, boundsList.length); ti++) {
          var b = boundsList[ti];
          out.push('  [' + b.idx + '] bbox=(' + b.minX + ',' + b.minY + ')-(' + b.maxX + ',' + b.maxY + ') size=' + b.w + 'x' + b.h + ' area=' + b.area +
            (b.info ? ' tex=' + b.info.textureIndex + ' finalOp=' + b.info.finalOpacity + ' vis=' + b.info.visible : '') +
            (b.error ? ' ERROR=' + b.error : ''));
        }
        out.push('\n=== Bottom 10 by area ===');
        for (var bi = Math.max(0, boundsList.length - 10); bi < boundsList.length; bi++) {
          var b2 = boundsList[bi];
          out.push('  [' + b2.idx + '] bbox=(' + b2.minX + ',' + b2.minY + ')-(' + b2.maxX + ',' + b2.maxY + ') size=' + b2.w + 'x' + b2.h + ' area=' + b2.area +
            (b2.info ? ' tex=' + b2.info.textureIndex + ' finalOp=' + b2.info.finalOpacity + ' vis=' + b2.info.visible : '') +
            (b2.error ? ' ERROR=' + b2.error : ''));
        }

        // 检查核心方法
        out.push('\n=== Core Methods ===');
        out.push('getTransformedPoints=' + (typeof cm.getTransformedPoints === 'function' ? 'exists' : 'MISSING'));
        out.push('getDrawData=' + (typeof cm.getDrawData === 'function' ? 'exists' : 'MISSING'));
        out.push('getIndexArray=' + (typeof cm.getIndexArray === 'function' ? 'exists' : 'MISSING'));
        out.push('setMatrix.toString()=' + (typeof cm.setMatrix === 'function' ? cm.setMatrix.toString().substring(0, 100) : 'MISSING'));
        out.push('setTransform.toString()=' + (typeof cm.setTransform === 'function' ? cm.setTransform.toString().substring(0, 100) : 'MISSING'));
        out.push('draw.toString()=' + (typeof cm.draw === 'function' ? cm.draw.toString().substring(0, 100) : 'MISSING'));

        return out.join('\n');
      } catch(e) { return 'BOUNDS ERROR: ' + e.message + '\n' + e.stack; }
    };

    // ★★★ 完全干净的测试加载函数：只用标准 pixi-live2d-display 方式，不添加任何 patch
    // 用于验证模型本身能否正常显示，排除我们添加的各种 patch 导致的渲染错乱
    window.__debugLoadModelClean = async function(fullPath) {
      try {
        console.log('[CLEAN LOAD] 开始干净加载:', fullPath);
        // 销毁当前模型
        if (currentModel) {
          try { pixiApp.stage.removeChild(currentModel); } catch(e) {}
          try { currentModel.destroy({ children: true, texture: true, baseTexture: true }); } catch(e) {}
          currentModel = null;
        }
        // 清空 stage
        while (pixiApp.stage.children.length > 0) {
          try { pixiApp.stage.removeChildAt(0); } catch(e) { break; }
        }
        // 标准加载方式
        const url = modelPathToUrl(fullPath);
        const model = await PIXI.live2d.Live2DModel.from(url, { autoInteract: false });
        console.log('[CLEAN LOAD] 模型创建成功, 尺寸:', model.width, 'x', model.height);
        // 基本缩放和定位（窗口底部居中）
        const winW = window.innerWidth || 320;
        const winH = window.innerHeight || 460;
        const baseW = model.internalModel ? model.internalModel.width : model.width;
        const baseH = model.internalModel ? model.internalModel.height : model.height;
        const marginX = winW * 0.04;
        const marginY = winH * 0.03;
        const availW = Math.max(1, winW - marginX * 2);
        const availH = Math.max(1, winH - marginY * 2);
        const scale = Math.min(availW / baseW, availH / baseH);
        model.pivot.set(baseW / 2, baseH / 2);
        model.scale.set(scale);
        model.x = winW / 2;
        model.y = winH - (baseH * scale) / 2 - marginY;
        pixiApp.stage.addChild(model);
        currentModel = model;
        window.currentModel = model;
        console.log('[CLEAN LOAD] ✓ 干净加载完成! scale=' + scale.toFixed(3) +
          ' pos=' + model.x.toFixed(1) + ',' + model.y.toFixed(1) +
          ' base=' + baseW + 'x' + baseH);
        return true;
      } catch(e) {
        console.error('[CLEAN LOAD] 失败:', e.message, e.stack);
        return false;
      }
    };

    init().catch(err => {
      console.error('Failed to initialize:', err);
      loadingText.textContent = '初始化失败，请检查网络连接';
    });
  })();
