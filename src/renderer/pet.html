    // 运行时兜底：IPC 扫描模型目录注入 expressions
    async function discoverExpressionsFallback() {
      try {
        if (!window.api || !window.api.scanLive2DDir) return;
        const scan = await window.api.scanLive2DDir(currentModelInfo.installPath);
        if (!scan || !scan.expressions || scan.expressions.length === 0) return;
        const im = currentModel?.internalModel;
        if (!im || !im.settings) return;
        // ★ Cubism2：settings.expressions = [{ name, file }]（小写）；Cubism4：FileReferences.Expressions = [{ Name, File }]
        const isCubism2 = (im.constructor && im.constructor.name === 'Cubism2InternalModel') ||
          typeof im.settings.moc === 'string';
        const newDefs = [];
        if (isCubism2) {
          if (!Array.isArray(im.settings.expressions)) im.settings.expressions = [];
          const hasName = (n) => im.settings.expressions.some(x => x && x.name === n);
          for (const e of scan.expressions) {
            if (!hasName(e.Name)) {
              im.settings.expressions.push({ name: e.Name, file: e.file });
              newDefs.push({ name: e.Name, file: e.file });
            }
          }
        } else {
          if (!im.settings.FileReferences) im.settings.FileReferences = {};
          if (!Array.isArray(im.settings.FileReferences.Expressions)) im.settings.FileReferences.Expressions = [];
          const hasName = (n) => im.settings.FileReferences.Expressions.some(x => x && x.Name === n);
          for (const e of scan.expressions) {
            if (!hasName(e.Name)) {
              im.settings.FileReferences.Expressions.push({ Name: e.Name, File: e.file });
              newDefs.push({ Name: e.Name, File: e.file });
            }
          }
        }
        if (newDefs.length === 0) return;

        // 如果 expressionManager 已存在，把新 definition 同步进它的 definitions（键形随运行时）
        const em = im.motionManager?.expressionManager;
        const emHas = (n) => em && Array.isArray(em.definitions) && em.definitions.some(x => x && (x.Name === n || x.name === n));
        for (const d of newDefs) {
          const dName = d.Name || d.name;
          if (!emHas(dName)) em?.definitions?.push(d);
          availableExpressions.push(dName);
        }
        console.log('[Pet] 兜底扫描发现表情:', availableExpressions);
      } catch (e) { /* 静默 */ }
    }

    // Live2D 动作/表情的中文友好别名（仅作展示优化，模型真实名字仍作为值使用）。
    // 覆盖常见初音未来等模型的命名，让「拿葱/唱歌/比心/大小变/前倾/圈圈/哭哭/脸红」直观可见。
    const L2D_ALIASES = {
      // 动作组
      'negi': '拿葱', 'negipon': '拿葱', 'onion': '拿葱', 'greenonion': '拿葱', 'green onion': '拿葱',
      'sing': '唱歌', 'song': '唱歌', 'vocal': '唱歌', 'music': '唱歌', 'live': '唱歌',
      'heart': '比心', 'love': '比心', 'pien': '比心', 'piyo': '比心',
      'size': '大小变', 'scale': '大小变', 'big': '大小变', 'small': '大小变', 'resize': '大小变',
      'lean': '前倾', 'forward': '前倾', 'tilt': '前倾', 'leanforward': '前倾', 'motto': '前倾',
      'miku': '初音', 'mikumiku': '初音舞', 'dance': '跳舞',
      // 表情
      'circle': '圈圈', 'maru': '圈圈', '○': '圈圈', 'mark': '圈圈',
      'cry': '哭哭', 'tears': '哭哭', 'nai': '哭哭', 'naisho': '哭哭',
      'blush': '脸红', 'sekimen': '脸红', 'red': '脸红', 'redface': '脸红', 'shy': '脸红'
    };

    // 取展示名：有别名用别名，否则原样返回（兼容任意模型任意命名）
    function l2dLabel(name) {
      if (!name) return name;
      const key = String(name).toLowerCase().trim();
      return L2D_ALIASES[key] || name;
    }

    // 返回当前模型「可作为小键盘/面板触发」的有序动作列表：先动作组，后表情。
    // 这样初音未来等模型会自然呈现：拿葱/唱歌/比心/大小变/前倾（动作）+ 圈圈/哭哭/脸红（表情）。
    function getLive2DActions() {
      const out = [];
      const groups = Object.keys(availableMotions).filter(g => (availableMotions[g] || 0) > 0);
      for (const g of groups) out.push({ type: 'motion', label: l2dLabel(g), value: g });
      for (const e of availableExpressions) out.push({ type: 'expr', label: l2dLabel(e), value: e });
      return out;
    }

    // ===== 检测模型自带的键盘/打字相关动作组（bongocat 等模型通常自带 type/keyboard/tap 等组）=====
    // 不自己写打字逻辑，而是用模型自带的动作。按名称关键词匹配，优先级从高到低。
    let keyboardMotionGroups = []; // 检测到的键盘相关动作组名（按匹配优先级排序）
    const KEYBOARD_KEYWORDS = [
      // 英文关键词（优先级从高到低）
      /^type$/i, /^typing$/i, /^keyboard$/i, /^key_input$/i, /^keyinput$/i, /^keypress$/i,
      /^tap$/i, /^flick$/i, /^input$/i, /^write$/i, /^writing$/i, /^press$/i,
      /type/i, /typing/i, /keyboard/i, /key_input/i, /keyinput/i, /keypress/i,
      /tap/i, /flick/i, /input/i, /write/i, /writing/i, /press/i,
      // 中文/日文关键词
      /打[字击]/, /键盘/, /按键/, /敲/, /入力/, /キーボード/, /タイプ/, /タップ/
    ];
    function detectKeyboardMotions() {
      keyboardMotionGroups = [];
      const groups = Object.keys(availableMotions).filter(g => (availableMotions[g] || 0) > 0);
      // 按关键词优先级排序匹配
      for (const kw of KEYBOARD_KEYWORDS) {
        for (const g of groups) {
          if (kw.test(g) && !keyboardMotionGroups.includes(g)) {
            keyboardMotionGroups.push(g);
          }
        }
      }
      // 如果没检测到键盘专用组，把所有动作组作为兜底（至少模型会动）
      if (keyboardMotionGroups.length === 0) {
        keyboardMotionGroups = groups.slice();
      }
      console.log('[Pet] 检测到键盘/打字相关动作组:', keyboardMotionGroups);
    }

    // ===== Bongocat 特殊模型交互：鼠标跟随 + 直接参数控制打字手势 =====
    // 该模型有专用参数：ParamMouseX/Y、ParamMouseLeftDown/RightDown、CatParamLeftHandDown
    // 没有动作组(Motions)，必须用直接参数控制。对所有Live2D模型尝试，参数不存在则安全忽略。
    let bongoInteractionActive = false;
    let bongoMouseX = 0, bongoMouseY = 0; // 归一化鼠标位置 -1~1
    let bongoMouseInWindow = true; // 鼠标是否在窗口内（避免窗口内mousemove和全局mousemove重复计算导致跳动）
    let bongoLeftDown = 0, bongoRightDown = 0; // 鼠标左右键按下状态
    let bongoHandTap = 0; // 左手敲击键盘强度 0~1（兼容旧逻辑）
    let bongoLeftHandTap = 0; // 左手敲击强度 0~1
    let bongoRightHandTap = 0; // 右手敲击强度 0~1
    // ★ 左手/右手按键状态跟踪：释放后保持300ms再缩回
    let bongoLeftKeyDownCount = 0; // 当前按下的左手按键数量
    let bongoRightKeyDownCount = 0; // 当前按下的右手按键数量
    let bongoLeftLastUpTime = 0; // 最后一次左手按键释放时间（ms）
    let bongoRightLastUpTime = 0; // 最后一次右手按键释放时间（ms）
    const BONGO_HAND_HOLD_MS = 300; // 按键释放后手保持按下的时间（ms）
    let bongoLeftHandX = -0.5; // 左手 x 位置 -1~1（-1 最左，1 最右）
    let bongoRightHandX = 0.5; // 右手 x 位置 -1~1
    let bongoKeyOverlay = null; // 键盘叠加层容器（PIXI.Container），全屏覆盖显示当前按下的键的图片
    let bongoKeyTextures = {}; // 键盘按键图片纹理 {code: PIXI.Texture}
    let bongoKeySprites = {}; // 当前按下的键的精灵 {keyName: PIXI.Sprite}
    let bongoKeyImages = {}; // ★ 支持的键映射 {keyName: 图片绝对路径}，参考 ayangweb/BongoCat 实现
    let bongoDefaultKeyName = null; // ★ 默认显示的键盘图片键名（键盘一直显示）
    let bongoBackgroundSprite = null; // ★ 背景图片 PIXI sprite，和模型用同样的坐标系，自动对齐
    let bongoSavedModelAnchor = null; // ★ 保存模型原来的锚点，Bongocat模式下改为0.5，退出时恢复
    let bongoSavedModelPos = null; // ★ 保存模型原来的位置，Bongocat模式下改为窗口中心，退出时恢复
    let bongoSavedModelScale = null; // ★ 保存模型原来的缩放，Bongocat模式下重新计算，退出时恢复
    let bongoDestroyed = false; // ★ 销毁标志位：防止异步回调访问已销毁的对象导致崩溃
    let bongoFrameCount = 0; // 用于日志节流
    let bongoParamIds = new Set(); // 当前模型真实存在的参数 ID 集合，避免对不存在参数调用核心导致崩溃
    let bongoParamMap = null; // ★ 参数名智能匹配结果，解决不同模型参数名不同导致特性失效的问题
    let bongoRafId = 0;       // requestAnimationFrame id（已弃用，保留兼容），用于清理
    let bongoEventListeners = []; // [{type, listener}] 事件监听器引用，用于 stopBongocatInteraction 清理
    // ★ 自然眨眼状态：模拟 Live2D 自带的 eyeBlink，避免疯狂眨眼
    let bongoNextBlinkTime = 0;    // 下一次眨眼的时间戳（ms）
    let bongoBlinkState = 0;       // 0=空闲(睁眼) 1=闭眼中 2=睁眼中
    let bongoBlinkStartTime = 0;   // 当前眨眼阶段开始时间
    const BONGO_BLINK_CLOSE_MS = 80;   // 闭眼耗时（ms）
    const BONGO_BLINK_OPEN_MS = 120;   // 睁眼耗时（ms）
    const BONGO_BLINK_INTERVAL_MIN = 2500; // 眨眼最小间隔（ms）
    const BONGO_BLINK_INTERVAL_MAX = 5000; // 眨眼最大间隔（ms）
    let bongoOrigUpdate = null;   // bongocat 覆写前的 internalModel.update，用于恢复
    let bongoTickerCallbackRef = null; // PIXI ticker 回调引用，用于 stopBongocatInteraction 清理

    function stopBongocatInteraction() {
      if (!bongoInteractionActive && !bongoKeyOverlay) return;
      bongoInteractionActive = false;
      bongoDestroyed = true; // ★ 设置销毁标志，防止异步回调继续执行
      bongoParamIds.clear();
      bongoParamMap = null; // 重置参数名匹配结果，避免模型切换后残留
      // ★ 重置自然眨眼状态
      bongoNextBlinkTime = 0;
      bongoBlinkState = 0;
      bongoBlinkStartTime = 0;
      // ★ 恢复点击穿透设置（startBongocatMode 中根据用户设置应用了，退出时重新应用确保状态正确）
      try {
        const userClickThrough = !!(petConfig && petConfig.pet && petConfig.pet.clickThrough);
        if (userClickThrough) {
          if (window.api && typeof window.api.setPetIgnoreMouseEvents === 'function') {
            window.api.setPetIgnoreMouseEvents(true, false);
          }
          container.style.pointerEvents = 'none';
          dynamicClickThrough = false;
          isCapturingMouse = false;
        } else {
          if (window.api && typeof window.api.setPetIgnoreMouseEvents === 'function') {
            window.api.setPetIgnoreMouseEvents(true, true);
          }
          container.style.pointerEvents = 'auto';
          dynamicClickThrough = true;
          isCapturingMouse = false;
        }
      } catch (e) {}
      // 取消遗留的 rAF（兼容旧逻辑）
      if (bongoRafId) {
        try { cancelAnimationFrame(bongoRafId); } catch (e) {}
        bongoRafId = 0;
      }
      // ★ 移除事件监听器：之前只取消 rAF 不移除 listener，每次重载 bongocat 模型都会
      // 叠加一组 mousemove/mousedown/mouseup/contextmenu 监听器，多轮后数十个监听器
      // 同时触发，可能导致渲染进程卡死/崩溃。
      for (var i = 0; i < bongoEventListeners.length; i++) {
        try { window.removeEventListener(bongoEventListeners[i].type, bongoEventListeners[i].listener); } catch (e) {}
      }
      bongoEventListeners = [];
      // ★ 恢复 internalModel.update：bongocat 模式覆写了此方法注入参数设置，
      // 退出时必须恢复原方法，否则下一个模型会继承 bongocat 参数逻辑。
      if (bongoOrigUpdate && currentModel && currentModel.internalModel) {
        try { currentModel.internalModel.update = bongoOrigUpdate; } catch (e) {}
      }
      bongoOrigUpdate = null;
      // ★ 移除 PIXI ticker 回调（改用 ticker 后需要清理）
      if (bongoTickerCallbackRef && pixiApp && pixiApp.ticker) {
        try { pixiApp.ticker.remove(bongoTickerCallbackRef); } catch (e) {}
      }
      bongoTickerCallbackRef = null;
      // ★ 恢复模型原来的锚点、位置、缩放（Bongocat模式下改为画布中心居中，退出时恢复）
      if (currentModel && (bongoSavedModelAnchor || bongoSavedModelPos || bongoSavedModelScale)) {
        try {
          if (bongoSavedModelAnchor) currentModel.anchor.set(bongoSavedModelAnchor.x, bongoSavedModelAnchor.y);
          if (bongoSavedModelPos) currentModel.x = bongoSavedModelPos.x, currentModel.y = bongoSavedModelPos.y;
          if (bongoSavedModelScale) currentModel.scale.set(bongoSavedModelScale.x, bongoSavedModelScale.y);
          console.log('[Bongocat] ★ 模型显示方式已恢复:',
            'anchor=', currentModel.anchor.x.toFixed(3),
            'pos=', currentModel.x.toFixed(1), ',', currentModel.y.toFixed(1),
            'scale=', currentModel.scale.x.toFixed(3));
        } catch (e) {
          console.warn('[Bongocat] 恢复模型显示方式失败(忽略):', e.message);
        }
      }
      bongoSavedModelAnchor = null;
      bongoSavedModelPos = null;
      bongoSavedModelScale = null;
      // ★ 清理键盘叠加层（隐藏背景图片和按键图片）
      try {
        const bgImgEl = document.getElementById('bongo-background-image');
        if (bgImgEl) {
          bgImgEl.style.display = 'none';
          bgImgEl.src = '';
        }
        const keyImgEl = document.getElementById('bongo-key-image');
        if (keyImgEl) {
          keyImgEl.style.display = 'none';
          keyImgEl.src = '';
        }
      } catch (e) {
        console.warn('[Bongocat] 清理键盘叠加层异常:', e.message);
      }
      bongoKeyOverlay = null;
      bongoKeyTextures = {};
      bongoKeySprites = {};
      bongoKeyImages = {}; // ★ 重置支持的键映射
      bongoDefaultKeyName = null; // ★ 重置默认键盘图片
      // 重置左右手状态
      bongoLeftHandTap = 0;
      bongoRightHandTap = 0;
      console.log('[Bongocat] 交互模式已停止');
    }

    // 统一的参数设置函数：尝试多种API，返回是否成功
    // ★ 关键修复：先校验参数 ID 在当前模型中真实存在，再调用 Cubism 核心。
    // 对不存在的参数调用 setParameterValueById 在某些 Cubism4 核心实现中会触发 native 断言/崩溃。
    function setLive2DParam(id, value) {
      if (!bongoInteractionActive || !bongoParamIds.has(id)) return false;
      if (!currentModel || !currentModel.internalModel) return false;
      // ★ 防崩溃：拒绝 NaN/Infinity，避免 Cubism 核心 native 崩溃
      if (typeof value !== 'number' || !isFinite(value)) return false;
      const im = currentModel.internalModel;
      const core = im.coreModel;
      try {
        // 方式1: Cubism4 coreModel.setParameterValueById
        if (core && typeof core.setParameterValueById === 'function') {
          core.setParameterValueById(id, value);
          return true;
        }
      } catch(e) {}
      try {
        // 方式2: 通过 internalModel.parameters 数组
        if (im.parameters && Array.isArray(im.parameters)) {
          const p = im.parameters.find(x => x && (x.id === id || x.name === id));
          if (p) { p.value = value; return true; }
        }
      } catch(e) {}
      try {
        // 方式3: coreModel._parameters 数组
        if (core && core._parameters && Array.isArray(core._parameters)) {
          const p = core._parameters.find(x => x && (x.id === id || x.name === id));
          if (p) { p.value = value; return true; }
        }
      } catch(e) {}
      return false;
    }

    function setupBongocatInteraction(allParams, isBongocat) {
      console.log('[BongoCat] ★ setupBongocatInteraction 被调用! isBongocat=', isBongocat,
        'allParams长度=', Array.isArray(allParams) ? allParams.length : 'not-array',
        'currentModelInfo=', currentModelInfo ? JSON.stringify({installPath: currentModelInfo.installPath}) : 'null');
      // ★ 只对 Bongocat 模型启动特殊交互，普通模型不启动（避免覆盖正常参数导致加载不全）
      if (!isBongocat) {
        console.log('[Bongocat] 非Bongocat模型，跳过特殊交互');
        return;
      }
      // 先清理旧状态，防止模型切换后残留
      stopBongocatInteraction();
      bongoInteractionActive = true;
      bongoDestroyed = false; // 重置销毁标志

      // ★ Bongocat模式下调整模型显示方式，和参考程序 ayangweb/BongoCat 一致：
      // 参考程序 resizeModel: model.anchor.set(0.5); model.x = innerWidth/2; model.y = innerHeight/2;
      //   scale = Math.min(innerWidth/width, innerHeight/height)
      // 之前用内容边界居中（锚点根据内容计算），导致模型内容中心和背景图片中心不对齐。
      // 现在改为画布中心居中（锚点0.5），和背景图片(object-fit:cover)自动对齐。
      // ★ 诊断：暂时禁用模型显示方式调整，确认是否是 scale/position/pivot 调整导致的闪烁
      if (false) {
        console.log('[Bongocat] ★ 诊断：跳过模型显示方式调整，使用干净加载的设置');
      } else if (currentModel) {
        try {
          // 保存原来的锚点、位置、缩放，退出时恢复
          bongoSavedModelAnchor = { x: currentModel.anchor.x, y: currentModel.anchor.y };
          bongoSavedModelPos = { x: currentModel.x, y: currentModel.y };
          bongoSavedModelScale = { x: currentModel.scale.x, y: currentModel.scale.y };

          const im = currentModel.internalModel;
          const canvasW = im ? (im.width || currentModel.width || 1280) : (currentModel.width || 1280);
          const canvasH = im ? (im.height || currentModel.height || 1280) : (currentModel.height || 1280);
          const winW = window.innerWidth || 354;
          const winH = window.innerHeight || 506;

          // 和参考程序一致：缩放取较小值，pivot 设为画布中心，位置窗口中心
          // ★ 修复：Live2DModel 继承 PIXI.Container，没有 anchor 属性，anchor.set() 无效。
          // 必须用 pivot.set(canvasW/2, canvasH/2) 才能正确设置中心点。之前用 anchor.set(0.5)
          // 导致 pivot 仍是干净加载时设置的值，但 scale/position 被覆盖，渲染状态异常 → 部件闪烁。
          const scaleX = winW / canvasW;
          const scaleY = winH / canvasH;
          const scale = Math.min(scaleX, scaleY);
          currentModel.pivot.set(canvasW / 2, canvasH / 2);
          currentModel.scale.set(scale);
          currentModel.x = winW / 2;
          currentModel.y = winH / 2;

          console.log('[Bongocat] ★ 模型显示方式已调整（和参考程序一致）:',
            'canvas=', canvasW, 'x', canvasH,
            'win=', winW, 'x', winH,
            'scale=', scale.toFixed(3),
            'pivot=', (canvasW/2).toFixed(1) + ',' + (canvasH/2).toFixed(1),
            'pos=', currentModel.x.toFixed(1), ',', currentModel.y.toFixed(1));

          // ★ 背景图片的大小和位置和模型完全一致（使用模型的实际位置，而不是容器中心）
          // 模型锚点0.5，位置 currentModel.x/y；背景图片锚点左上角，所以位置 = currentModel.x/y - 一半大小
          const bgImgEl = document.getElementById('bongo-background-image');
          if (bgImgEl) {
            const bgW = canvasW * scale;
            const bgH = canvasH * scale;
            const bgX = currentModel.x - bgW / 2;
            const bgY = currentModel.y - bgH / 2;
            bgImgEl.style.width = bgW + 'px';
            bgImgEl.style.height = bgH + 'px';
            bgImgEl.style.left = bgX + 'px';
            bgImgEl.style.top = bgY + 'px';
            bgImgEl.style.objectFit = 'cover';
            console.log('[Bongocat] ★ 背景图片大小位置已设置（和模型一致）:',
              'modelPos=', currentModel.x.toFixed(1), ',', currentModel.y.toFixed(1),
              'size=', bgW.toFixed(1), 'x', bgH.toFixed(1),
              'pos=', bgX.toFixed(1), ',', bgY.toFixed(1));
          }
          // ★ 按键图片的大小和位置也和模型一致
          const keyImgEl = document.getElementById('bongo-key-image');
          if (keyImgEl) {
            const keyW = canvasW * scale;
            const keyH = canvasH * scale;
            const keyX = currentModel.x - keyW / 2;
            const keyY = currentModel.y - keyH / 2;
            keyImgEl.style.width = keyW + 'px';
            keyImgEl.style.height = keyH + 'px';
            keyImgEl.style.left = keyX + 'px';
            keyImgEl.style.top = keyY + 'px';
            keyImgEl.style.objectFit = 'cover';
          }
        } catch (e) {
          console.warn('[Bongocat] 调整模型显示方式失败(忽略):', e.message);
        }
      }

      // 记录当前模型真实存在的参数 ID，后续 setLive2DParam 只设置这些参数
      bongoParamIds.clear();
      if (Array.isArray(allParams)) {
        for (const id of allParams) {
          if (id) bongoParamIds.add(id);
        }
      }
      console.log('[Bongocat] ★ 启动Bongocat特殊交互模式, paramIds=', bongoParamIds.size);

      // ★ Bongocat模式下隐藏AI输入框和右键功能区域（使用统一标志 window.isBongocatMode）
      try {
        window.isBongocatMode = true;
        const inputArea = document.getElementById('input-area');
        if (inputArea) {
          inputArea.style.display = 'none';
          inputArea.classList.remove('show');
        }
        const actionMenu = document.getElementById('action-menu');
        if (actionMenu) {
          actionMenu.style.display = 'none';
          actionMenu.classList.remove('show');
        }
        // 点击穿透已在 startBongocatMode 中根据用户设置应用，此处不再重复设置
        console.log('[Bongocat] 已隐藏UI，点击穿透设置保持用户选择（全局鼠标跟随不受影响）');
      } catch(e) {}

      // ★ 事件监听器：使用具名函数并存储引用，stopBongocatInteraction 时逐一移除。
      // 之前用匿名函数且不移除，每次重载 bongocat 模型叠加一组 listener，
      // 多轮后数十个 listener 同时触发，可能拖垮渲染进程。
      // ★ 统一使用全局鼠标事件（主进程IPC发送屏幕坐标），移除窗口内mousemove
      // 窗口内mousemove在透明区域（点击穿透）不触发，导致"只能在模型上生效"
      // 全局事件不受点击穿透影响，鼠标在屏幕任意位置都能跟踪
      var mouseDownHandler = function(e) {
        if (!bongoInteractionActive) return;
        if (e.button === 0) bongoLeftDown = 1;
        if (e.button === 2) bongoRightDown = 1;
      };
      var mouseUpHandler = function(e) {
        if (!bongoInteractionActive) return;
        if (e.button === 0) bongoLeftDown = 0;
        if (e.button === 2) bongoRightDown = 0;
      };
      var contextMenuHandler = function(e) {
        if (bongoInteractionActive) e.preventDefault();
      };
      // window.addEventListener('mousemove', mouseMoveHandler); // 已移除，统一用全局事件
      // window.addEventListener('mouseleave', mouseLeaveHandler); // 已移除
      window.addEventListener('mousedown', mouseDownHandler);
      window.addEventListener('mouseup', mouseUpHandler);
      window.addEventListener('contextmenu', contextMenuHandler);
      bongoEventListeners = [
        // { type: 'mousemove', listener: mouseMoveHandler }, // 已移除，统一用全局鼠标事件
        { type: 'mousedown', listener: mouseDownHandler },
        { type: 'mouseup', listener: mouseUpHandler },
        { type: 'contextmenu', listener: contextMenuHandler }
      ];

      // ★ 参数名智能匹配：不同 BongoCat 模型的参数名可能不同，
      // 硬编码 'CatParamLeftHandDown' 等会导致参数设置静默失败 → 特性失效。
      // 这里根据关键词从模型真实参数列表中匹配出对应参数，确保全局生效。
      bongoParamMap = {
        leftHand: null,
        rightHand: null,
        leftHandX: null,
        leftHandY: null,
        rightHandX: null,
        rightHandY: null,
        mouseX: null,
        mouseY: null,
        eyeX: null,
        eyeY: null,
        angleX: null,
        angleY: null,
        mouseLeft: null,
        mouseRight: null,
        eyeLeftOpen: null,
        eyeRightOpen: null
      };
      function matchBongoParam(keywords) {
        for (const id of bongoParamIds) {
          if (!id) continue;
          const lower = String(id).toLowerCase();
          for (const kw of keywords) {
            if (lower.includes(kw.toLowerCase())) return id;
          }
        }
        return null;
      }
      bongoParamMap.leftHand = matchBongoParam(['lefthanddown', 'handleftdown', 'catparamlefthand', 'lefthand', 'handleft']);
      bongoParamMap.rightHand = matchBongoParam(['righthanddown', 'handrightdown', 'catparamrighthand', 'righthand', 'handright']);
      bongoParamMap.leftHandX = matchBongoParam(['lefthandx', 'handleftx', 'catparamlefthandx', 'lefthandposx']);
      bongoParamMap.leftHandY = matchBongoParam(['lefthandy', 'handlefty', 'catparamlefthandy', 'lefthandposy']);
      bongoParamMap.rightHandX = matchBongoParam(['righthandx', 'handrightx', 'catparamrighthandx', 'righthandposx']);
      bongoParamMap.rightHandY = matchBongoParam(['righthandy', 'handrighty', 'catparamrighthandy', 'righthandposy']);
      bongoParamMap.mouseX = matchBongoParam(['mousx', 'mouseposx', 'parammousex']);
      bongoParamMap.mouseY = matchBongoParam(['mousy', 'mouseposy', 'parammousey']);
      bongoParamMap.eyeX = matchBongoParam(['eyeballx', 'eyex', 'parameyeballx']);
      bongoParamMap.eyeY = matchBongoParam(['eyebally', 'eyey', 'parameyebally']);
      bongoParamMap.angleX = matchBongoParam(['paramanglex', 'bodyanglex', 'headanglex']);
      bongoParamMap.angleY = matchBongoParam(['paramangley', 'bodyangley', 'headangley']);
      bongoParamMap.mouseLeft = matchBongoParam(['mouseleftdown', 'leftclick', 'parammouseleft']);
      bongoParamMap.mouseRight = matchBongoParam(['mouserightdown', 'rightclick', 'parammouseright']);
      bongoParamMap.eyeLeftOpen = matchBongoParam(['eyelopen', 'lefteyeopen', 'parameyelopen']);
      bongoParamMap.eyeRightOpen = matchBongoParam(['eyeropen', 'righteyeopen', 'parameyeropen']);
      console.log('[BongoCat] ★ 参数名智能匹配结果:', JSON.stringify(bongoParamMap));
      // ★ 诊断：输出模型所有参数列表，帮助定位是否错误匹配到控制头发/部件可见性的参数
      try {
        const allParamList = [];
        for (const id of bongoParamIds) {
          if (id) allParamList.push(id);
        }
        console.log('[BongoCat] ★ 模型参数列表(共' + allParamList.length + '个):', allParamList.join(', '));
        // 检查是否有参数名包含 hair/opacity/visible 等可能控制部件可见性的关键词
        const suspiciousParams = allParamList.filter(id => {
          const lower = String(id).toLowerCase();
          return lower.includes('hair') || lower.includes('opacity') || lower.includes('visible') ||
                 lower.includes('cull') || lower.includes('hide') || lower.includes('show') ||
                 lower.includes('part') || lower.includes('draw');
        });
        if (suspiciousParams.length > 0) {
          console.log('[BongoCat] ★ 可疑参数(可能控制部件可见性):', suspiciousParams.join(', '));
        }
      } catch (e) { console.warn('[BongoCat] 参数诊断失败(忽略):', e.message); }

      // ★ 改用 PIXI ticker 后置回调设置参数，而不是覆写 internalModel.update
      // 覆写 update 可能干扰核心库的正常渲染循环，导致部件（头发等）闪烁/时有时无
      // ticker 回调在 internalModel.update 之后执行，确保参数注入与核心更新在同一帧内完成
      if (currentModel && currentModel.internalModel && pixiApp && pixiApp.ticker) {
        var bongoTickerCallback = function(delta) {
          // ★ 参数设置已移到 internalModel.update 中（model.update() 之前），确保参数值被正确应用
          // 这里留空，不再重复设置参数
        };
        // 使用较低优先级，确保在 internalModel.update 之后执行
        pixiApp.ticker.add(bongoTickerCallback, null, -10);
        bongoTickerCallbackRef = bongoTickerCallback;
        console.log('[Bongocat] ★ 已改用 PIXI ticker 后置回调设置参数（不覆写 update）');
      }

      console.log('[Bongocat] ★ Bongocat特殊交互模式已启动（PIXI ticker 同步参数更新）');

      // ★ 禁用模型的自动行为（呼吸/眨眼/焦点跟随/物理/姿势），这些会修改 ParamAngleX/Y/Z 等参数
      // 导致模型转动、头发等部件被剔除闪烁。之前设置 currentModel.eyeBlink 是错误的，
      // 正确的属性在 internalModel 上。
      try {
        const im = currentModel.internalModel;
        if (im) {
          // 禁用呼吸（会修改 ParamAngleX/Y/Z、ParamBodyAngleX、ParamBreath，导致头部摇来摇去）
          // ★ 完全禁用呼吸：用户说头老是摇来摇去，只想要头发动，但呼吸会导致头部摇动
          if (im.breath) {
            im.breath = null;
            console.log('[Bongocat] ★ 已禁用呼吸（breath）- 导致头部摇动');
          }
          // 覆写 updateNaturalMovements 为空函数，阻止呼吸
          im.updateNaturalMovements = function() {};
          console.log('[Bongocat] ★ 已禁用自然移动（updateNaturalMovements）');
          // 禁用模型自带的自动眨眼（自己实现可控的自然眨眼，避免疯狂眨眼）
          // ★ 自带 eyeBlink 眨眼频率不可控，已在 im.update 中自己实现自然眨眼（间隔2.5-5秒）
          if (im.eyeBlink) {
            im.eyeBlink = null;
            console.log('[Bongocat] ★ 已禁用模型自带 eyeBlink（改用自定义自然眨眼）');
          }
          // 禁用物理模拟
          // ★ 恢复物理模拟：物理模拟是头发自然飘动的原因！输入是 ParamAngleX/Y/Z，输出是头发相关参数
          // if (im.physics) { im.physics = null; console.log('[Bongocat] ★ 已禁用物理模拟（physics）'); }
          // 禁用姿势更新
          if (im.pose) {
            im.pose = null;
            console.log('[Bongocat] ★ 已禁用姿势更新（pose）');
          }
          // 禁用焦点跟随（会修改 ParamAngleX/Y/Z、ParamEyeBallX/Y、ParamBodyAngleX）
          // ★ 焦点跟随会导致大幅转动，保留禁用
          if (im.focusController) {
            im.focusController.x = 0;
            im.focusController.y = 0;
            im.updateFocus = function() {};
            console.log('[Bongocat] ★ 已禁用焦点跟随（focusController）');
          }
          // ★ 恢复呼吸：不再覆写 updateNaturalMovements 为空函数
          // im.updateNaturalMovements = function() {};

          // ★ 最彻底：覆写 internalModel.update，只保留核心模型更新，
          // 跳过所有动作/表情/眨眼/焦点/呼吸/物理/姿势，彻底排除参数被自动修改的可能
          // 参数设置在 model.update() 之前执行，确保参数值被正确应用
          bongoOrigUpdate = im.update.bind(im);
          // ★ 诊断：输出关键参数的范围，帮助定位左手不隐藏和方向反了的问题
          try {
            const core = im.coreModel;
            const diagParams = ['CatParamLeftHandDown', 'ParamMouseX', 'ParamMouseY', 'ParamEyeBallX', 'ParamEyeBallY', 'ParamAngleX', 'ParamAngleY', 'ParamAngleZ'];
            for (const pid of diagParams) {
              try {
                const idx = core.getParameterIndex ? core.getParameterIndex(pid) : -1;
                if (idx >= 0) {
                  const val = core.getParameterValueById ? core.getParameterValueById(pid) : '?';
                  const min = core.getParameterMinValueById ? core.getParameterMinValueById(pid) : '?';
                  const max = core.getParameterMaxValueById ? core.getParameterMaxValueById(pid) : '?';
                  console.log('[Bongocat] ★ 参数诊断:', pid, 'idx=', idx, 'val=', val, 'min=', min, 'max=', max);
                }
              } catch(e) {}
            }
          } catch(e) {}

          im.update = function(dt) {
            if (bongoDestroyed) {
              try { bongoOrigUpdate(dt); } catch (e) {}
              return;
            }
            try {
              // ★ 在 model.update() 之前设置参数，确保参数值被正确应用
              if (bongoInteractionActive && bongoParamMap) {
                const core = this.coreModel;
                // 辅助函数：根据参数范围和归一化值(-1~1)计算实际参数值
                // 鼠标在左(-1)→值=min，鼠标在右(1)→值=max
                function calcParamVal(id, normalized) {
                  try {
                    if (core && core.getParameterIndex && core.getParameterIndex(id) >= 0) {
                      const min = core.getParameterMinValueById ? core.getParameterMinValueById(id) : -1;
                      const max = core.getParameterMaxValueById ? core.getParameterMaxValueById(id) : 1;
                      const ratio = (normalized + 1) / 2; // -1~1 → 0~1
                      return min + ratio * (max - min);
                    }
                  } catch(e) {}
                  return normalized;
                }
                // ★ 不再强制保持眼睛睁开，恢复自动眨眼（自然状态）
                // 鼠标跟随：参考 BongoCat，根据参数范围计算值
                // Y 轴需要取反（Live2D Y轴向下为正，屏幕Y轴向下为正但参数含义相反）
                if (bongoParamMap.mouseX) setLive2DParam(bongoParamMap.mouseX, calcParamVal(bongoParamMap.mouseX, bongoMouseX));
                if (bongoParamMap.mouseY) setLive2DParam(bongoParamMap.mouseY, calcParamVal(bongoParamMap.mouseY, -bongoMouseY));
                if (bongoParamMap.eyeX) setLive2DParam(bongoParamMap.eyeX, calcParamVal(bongoParamMap.eyeX, bongoMouseX));
                if (bongoParamMap.eyeY) setLive2DParam(bongoParamMap.eyeY, calcParamVal(bongoParamMap.eyeY, -bongoMouseY));
                // ★ 自然眨眼：模拟 Live2D 自带 eyeBlink，间隔 2.5-5 秒，闭眼 80ms + 睁眼 120ms
                // 之前禁用 eyeBlink 导致完全不眨眼，现在自己实现可控的自然眨眼
                try {
                  const nowMs = performance.now();
                  let eyeOpenVal = 1; // 默认完全睁开
                  if (bongoBlinkState === 0) {
                    // 空闲状态：检查是否到眨眼时间
                    if (bongoNextBlinkTime === 0) {
                      bongoNextBlinkTime = nowMs + BONGO_BLINK_INTERVAL_MIN + Math.random() * (BONGO_BLINK_INTERVAL_MAX - BONGO_BLINK_INTERVAL_MIN);
                    } else if (nowMs >= bongoNextBlinkTime) {
                      bongoBlinkState = 1; // 开始闭眼
                      bongoBlinkStartTime = nowMs;
                    }
                  }
                  if (bongoBlinkState === 1) {
                    // 闭眼中：从 1 线性降到 0
                    const progress = Math.min((nowMs - bongoBlinkStartTime) / BONGO_BLINK_CLOSE_MS, 1);
                    eyeOpenVal = 1 - progress;
                    if (progress >= 1) {
                      bongoBlinkState = 2; // 开始睁眼
                      bongoBlinkStartTime = nowMs;
                    }
                  } else if (bongoBlinkState === 2) {
                    // 睁眼中：从 0 线性升到 1
                    const progress = Math.min((nowMs - bongoBlinkStartTime) / BONGO_BLINK_OPEN_MS, 1);
                    eyeOpenVal = progress;
                    if (progress >= 1) {
                      bongoBlinkState = 0; // 回到空闲
                      eyeOpenVal = 1;
                      bongoNextBlinkTime = nowMs + BONGO_BLINK_INTERVAL_MIN + Math.random() * (BONGO_BLINK_INTERVAL_MAX - BONGO_BLINK_INTERVAL_MIN);
                    }
                  }
                  // 设置左右眼开合度（1=睁开，0=闭上）
                  if (bongoParamMap.eyeLeftOpen) setLive2DParam(bongoParamMap.eyeLeftOpen, eyeOpenVal);
                  if (bongoParamMap.eyeRightOpen) setLive2DParam(bongoParamMap.eyeRightOpen, eyeOpenVal);
                } catch(e) {}
                // ★ 恢复 angleX/Y/Z 设置（根因已确认是自动行为，手动设置 angle 不会导致闪烁）
                if (bongoParamMap.angleX) setLive2DParam(bongoParamMap.angleX, calcParamVal(bongoParamMap.angleX, bongoMouseX));
                if (bongoParamMap.angleY) setLive2DParam(bongoParamMap.angleY, calcParamVal(bongoParamMap.angleY, -bongoMouseY));
                // 左手/右手：有按键按下时保持按下状态，否则立即收回
                // 左手
                if (bongoLeftKeyDownCount > 0) {
                  bongoLeftHandTap = 1; // 保持按下
                } else {
                  bongoLeftHandTap = 0; // 立即收回
                }
                // 右手
                if (bongoRightKeyDownCount > 0) {
                  bongoRightHandTap = 1; // 保持按下
                } else {
                  bongoRightHandTap = 0; // 立即收回
                }
                bongoHandTap = Math.max(bongoLeftHandTap, bongoRightHandTap);
                // 左手/右手敲击参数（直接设置 0~1，不经过范围计算）
                if (bongoParamMap.leftHand) setLive2DParam(bongoParamMap.leftHand, bongoLeftHandTap);
                if (bongoParamMap.rightHand) setLive2DParam(bongoParamMap.rightHand, bongoRightHandTap);
                // 左手/右手位置参数
                if (bongoParamMap.leftHandX) setLive2DParam(bongoParamMap.leftHandX, bongoLeftHandX);
                if (bongoParamMap.rightHandX) setLive2DParam(bongoParamMap.rightHandX, bongoRightHandX);
                // 鼠标按键响应
                if (bongoParamMap.mouseLeft) setLive2DParam(bongoParamMap.mouseLeft, bongoLeftDown);
                if (bongoParamMap.mouseRight) setLive2DParam(bongoParamMap.mouseRight, bongoRightDown);
              }
              // ★ 手动设置轻微的 ParamAngleX/Y/Z 变化，驱动物理模拟产生头发飘动
              // 幅度很小（±2度），不会导致头部明显摇动，但足够驱动物理模拟
              try {
                const model = this.coreModel;
                const now = performance.now() / 1000;
                // 轻微的头部角度变化，周期不同，产生自然的头发飘动
                const slightAngleX = Math.sin(now * 2 * Math.PI / 4.0) * 2; // ±2度，周期4秒
                const slightAngleY = Math.sin(now * 2 * Math.PI / 5.0) * 1.5; // ±1.5度，周期5秒
                const slightAngleZ = Math.sin(now * 2 * Math.PI / 6.0) * 1; // ±1度，周期6秒
                const slightBodyAngleX = Math.sin(now * 2 * Math.PI / 4.5) * 4; // 身子轻微起伏（增大幅度）
                // 设置 ParamAngleX/Y/Z（物理模拟的输入）
                try { model.setParameterValueById('ParamAngleX', slightAngleX); } catch(e) {}
                try { model.setParameterValueById('ParamAngleY', slightAngleY); } catch(e) {}
                try { model.setParameterValueById('ParamAngleZ', slightAngleZ); } catch(e) {}
                // 设置 ParamBodyAngleX（身子自然起伏）
                try { model.setParameterValueById('ParamBodyAngleX', slightBodyAngleX); } catch(e) {}
                // 设置 ParamBreath（轻微呼吸）
                try {
                  const breathIdx = model.getParameterIndex ? model.getParameterIndex('ParamBreath') : -1;
                  if (breathIdx >= 0) {
                    const breathVal = Math.sin(now * 2 * Math.PI / 3.2) * 0.25 + 0.25;
                    model.setParameterValueById('ParamBreath', breathVal);
                  }
                } catch(e) {}
                // ★ 物理模拟：根据 ParamAngleX/Y/Z 的变化产生头发/身体的自然飘动
                if (this.physics) {
                  try { this.physics.evaluate(model, dt); } catch(e) {}
                }
                // 核心模型更新
                model.update();
                model.loadParameters();
              } catch (e) {}
            } catch (e) {}
          };
          console.log('[Bongocat] ★ 已覆写 update（轻微角度驱动物理模拟-头发飘动，禁用眨眼/焦点/姿势/动作）');
        }
      } catch (e) { console.warn('[Bongocat] 禁用自动功能失败(忽略):', e.message); }

      // ★ 诊断：每隔 1 秒输出 drawable 可见性状态，定位头发时有时无的原因
      try {
        const im = currentModel.internalModel;
        if (im && im.coreModel && typeof im.coreModel.getDrawableCount === 'function') {
          const drawCount = im.coreModel.getDrawableCount();
          console.log('[Bongocat] ★ 模型 drawable 总数:', drawCount);
          // 输出前 20 个 drawable 的 ID，找到头发相关的 drawable
          if (typeof im.coreModel.getDrawableId === 'function') {
            const drawIds = [];
            for (let i = 0; i < Math.min(drawCount, 30); i++) {
              try { drawIds.push(im.coreModel.getDrawableId(i)); } catch(e) { drawIds.push('?'); }
            }
            console.log('[Bongocat] ★ 前30个 drawable ID:', drawIds.join(', '));
          }
        }
      } catch (e) { console.warn('[Bongocat] drawable 诊断失败(忽略):', e.message); }

      // ★ 键盘叠加层：参考 ayangweb/BongoCat 实现
      // 每个按键图片是**全屏覆盖的完整键盘布局**（只高亮那个键），不是排列成一行的小图标
      // 只显示当前按下的键的图片，按键释放时隐藏。之前错误地把所有小图标排列成一行，导致"黑块"
      // ★ 诊断：暂时禁用键盘叠加层和背景图片，确认是否是图片层遮挡导致的闪烁
      console.log('[Bongocat] ★ 已启用键盘叠加层和背景图片');
      if (true) {
      try {
        const modelDir = currentModelInfo && currentModelInfo.installPath;
        console.log('[Bongocat] 键盘叠加层初始化: modelDir=', modelDir, 'hasAPI=', !!(window.api && window.api.bongocatGetKeyImages));
        if (modelDir && window.api && window.api.bongocatGetKeyImages) {
          window.api.bongocatGetKeyImages(modelDir).then(keyImages => {
            if (bongoDestroyed || !bongoInteractionActive) return;
            try {
              console.log('[Bongocat] 键盘叠加层: 收到 keyImages=', JSON.stringify(keyImages).substring(0, 200));
              // 存储支持的键：键名（文件名不含扩展名）→ 图片绝对路径
              bongoKeyImages = {};
              const allKeys = (keyImages.left || []).concat(keyImages.right || []);
              for (const keyInfo of allKeys) {
                const fileName = keyInfo.file.split(/[\\/]/).pop().replace(/\.[^.]+$/, '');
                bongoKeyImages[fileName] = keyInfo.file;
              }
              console.log('[Bongocat] 键盘叠加层初始化完成，支持按键数:', Object.keys(bongoKeyImages).length,
                '示例:', Object.keys(bongoKeyImages).slice(0, 5).join(','));
              // ★ 显示 background.png 作为键盘背景（用 HTML <img> 标签，object-fit: cover，覆盖整个窗口）
              // 参考 ayangweb/BongoCat：背景图片用 class="object-cover"，覆盖整个窗口，和模型自动对齐
              if (modelDir) {
                const bgImgEl = document.getElementById('bongo-background-image');
                if (bgImgEl) {
                  const bgPath = modelDir.replace(/\\/g, '/') + '/resources/background.png';
                  const bgUrl = 'file:///' + bgPath;
                  bgImgEl.onload = () => {
                    console.log('[Bongocat] 键盘背景加载成功:', bgUrl,
                      'naturalWidth=', bgImgEl.naturalWidth, 'naturalHeight=', bgImgEl.naturalHeight);
                  };
                  bgImgEl.onerror = () => {
                    console.warn('[Bongocat] 键盘背景加载失败:', bgUrl);
                  };
                  bgImgEl.src = bgUrl;
                  bgImgEl.style.display = 'block';
                  console.log('[Bongocat] 键盘背景已设置:', bgUrl);
                }
              }
              // ★ 按键图片默认隐藏，按键时才显示
              const keyImgEl = document.getElementById('bongo-key-image');
              if (keyImgEl) {
                keyImgEl.style.display = 'none';
              }
            } catch (e) {
              console.error('[Bongocat] 键盘叠加层初始化失败:', e.message);
            }
          }).catch(e => {
            console.error('[Bongocat] 获取键盘图片列表失败:', e.message);
          });
        }
      } catch (e) {
        console.error('[Bongocat] 键盘叠加层初始化异常:', e.message);
      }
      } // ★ 诊断：if (false) 闭合
    }

    // ★ 把图片的白色背景变成透明（罗小黑等模型的键盘图片背景是白色的）
    // 使用 canvas 处理，把接近白色的像素设置为透明，这样键盘布局就能叠加在模型上方了
    function makeWhiteTransparent(img) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        let transparentCount = 0;
        // ★ 检测非白色像素（键盘内容）的边界框
        let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
        let contentCount = 0;
        for (let y = 0; y < img.height; y++) {
          for (let x = 0; x < img.width; x++) {
            const i = (y * img.width + x) * 4;
            const r = data[i], g = data[i+1], b = data[i+2];
            // ★ 基于颜色距离的透明化：计算像素与白色的欧氏距离
            // 之前用 r>240 && g>240 && b>240，只有 213 像素被透明化（0.0%）
            // 因为键盘图片背景不是纯白色，而是接近白色的浅灰色/米白色
            // 改用颜色距离 < 80 的像素都透明化，能更好地处理接近白色的背景
            const dist = Math.sqrt((255-r)*(255-r) + (255-g)*(255-g) + (255-b)*(255-b));
            if (dist < 80) {
              data[i+3] = 0;
              transparentCount++;
            } else {
              // 非白色像素：更新边界框
              contentCount++;
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
        }
        ctx.putImageData(imageData, 0, 0);
        const contentW = maxX - minX + 1;
        const contentH = maxY - minY + 1;
        console.log('[Bongocat] makeWhiteTransparent: 透明占比=', (transparentCount/(img.width*img.height)*100).toFixed(1) + '%',
          '内容像素数=', contentCount,
          '内容边界框: x=', minX, 'y=', minY, 'w=', contentW, 'h=', contentH,
          '内容占比=', (contentW*contentH/(img.width*img.height)*100).toFixed(1) + '%');
        return canvas;
      } catch (e) {
        console.error('[Bongocat] makeWhiteTransparent 失败:', e.message);
        return img;
      }
    }

    // ★ 显示按键图片（小宠物站在按键上），按键时显示，释放时隐藏
    // 参考 ayangweb/BongoCat：直接用 <img> 标签显示，用 CSS object-fit: contain 控制大小
    function showKeyImage(keyName) {
      if (!bongoKeyImages || !keyName) return false;
      const imagePath = bongoKeyImages[keyName];
      if (!imagePath) return false;
      try {
        const imgEl = document.getElementById('bongo-key-image');
        if (!imgEl) {
          console.error('[Bongocat] showKeyImage: 找不到 bongo-key-image 元素');
          return false;
        }
        // 使用 file:/// 协议加载本地图片
        const texUrl = 'file:///' + imagePath.replace(/\\/g, '/');
        imgEl.onload = () => {
          console.log('[Bongocat] 按键图片加载成功:', keyName,
            'naturalWidth=', imgEl.naturalWidth, 'naturalHeight=', imgEl.naturalHeight);
        };
        imgEl.onerror = () => {
          console.error('[Bongocat] 按键图片加载失败:', keyName, 'url=', texUrl);
        };
        imgEl.src = texUrl;
        imgEl.style.display = 'block';
        // ★ 调试：输出按键图片的位置、大小、z-index，确认是否正确显示
        const rect = imgEl.getBoundingClientRect();
        const containerRect = document.getElementById('canvas-container').getBoundingClientRect();
        console.log('[Bongocat] ★ 按键图片显示诊断:', keyName,
          'elementPos=', imgEl.style.left, ',', imgEl.style.top,
          'elementSize=', imgEl.style.width, 'x', imgEl.style.height,
          'rect=', rect.width.toFixed(0), 'x', rect.height.toFixed(0), '@', rect.left.toFixed(0), ',', rect.top.toFixed(0),
          'container=', containerRect.width.toFixed(0), 'x', containerRect.height.toFixed(0),
          'zIndex=', imgEl.style.zIndex,
          'display=', imgEl.style.display,
          'opacity=', imgEl.style.opacity);
        console.log('[Bongocat] 显示按键图片:', keyName, 'url=', texUrl);
        return true;
      } catch (e) {
        console.error('[Bongocat] showKeyImage 异常:', keyName, e.message);
        return false;
      }
    }

    // ★ 隐藏按键图片（释放按键时调用，只显示背景）
    function hideKeyImage() {
      try {
        const imgEl = document.getElementById('bongo-key-image');
        if (imgEl) {
          imgEl.style.display = 'none';
          console.log('[Bongocat] 隐藏按键图片');
        }
      } catch (e) {}
    }

    // ★ 更新键盘叠加层：按键按下时切换到对应键的高亮图片，释放时恢复默认图片
    // ★ 通用：在 bongoKeyImages 中查找按键图片（支持多种命名变体）
    // 不同模型的按键图片命名习惯不同：KeyA, A, Shift, num1, 1, Num1 等
    function findBongoKeyImage(code) {
      if (!bongoKeyImages || !code) return null;
      // 直接匹配
      if (bongoKeyImages[code]) return { keyName: code, imagePath: bongoKeyImages[code] };
      // 变体匹配
      const digitNum = code.replace(/^Digit/, '');  // Digit1 → 1
      const numpadNum = code.replace(/^Numpad/, ''); // Numpad1 → 1
      // 方向键的常见命名：ArrowUp → Up / ArrowUp / UpArrow 等
      const arrowName = code.replace(/^Arrow/, '');  // ArrowUp → Up
      const variants = [
        code.replace(/Left$|Right$/, ''),       // ShiftLeft → Shift, ControlLeft → Control
        digitNum,                                  // Digit1 → 1
        code.replace(/^Key/, ''),                 // KeyA → A
        numpadNum,                                 // Numpad0 → 0
        code === 'Space' ? ' ' : null,           // Space → " "
        code === 'Enter' ? 'Return' : null,      // Enter → Return
        code === 'Escape' ? 'Esc' : null,        // Escape → Esc
        // 数字键的常见命名：num1, Num1, number1 等（部分模型用 num 前缀）
        code.startsWith('Digit') ? 'num' + digitNum : null,    // Digit1 → num1
        code.startsWith('Digit') ? 'Num' + digitNum : null,    // Digit1 → Num1
        code.startsWith('Numpad') ? 'num' + numpadNum : null,  // Numpad1 → num1
        code.startsWith('Numpad') ? 'Num' + numpadNum : null,  // Numpad1 → Num1
        code.startsWith('Digit') ? 'number' + digitNum : null, // Digit1 → number1
        // ★ 方向键的常见命名：Up, Down, Left, Right, ArrowUp 等
        code.startsWith('Arrow') ? arrowName : null,            // ArrowUp → Up
        code.startsWith('Arrow') ? 'Arrow' + arrowName : null, // ArrowUp → ArrowUp
        code.startsWith('Arrow') ? arrowName + 'Arrow' : null, // ArrowUp → UpArrow
        // ★ 方向键映射到 WASD（部分模型只有字母键图片，方向键映射到对应方向的字母）
        code === 'ArrowUp' ? 'W' : null,
        code === 'ArrowUp' ? 'KeyW' : null,
        code === 'ArrowDown' ? 'S' : null,
        code === 'ArrowDown' ? 'KeyS' : null,
        code === 'ArrowLeft' ? 'A' : null,
        code === 'ArrowLeft' ? 'KeyA' : null,
        code === 'ArrowRight' ? 'D' : null,
        code === 'ArrowRight' ? 'KeyD' : null,
        // ★ WASD 反向映射到方向键（部分模型只有方向键图片，WASD 映射到对应方向）
        // 支持多种命名：Up/ArrowUp/UpArrow, Down/ArrowDown/DownArrow, Left/ArrowLeft/LeftArrow, Right/ArrowRight/RightArrow
        code === 'KeyW' || code === 'W' ? 'Up' : null,
        code === 'KeyW' || code === 'W' ? 'ArrowUp' : null,
        code === 'KeyW' || code === 'W' ? 'UpArrow' : null,
        code === 'KeyS' || code === 'S' ? 'Down' : null,
        code === 'KeyS' || code === 'S' ? 'ArrowDown' : null,
        code === 'KeyS' || code === 'S' ? 'DownArrow' : null,
        code === 'KeyA' || code === 'A' ? 'Left' : null,
        code === 'KeyA' || code === 'A' ? 'ArrowLeft' : null,
        code === 'KeyA' || code === 'A' ? 'LeftArrow' : null,
        code === 'KeyD' || code === 'D' ? 'Right' : null,
        code === 'KeyD' || code === 'D' ? 'ArrowRight' : null,
        code === 'KeyD' || code === 'D' ? 'RightArrow' : null,
      ].filter(Boolean);
      for (const v of variants) {
        if (bongoKeyImages[v]) {
          return { keyName: v, imagePath: bongoKeyImages[v] };
        }
      }
      return null;
    }

    // 键盘一直显示，只是切换高亮的键
    function updateBongoKeyOverlay(code, isDown) {
      console.log('[Bongocat] updateBongoKeyOverlay: code=', code, 'isDown=', isDown,
        'hasImages=', !!bongoKeyImages, 'active=', bongoInteractionActive);
      if (!bongoKeyImages || bongoDestroyed || !bongoInteractionActive) return;
      if (!code) return;

      // 使用通用查找函数（支持 num1 等多种命名）
      const found = findBongoKeyImage(code);
      if (!found) return; // 这个键没有对应的键盘图片
      const keyName = found.keyName;

      if (isDown) {
        // 按键按下：显示按键图片（小宠物站在按键上）
        console.log('[Bongocat] 按键按下，显示按键图片:', keyName);
        showKeyImage(keyName);
      } else {
        // 按键释放：隐藏按键图片（只显示背景）
        console.log('[Bongocat] 按键释放，隐藏按键图片');
        hideKeyImage();
      }
    }

    // ★ 键位映射：根据按键的 code 判断左手/右手，并计算手的 x 位置（-1~1，-1最左，1最右）
    // 之前所有按键都只触发左手 bongoHandTap=1，导致左手"一闪一闪"，没有同步操作模型自带的键盘组件。
    // 现在根据按键的实际位置区分左手/右手，并设置手的 x 坐标，实现真正的键盘同步操作。
    const BONGO_LEFT_KEYS = new Set([
      'KeyQ','KeyW','KeyE','KeyR','KeyT',
      'KeyA','KeyS','KeyD','KeyF','KeyG',
      'KeyZ','KeyX','KeyC','KeyV','KeyB',
      'Digit1','Digit2','Digit3','Digit4','Digit5',
      'Backquote','Tab','CapsLock','ShiftLeft','ControlLeft','AltLeft','MetaLeft'
    ]);
    const BONGO_RIGHT_KEYS = new Set([
      'KeyY','KeyU','KeyI','KeyO','KeyP',
      'KeyH','KeyJ','KeyK','KeyL',
      'KeyN','KeyM',
      'Digit6','Digit7','Digit8','Digit9','Digit0',
      'Minus','Equal','BracketLeft','BracketRight','Backslash',
      'Semicolon','Quote','Comma','Period','Slash',
      'Backspace','Enter','ShiftRight','ControlRight','AltRight','MetaRight',
      // ★ 方向键（通常在键盘右侧，用右手操作）
      'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
      // ★ 导航键区
      'Insert','Delete','Home','End','PageUp','PageDown',
      // ★ 小键盘方向键（如果模型支持）
      'Numpad8','Numpad2','Numpad4','Numpad6',
    ]);
    function getBongoKeyHand(code) {
      if (!code) return { hand: 'left', x: -0.5 };
      if (code === 'Space') return { hand: 'both', x: 0 };
      // ★ 方向键绑定到 WASD：手部动作和 WASD 一样（左手），x 位置对应 W/A/S/D
      if (code === 'ArrowUp') return { hand: 'left', x: -0.81 };    // 对应 W
      if (code === 'ArrowDown') return { hand: 'left', x: -0.76 };  // 对应 S
      if (code === 'ArrowLeft') return { hand: 'left', x: -0.95 };  // 对应 A
      if (code === 'ArrowRight') return { hand: 'left', x: -0.57 }; // 对应 D
      // ★ 小键盘方向键也绑定到 WASD
      if (code === 'Numpad8') return { hand: 'left', x: -0.81 };
      if (code === 'Numpad2') return { hand: 'left', x: -0.76 };
      if (code === 'Numpad4') return { hand: 'left', x: -0.95 };
      if (code === 'Numpad6') return { hand: 'left', x: -0.57 };
      if (BONGO_LEFT_KEYS.has(code)) {
        // 左手键：根据键的列位置计算 x（-1 ~ -0.1）
        const leftOrder = ['Q','A','Z','1','W','S','X','2','E','D','C','3','R','F','V','4','T','G','B','5'];
        const keyLetter = code.replace('Key','').replace('Digit','');
        const idx = leftOrder.indexOf(keyLetter);
        const x = idx >= 0 ? -1 + (idx / (leftOrder.length - 1)) * 0.9 : -0.5;
        return { hand: 'left', x: Math.max(-1, Math.min(-0.1, x)) };
      }
      if (BONGO_RIGHT_KEYS.has(code)) {
        // 右手键：根据键的列位置计算 x（0.1 ~ 1）
        const rightOrder = ['6','Y','H','N','7','U','J','M','8','I','K','Comma','9','O','L','Period','0','P','Semicolon','Slash','Minus','BracketLeft','Quote','Backspace','Equal','BracketRight','Backslash','Enter'];
        const keyLetter = code.replace('Key','').replace('Digit','');
        const idx = rightOrder.indexOf(keyLetter);
        const x = idx >= 0 ? 0.1 + (idx / (rightOrder.length - 1)) * 0.9 : 0.5;
        return { hand: 'right', x: Math.max(0.1, Math.min(1, x)) };
      }
      // 未知键：不触发手（只有模型支持的按键才显示手）
      return null;
    }

    // Bongocat 打字：根据按键位置区分左手/右手，同步操作模型自带的键盘组件
    function bongocatTypeDirect(code) {
      if (!bongoInteractionActive || !currentModel || !currentModel.internalModel) return false;
      // ★ 修复：只有模型支持的按键（有对应按键图片）才触发手部动作
      // 使用通用查找函数（支持 num1 等多种命名），确保和 updateBongoKeyOverlay 一致
      const found = findBongoKeyImage(code);
      if (bongoKeyImages && Object.keys(bongoKeyImages).length > 0 && !found) {
        console.log('[Bongocat] bongocatTypeDirect: 模型不支持按键', code, '，跳过');
        return false;
      }
      const keyInfo = getBongoKeyHand(code);
      // 未知键：不触发手（只有模型支持的按键才显示手）
      if (!keyInfo) return false;
      // 设置手的 x 位置（如果模型有这些参数）
      if (keyInfo.hand === 'left' || keyInfo.hand === 'both') {
        bongoLeftHandX = keyInfo.x;
        bongoLeftHandTap = 1;
      }
      if (keyInfo.hand === 'right' || keyInfo.hand === 'both') {
        bongoRightHandX = keyInfo.x;
        bongoRightHandTap = 1;
      }
      // 兼容旧逻辑
      bongoHandTap = 1;
      // ★ 键盘叠加层高亮：按键时高亮对应的图片
      if (bongoKeySprites && code && !bongoDestroyed) {
        const sprite = bongoKeySprites[code];
        if (sprite && sprite.scale) {
          try {
            sprite.alpha = 1;
            const origScaleX = sprite.scale.x;
            const origScaleY = sprite.scale.y;
            sprite.scale.set(origScaleX * 1.1, origScaleY * 1.1);
            // 200ms 后恢复
            setTimeout(() => {
              // ★ 防崩溃：检查销毁标志和 sprite 是否仍然存在
              if (bongoDestroyed || !bongoKeySprites || !bongoKeySprites[code]) return;
              try {
                const s = bongoKeySprites[code];
                if (s && s.scale) {
                  s.alpha = 0.6;
                  s.scale.set(origScaleX, origScaleY);
                }
              } catch (e) {}
            }, 200);
          } catch (e) {
            console.warn('[Bongocat] 键盘高亮异常:', e.message);
          }
        }
      }
      return true;
    }

    // 收集模型真实参数 ID（多 API 兜底，独立函数便于 startBongocatMode 多次重试）
    function collectBongoParams() {
      const allParams = [];
      try {
        const im = currentModel && currentModel.internalModel;
        const core = im && im.coreModel;
        // 方式1: core.getParameterIds()（Cubism4 标准 API，返回参数 ID 数组）
        if (allParams.length === 0 && core && typeof core.getParameterIds === 'function') {
          try {
            const ids = core.getParameterIds();
            if (Array.isArray(ids)) ids.forEach(id => { if (id) allParams.push(id); });
          } catch (_) {}
        }
        // 方式2: core._parameterIds 对象（Cubism4 内部存储，键为数字索引）
        if (allParams.length === 0 && core && core._parameterIds && typeof core._parameterIds === 'object') {
          try {
            for (const k in core._parameterIds) {
              const id = core._parameterIds[k];
              if (id) allParams.push(id);
            }
          } catch (_) {}
        }
        // 方式3: core.parameters 数组
        if (allParams.length === 0 && core && core.parameters && Array.isArray(core.parameters)) {
          core.parameters.forEach(p => { if (p) allParams.push(p.id || p.name); });
        }
        // 方式4: getParameterCount + getParameterId（部分版本 API，不存在则静默跳过）
        if (allParams.length === 0 && core && typeof core.getParameterCount === 'function' && typeof core.getParameterId === 'function') {
          const count = core.getParameterCount();
          for (let i = 0; i < count; i++) {
            try {
              const id = core.getParameterId(i);
              if (id) allParams.push(id);
            } catch (_) {}
          }
        }
        // 方式5: internalModel.parameters（pixi-live2d-display 封装层）
        if (allParams.length === 0 && im && im.parameters && Array.isArray(im.parameters)) {
          im.parameters.forEach(p => { if (p) allParams.push(p.id || p.name); });
        }
        // 方式6: 遍历 coreModel 所有属性找参数对象（极端兜底）
        if (allParams.length === 0 && core) {
          try {
            for (const key in core) {
              if (key === 'parameters' || key === '_parameters') continue;
              const val = core[key];
              if (val && typeof val === 'object' && (val.id || val.name) && typeof val.value !== 'undefined') {
                allParams.push(val.id || val.name);
              }
            }
          } catch (_) {}
        }
      } catch (e) {}
      return allParams;
    }

    // ★ 通用：启动 BongoCat 键盘猫模式（隐藏UI + 禁用穿透 + 启动特殊交互）
    // 供 bongocat:load-model（主界面"启动BongoCat"按钮）和 model:changed（从模型列表"应用"BongoCat模型）共用。
    // 修复：从模型列表"应用"BongoCat模型时只走 loadModel，不启动特殊交互，导致鼠标跟随/打字响应全部失效。
    //
    // ★ 关键修复（时序竞态）：
    // 之前固定 setTimeout 200ms 后取参数，但此时 coreModel.parameters 经常还没填充（异步加载），
    // collectBongoParams() 返回 [] → bongoParamIds 为空 → setLive2DParam 全部 no-op →
    // 「BongoCat 特性完全失效」。改为轮询等待参数就绪（最多 1.5s）。
    //
    // ★ 关键修复（全局键盘钩子）：
    // 之前只有「主界面点启动 BongoCat 按钮」走 bongocat:load-model 路径会在主进程启动全局钩子，
    // 但「从模型列表应用一个 BongoCat 模型」走 model:changed 路径时主进程根本不知道，
    // 全局键按下永远不会变成 bongocat 打字动作 → 特性半失效。现在通过
    // window.api.setBongocatActive(true) 让主进程统一启停钩子。
    async function startBongocatMode() {
      console.log('[BongoCat] ★ startBongocatMode 被调用! currentModel=', !!currentModel,
        'currentModelInfo=', currentModelInfo ? JSON.stringify({installPath: currentModelInfo.installPath, isBongocat: currentModelInfo.isBongocat}) : 'null');
      if (!currentModel) {
        console.warn('[BongoCat] startBongocatMode: 当前无模型，跳过');
        return false;
      }
      try {
        window.isBongocatMode = true;
        // ★ 立即停用普通宠物行为：清除可能已在排程的睡眠/随机动作计时器，
        // 若当前正处于睡眠态则退出（恢复亮度、清除 ZZZ）。键盘猫只由键盘/鼠标驱动。
        try {
          PetBrain.cancelSleep();
          clearTimeout(PetBrain.randomActionTimer);
          if (PetBrain.state === 'SLEEPING') {
            PetBrain.state = 'AWAKE';
            PetBrain.exitSleep();
          }
          PetBrain.stopIdleCombo();
        } catch (e) { console.warn('[BongoCat] 停用普通宠物行为失败(忽略):', e.message); }
        // 隐藏AI输入框和右键菜单栏
        if (inputArea) {
          inputArea.style.display = 'none';
          inputArea.classList.remove('show');
        }
        if (actionMenu) {
          actionMenu.style.display = 'none';
          actionMenu.classList.remove('show');
        }
        // ★ 点击穿透：根据用户设置应用，不强制覆盖
        //   - 开启完全穿透：点击穿透到后方窗口，模型不能拖动（眼球跟踪用全局事件不受影响）
        //   - 关闭穿透（动态穿透）：透明区域穿透，模型区域可拖动
        //   关键：必须同时设置 container.style.pointerEvents，否则之前开启穿透留下的 none 会导致无法拖动
        const userClickThrough = !!(petConfig && petConfig.pet && petConfig.pet.clickThrough);
